<style>
  :root {

  heart: '<path d="M12 21.5S2 15.5 2 8.5A5.2 5.2 0 0 1 12 6a5.2 5.2 0 0 1 10 2.5c0 7-10 13-10 13z"/><path class="s" d="M12 21.5V6a5.2 5.2 0 0 1 10 2.5c0 7-10 13-10 13z"/><path class="d" d="M3.5 11.5h4l1.6-3 2.4 6.5 2.2-8 1.8 4.5h5v1.8h-6.2l-.6-1.4-2.3 8.2-2.5-7-.8 1.6H3.5z"/>'
};
function icon(name, cls) { return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24">' + (IC[name] || IC.note) + '</svg>'; }
var STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6z"/></svg>';

/* ================= storage ================= */
function load(k, d) { try { var v = localStorage.getItem('sb-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem('sb-' + k, JSON.stringify(v)); } catch (e) {} }
var favs = load('favs', []); if (!Array.isArray(favs)) favs = [];
var vol = +load('vol', 80); if (!(vol >= 0 && vol <= 100)) vol = 80;
var mode = load('mode', 'stack') === 'solo' ? 'solo' : 'stack';
var cat = load('cat', 'all'); var query = '';

/* ================= engine ================= */
var ctx = null, master = null, voices = [];
function getCtx() {
  if (ctx) return ctx;
  var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { try { ctx = new AC(); } catch (e2) { return null; } }
  master = ctx.createGain(); master.gain.value = gainFor(vol);
  var comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -8; comp.knee.value = 6; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.15;
  master.connect(comp); comp.connect(ctx.destination);
  return ctx;
}
function gainFor(v) { return Math.pow(v / 100, 1.6) * 1.1; }
var unlocked = false;
function unlock() {
  var c = getCtx(); if (!c) return;
  if (c.state !== 'running') { try { c.resume(); } catch (e) {} }
  if (!unlocked) { unlocked = true; try { var b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) {} }
}
['pointerdown', 'touchend', 'mousedown', 'keydown', 'click'].forEach(function (ev) { document.addEventListener(ev, unlock, true); });

function play(id) {
  var snd = BY[id], c = getCtx(); if (!snd || !c) return;
  if (c.state !== 'running') { try { c.resume(); } catch (e) {} }
  if (mode === 'solo') stopAll();
  var out = c.createGain(); out.connect(master);
  var t = c.currentTime + 0.012;
  try { snd.fn(c, out, t); } catch (e) { try { out.disconnect(); } catch (e2) {} return; }
  var v = { id: id, out: out, timer: 0 };
  v.timer = setTimeout(function () { endVoice(v, false); }, (snd.dur + 0.05) * 1000);
  voices.push(v); refresh(id, true);
}
function endVoice(v, fade) {
  var i = voices.indexOf(v); if (i < 0) return;
  voices.splice(i, 1); clearTimeout(v.timer);
  if (fade && ctx) {
    try { v.out.gain.cancelScheduledValues(ctx.currentTime); v.out.gain.setTargetAtTime(0, ctx.currentTime, 0.012); } catch (e) {}
    setTimeout(function () { try { v.out.disconnect(); } catch (e) {} }, 150);
  } else { try { v.out.disconnect(); } catch (e) {} }
  refresh(v.id, false);
}
function stopAll() { voices.slice().forEach(function (v) { endVoice(v, true); }); }

/* ================= UI ================= */
var CATS = [['all', 'All'], ['fav', 'Favorites'], ['reactions', 'Reactions'], ['cartoon', 'Cartoon'], ['game', 'Game'], ['ambience', 'Ambience'], ['stings', 'Music Stings']];
var KEYS = '1234567890qwertyuiopasdfgjklzxcvbnm';
var grid = document.getElementById('grid'), catsEl = document.getElementById('cats'), pads = {}, visible = [];

function buildCats() {
  catsEl.innerHTML = '';
  CATS.forEach(function (cc) {
    var b = document.createElement('button'); b.className = 'hbtn'; b.dataset.c = cc[0];
    b.innerHTML = (cc[0] === 'fav' ? STAR : '') + cc[1];
    b.addEventListener('click', function () { cat = cc[0]; save('cat', cat); render(); });
    catsEl.appendChild(b);
  });
}
function makePad(s) {
  var b = document.createElement('div'); b.className = 'pad'; b.dataset.id = s.id; b.dataset.k = SOUNDS.indexOf(s) % 6; b.setAttribute('role', 'button');
  b.innerHTML = '<span class="key"></span><button class="fav" type="button">' + STAR + '</button>' + icon(s.icon, 'ic') + '<span class="nm">' + s.name + '</span><span class="bar"></span>';
  var fav = b.querySelector('.fav');
  fav.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  fav.addEventListener('click', function (e) {
    e.stopPropagation(); var i = favs.indexOf(s.id);
    if (i < 0) favs.push(s.id); else favs.splice(i, 1);
    save('favs', favs); if (cat === 'fav') render(); else fav.classList.toggle('on', i < 0);
  });
  b.addEventListener('pointerdown', function (e) {
    if (e.button != null && e.button > 0) return;
    pressAnim(b); play(s.id);
  });
  return b;
}
function pressAnim(b) { b.classList.add('down'); clearTimeout(b.__pt); b.__pt = setTimeout(function () { b.classList.remove('down'); }, 110); }
function render() {
  Array.prototype.forEach.call(catsEl.children, function (b) { b.classList.toggle('on', b.dataset.c === cat); });
  var q = query.trim().toLowerCase();
  visible = SOUNDS.filter(function (s) {
    if (cat === 'fav' && favs.indexOf(s.id) < 0) return false;
    if (cat !== 'all' && cat !== 'fav' && s.cat !== cat) return false;
    if (q && (s.name + ' ' + s.cat).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  grid.innerHTML = '';
  visible.forEach(function (s, i) {
    var p = pads[s.id] || (pads[s.id] = makePad(s));
    p.querySelector('.key').textContent = KEYS[i] || '';
    p.querySelector('.fav').classList.toggle('on', favs.indexOf(s.id) >= 0);
    grid.appendChild(p);
  });
  if (!visible.length) { var e = document.createElement('div'); e.className = 'empty'; e.innerHTML = (cat === 'fav' && !q ? STAR : icon('cross')) + '<span>' + (cat === 'fav' && !q ? 'No favorites yet' : 'No sounds match') + '</span>'; grid.appendChild(e); }
}
function refresh(id, started) {
  var p = pads[id], n = 0;
  voices.forEach(function (v) { if (v.id === id) n++; });
  if (p) {
    p.classList.toggle('play', n > 0);
    var bar = p.querySelector('.bar');
    if (started) { bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = 'prog ' + BY[id].dur + 's linear forwards'; }
    else if (!n) bar.style.animation = 'none';
  }
  var live = document.getElementById('live');
  document.getElementById('liveN').textContent = voices.length;
  live.classList.toggle('idle', !voices.length);
}

/* controls */
document.getElementById('brand').addEventListener('click', function () { try { parent.postMessage({ type: 'games-menu' }, '*'); } catch (e) {} });
document.getElementById('stopAll').addEventListener('click', stopAll);
var volEl = document.getElementById('vol'), volPct = document.getElementById('volPct'), lastVol = vol || 80;
function setVol(v, persist) {
  vol = Math.max(0, Math.min(100, Math.round(v))); volEl.value = vol; volPct.textContent = vol;
  volEl.style.setProperty('--p', vol + '%');
  document.getElementById('volWaves').style.opacity = vol ? 1 : 0.2;
  if (master && ctx) master.gain.setTargetAtTime(gainFor(vol), ctx.currentTime, 0.02);
  if (persist) save('vol', vol);
}
volEl.addEventListener('input', function () { setVol(+volEl.value, true); if (vol) lastVol = vol; });
document.getElementById('muteIc').addEventListener('click', function () { if (vol) { lastVol = vol; setVol(0, true); } else setVol(lastVol || 80, true); });
var modeEl = document.getElementById('mode');
function setMode(m) { mode = m; save('mode', m); Array.prototype.forEach.call(modeEl.children, function (b) { b.classList.toggle('on', b.dataset.m === m); }); }
Array.prototype.forEach.call(modeEl.children, function (b) { b.addEventListener('click', function () { setMode(b.dataset.m); if (mode === 'solo' && voices.length > 1) { voices.slice(0, -1).forEach(function (v) { endVoice(v, true); }); } }); });
var qEl = document.getElementById('q'), sBox = document.getElementById('searchBox');
qEl.addEventListener('input', function () { query = qEl.value; sBox.classList.toggle('has', !!query); render(); });
document.getElementById('clr').addEventListener('click', function (e) { e.preventDefault(); qEl.value = ''; query = ''; sBox.classList.remove('has'); render(); });

document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var k = (e.key || '').toLowerCase();
  if (k === 'h') return;
  if (e.target === qEl) { if (k === 'escape') { qEl.blur(); } return; }
  if (k === 'escape') { stopAll(); return; }
  if (e.repeat) return;
  var i = KEYS.indexOf(k);
  if (i < 0 || k.length !== 1 || !visible[i]) return;
  e.preventDefault();
  var p = pads[visible[i].id]; if (p) pressAnim(p);
  play(visible[i].id);
});

buildCats(); setVol(vol, false); setMode(mode);
if (!CATS.some(function (c) { return c[0] === cat; })) cat = 'all';
render();

window.SOUNDBOARD = { sounds: SOUNDS, play: play, stopAll: stopAll, voices: voices };
})();
</script>
