<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrica: Classic</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --font: 'Inter', ui-sans-serif, 'Helvetica Neue', Arial, sans-serif;
    --bg: #f2f0ea; --panel: #f8f7f3; --panel2: #e6e3da; --panel3: #ffffff; --hover: #d9d5ca; --edge: #d1cdc2;
    --fg: #171717; --fg2: #6e6c64; --fg3: rgba(23,23,23,0.38); --lbl: #6e6c64;
    --accent: #2b3fd3; --accent-hi: #2234bb; --accent-fg: #ffffff; --good: #1c6b42; --bad: #a33025; --gold: #8a6a00;
    --shadow: 0 1px 0 rgba(23,23,23,0.04), 0 10px 30px -18px rgba(23,23,23,0.35);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #171716; --panel: #1e1e1c; --panel2: #2c2c28; --panel3: #232322; --hover: #3a3a35; --edge: rgba(255,255,255,0.14);
    --fg: #ebeae5; --fg2: #a3a199; --fg3: rgba(235,234,229,0.4); --lbl: #a3a199;
    --accent: #8b97ff; --accent-hi: #7a87f2; --accent-fg: #101010; --good: #5cb485; --bad: #e07a6d; --gold: #d3ab2a;
    --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 14px 34px -18px rgba(0,0,0,0.8);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  *:focus, *:focus-visible { outline: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }
  canvas { display: block; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .lbl { font: 600 12px/1.3 var(--font); letter-spacing: 0.04em; text-transform: uppercase; color: var(--lbl); }

  /* top bar */
  #bar { flex: none; position: relative; z-index: 20; height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 24px;
    background: var(--bg); border-bottom: 1px solid var(--edge); min-width: 0; }
  .brand { cursor: pointer; font: 800 26px/1 var(--font); text-transform: uppercase; letter-spacing: -0.02em; white-space: nowrap; }
  #crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 14px; border-left: 1px solid var(--edge); line-height: 26px; }
  #crumb b { font-weight: 700; color: var(--fg); }
  #crumb span { margin-left: 10px; }
  #crumb .tag { color: var(--accent); }
  #bar .sp { flex: 1; min-width: 4px; }
  #hud { display: flex; align-items: center; gap: 2px; }
  .st { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; min-width: 52px; padding: 0 10px; }
  .st .k { font: 600 11px/1.2 var(--font); letter-spacing: 0.04em; text-transform: uppercase; color: var(--lbl); margin-bottom: 3px; white-space: nowrap; }
  .st b { font: 800 21px/1.05 var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #acts { display: flex; align-items: center; gap: 8px; }

  .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; cursor: pointer;
    font: 600 12.5px/1.2 var(--font); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;
    background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 0;
    transform: scale(1); transition: background .15s, opacity .15s, transform .32s cubic-bezier(0.34, 1.9, 0.6, 1); }
  .btn:not(:disabled):active { transform: scale(0.94); transition-duration: .15s, .15s, .08s; transition-timing-function: ease; }
  .btn.ghost { background: var(--panel2); color: var(--fg); }
  .btn.line { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--edge); }
  .btn.danger { background: var(--panel2); color: var(--bad); }
  .btn.sm { min-height: 38px; padding: 8px 14px; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn svg { width: 14px; height: 14px; fill: currentColor; }
  @media (hover: hover) { .btn:not(:disabled):hover { background: var(--accent-hi); } .btn.ghost:not(:disabled):hover, .btn.danger:not(:disabled):hover { background: var(--hover); }
    .btn.line:not(:disabled):hover { background: var(--panel2); } }

  .tb { width: 40px; height: 40px; flex: none; border: 0; border-radius: 0; cursor: pointer; background: var(--panel2); color: var(--fg);
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    transform: scale(1); transition: background .15s, transform .32s cubic-bezier(0.34, 1.9, 0.6, 1); }
  .tb:active { transform: scale(0.88); transition-duration: .15s, .08s; }
  .tb.on { background: var(--fg); color: var(--bg); }
  .tb:disabled { opacity: 0.35; cursor: default; }
  .tb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tb.plain { background: transparent; }
  @media (hover: hover) { .tb:not(.on):not(:disabled):hover { background: var(--hover); } }

  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; }
  .seg button { min-height: 40px; padding: 10px 16px; border: 0; border-radius: 0; cursor: pointer; background: var(--panel2);
    font: 600 12.5px/1.2 var(--font); letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg); }
  .seg button.on { background: var(--fg); color: var(--bg); }
  @media (hover: hover) { .seg button:not(.on):hover { background: var(--hover); } }

  .inp { min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--edge); border-radius: 0; background: var(--panel3);
    color: var(--fg); font: 600 16px/1.3 var(--font); -webkit-user-select: text; user-select: text; }
  .inp:focus { border-color: var(--fg2); }

  /* stage */
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
  #stage.edit #cv { cursor: crosshair; }
  #stage.edit.pan #cv { cursor: grab; }

  /* menu */
  #menu { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); scrollbar-width: none; }
  #menu::-webkit-scrollbar { display: none; }
  .mwrap { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 20px; max-width: 1240px; margin: 0 auto; padding: 28px 24px 40px; min-height: 100%; align-content: start; }
  .mcol { min-width: 0; display: flex; flex-direction: column; }
  .mcol .seg { margin-bottom: 14px; }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .lrow { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; width: 100%; min-height: 64px; padding: 12px 16px 14px;
    border: 0; border-radius: 0; background: var(--panel2); cursor: pointer; text-align: left; transition: background .15s; }
  .lrow .n { font: 800 13px/1 var(--font); color: var(--fg3); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .lrow .nm { font: 700 17px/1.25 var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .pc { font: 800 15px/1 var(--font); font-variant-numeric: tabular-nums; text-align: right; }
  .lrow .pc.z { color: var(--fg3); }
  .lrow .meter { grid-column: 2 / 4; }
  .lrow.on { background: var(--fg); color: var(--bg); }
  .lrow.on .n, .lrow.on .pc.z { color: var(--bg); opacity: 0.55; }
  .lrow.on .meter { background: rgba(127,127,127,0.35); }
  .lrow.on .meter i { background: var(--bg); }
  @media (hover: hover) { .lrow:not(.on):hover { background: var(--hover); } }
  .meter { position: relative; height: 3px; background: var(--edge); overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); }
  .meter.p i { background: var(--accent); }
  .lnew { margin-top: 12px; }
  .empty { padding: 26px 16px; background: var(--panel2); color: var(--fg3); font: 600 12.5px/1.3 var(--font); letter-spacing: 0.04em; text-transform: uppercase; }
  .pips { display: inline-flex; gap: 3px; vertical-align: middle; }
  .pips i { width: 7px; height: 7px; background: var(--edge); }
  .pips i.f { background: var(--fg); }
  .lrow.on .pips i { background: rgba(127,127,127,0.45); }
  .lrow.on .pips i.f { background: var(--bg); }

  .detail { background: var(--panel); border: 1px solid var(--edge); box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; }
  .pvwrap { position: relative; aspect-ratio: 16 / 7; border-bottom: 1px solid var(--edge); overflow: hidden; background: var(--bg); }
  .pvwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dbody { padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 18px; }
  .dhead { display: flex; align-items: center; gap: 14px; }
  .dhead .lbl { display: inline-flex; align-items: center; gap: 12px; }
  .dname { font: 800 46px/1.02 var(--font); text-transform: uppercase; letter-spacing: -0.03em; overflow-wrap: anywhere; margin: -4px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
  .stats > div { padding: 14px 0 14px 16px; border-left: 1px solid var(--edge); min-width: 0; }
  .stats > div:first-child { border-left: 0; padding-left: 0; }
  .stats b { display: block; font: 800 26px/1.1 var(--font); font-variant-numeric: tabular-nums; margin-top: 5px; white-space: nowrap; }
  .bars { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  .bars .lbl { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .bars .lbl b { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
  .bars .meter { height: 6px; }
  .dacts { display: flex; gap: 10px; flex-wrap: wrap; }
  .dacts .btn { min-width: 132px; min-height: 48px; }
  .dacts .sp { flex: 1; }

  /* overlays */
  .ovl { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: color-mix(in srgb, var(--bg) 52%, transparent); animation: fade .18s ease both; }
  .card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--edge); box-shadow: var(--shadow); padding: 26px; animation: rise .32s cubic-bezier(.2,.8,.2,1) both; }
  .card .big { font: 800 44px/1.04 var(--font); text-transform: uppercase; letter-spacing: -0.03em; margin: 6px 0 20px; overflow-wrap: anywhere; }
  .card .stats { margin-bottom: 22px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card .col { display: flex; flex-direction: column; gap: 8px; }
  .card .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  #flash { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none; text-align: center; }
  #flash b { display: block; font: 800 88px/1 var(--font); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  #flash .lbl { margin-top: 10px; color: var(--accent); font-size: 13px; }
  #flash.go { animation: flash .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes flash { 0% { opacity: 0; transform: translate(-50%, -40%); } 18% { opacity: 1; transform: translate(-50%, -50%); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -54%); } }

  #prac { position: absolute; left: 20px; bottom: 20px; z-index: 5; display: flex; gap: 6px; }
  #prac .tb { width: 52px; height: 52px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--edge); }
  #prac .tb svg { width: 22px; height: 22px; }

  #toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 12; padding: 10px 16px; background: var(--fg); color: var(--bg);
    font: 600 12.5px/1.2 var(--font); letter-spacing: 0.04em; text-transform: uppercase; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #toast.on { opacity: 1; }

  .ttag { font: 700 11px/1 var(--font); letter-spacing: 0.06em; text-transform: uppercase; background: var(--accent); color: var(--accent-fg); padding: 5px 7px 4px; }
  .lk svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; vertical-align: middle; }
  .lrow.locked .nm { color: var(--fg3); }
  .lrow.on.locked .nm { color: var(--bg); opacity: 0.6; }
  .dlk { margin-left: auto; color: var(--fg2); }
  .cz { display: flex; flex-direction: column; }
  .cz > .lbl { margin: 4px 0 10px; }
  .swg { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin-bottom: 18px; }
  .sw { position: relative; aspect-ratio: 1; border: 0; border-radius: 0; padding: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); transition: transform .2s cubic-bezier(0.34, 1.9, 0.6, 1); color: #fff; }
  .sw.lt { color: #171717; }
  .sw.on { box-shadow: inset 0 0 0 2px var(--fg), inset 0 0 0 4px var(--bg); }
  .sw.lock { cursor: default; }
  .sw.lock::before { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 62%, transparent); }
  .sw svg { position: relative; width: 14px; height: 14px; fill: none; stroke: var(--fg); stroke-width: 2; margin-top: -6px; }
  .sw em { position: absolute; left: 0; right: 0; bottom: 3px; font: 700 9px/1 var(--font); font-style: normal; color: var(--fg); letter-spacing: 0.04em; }
  @media (hover: hover) { .sw:not(.lock):not(.on):hover { transform: scale(1.08); } }
  .ptg { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
  .pt { position: relative; aspect-ratio: 1; border: 0; border-radius: 0; padding: 0; cursor: pointer; background: var(--panel2); display: flex; align-items: center; justify-content: center; }
  .pt canvas { width: 34px; height: 34px; }
  .pt.on { background: var(--panel3); box-shadow: inset 0 0 0 2px var(--fg); }
  .pt.lock { cursor: default; }
  .pt.lock canvas { opacity: 0.25; }
  .pt em { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 700 10px/1 var(--font); font-style: normal; color: var(--fg); letter-spacing: 0.04em; }
  .pt em svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }
  @media (hover: hover) { .pt:not(.lock):not(.on):hover { background: var(--hover); } }

  /* editor dock */
  #dock { flex: none; display: flex; align-items: center; gap: 18px; padding: 10px 24px; background: var(--bg); border-top: 1px solid var(--edge); min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #dock::-webkit-scrollbar { display: none; }
  .tg { display: flex; gap: 4px; align-items: center; flex: none; }
  .tg + .tg { padding-left: 18px; border-left: 1px solid var(--edge); }
  .tool { width: 50px; height: 50px; flex: none; border: 0; border-radius: 0; padding: 0; cursor: pointer; background: var(--panel2); display: flex; align-items: center; justify-content: center;
    transition: background .15s; position: relative; }
  .tool canvas { width: 34px; height: 34px; }
  .tool.on { background: var(--panel3); box-shadow: inset 0 0 0 2px var(--fg); }
  .tool kbd { position: absolute; right: 3px; top: 2px; font: 700 9px/1 var(--font); color: var(--fg3); }
  @media (hover: hover) { .tool:not(.on):hover { background: var(--hover); } }
  #rotTb svg { transition: transform .2s; }
  .scrub { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 12px; }
  .scrub input { flex: 1; min-width: 80px; -webkit-appearance: none; appearance: none; height: 24px; background: transparent; cursor: pointer; }
  .scrub input::-webkit-slider-runnable-track { height: 2px; background: var(--edge); }
  .scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; background: var(--fg); border: 0; border-radius: 0; }
  .scrub input::-moz-range-track { height: 2px; background: var(--edge); }
  .scrub input::-moz-range-thumb { width: 14px; height: 14px; background: var(--fg); border: 0; border-radius: 0; }
  .scrub .lbl { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
  #edName { width: 240px; }

  @media (max-width: 860px) {
    .mwrap { grid-template-columns: minmax(0, 1fr); }
    .dname { font-size: 34px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats > div:nth-child(3) { border-left: 0; padding-left: 0; }
    .stats > div:nth-child(n+3) { border-top: 1px solid var(--edge); }
    #crumb span { display: none; }
  }
  @media (max-width: 560px) {
    #bar { gap: 8px; padding: 0 12px; }
    .brand { font-size: 21px; }
    #crumb { display: none; }
    .st { min-width: 40px; padding: 0 5px; }
    .st b { font-size: 17px; }
    .mwrap { padding: 16px 12px 30px; }
    .bars { grid-template-columns: minmax(0, 1fr); }
    #edName { width: 130px; }
    #dock { padding: 8px 12px; gap: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand" id="brand">Metrica: Classic</div>
    <span class="ttag" id="ttag" hidden>Test</span>
    <div id="crumb" class="lbl" hidden></div>
    <input id="edName" class="inp" maxlength="28" spellcheck="false" autocomplete="off" hidden>
    <div class="sp"></div>
    <div id="hud" hidden>
      <div class="st"><span class="k">Attempt</span><b id="hAtt">1</b></div>
      <div class="st"><span class="k">Best</span><b id="hBest">0%</b></div>
    </div>
    <div id="acts"></div>
    <button class="tb plain" id="bTheme"></button>
    <button class="tb plain" id="bSound"></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="flash"></div>
    <div id="prac" hidden>
      <button class="tb" id="bCp"></button>
      <button class="tb" id="bCpDel"></button>
    </div>
    <div id="menu"></div>
    <div id="ovl" class="ovl" hidden></div>
    <div id="toast"></div>
  </div>
  <div id="dock" hidden></div>
</div>
<script>
(function () {
'use strict';

/* =====================================================================
   Dasher
   Sections:
     1. util          small helpers, DOM shortcuts
     2. font          Inter, embedded (base64url, decoded at startup)
     3. store         save/load through the parent frame (game-save / game-load)
     4. theme         light/dark tokens for the canvas, synced with the planner
     5. level         the level data format: parse, serialize, migrate
     6. physics       fixed-timestep, deterministic simulation
     7. render        drawing the world into any canvas
     8. audio         small synth: music loop and effects
     9. game          a play session: attempts, practice, checkpoints
    10. editor        grid editor
    11. ui            menu, overlays, top bar
    12. loop          the frame loop and input
   ===================================================================== */

/* ---------------- 1. util ---------------- */
var DOC = document;
function $(id) { return DOC.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtTime(sec) { sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + pad2(s); }
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3) | 0; n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
var ICON = {
  play: '<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9.5-5.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="2.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>',
  snd: '<svg viewBox="0 0 24 24"><path d="M4 9h3.5L13 4.5v15L7.5 15H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M4 9h3.5L13 4.5v15L7.5 15H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>',
  flag: '<svg viewBox="0 0 24 24"><path d="M12 3.5l7 8.5-7 8.5-7-8.5z"/><path d="M12 8.5v7M8.5 12h7"/></svg>',

/* menu preview. Built-in levels replay their recorded clear with the player's cube; created levels scroll by;

  },

/* Jump input is queued with the time it happened and applied at the physics tick that time falls in,

  advance: function (t) {

  init: function () {

      else if (UI.screen === 'edit') { if (e.target === main.cv) { try { st.setPointerCapture(e.pointerId); } catch (er) {} Editor.down(e); } }
    });
    st.addEventListener('pointermove', function (e) { if (UI.screen === 'edit') Editor.move(e); });
    var ptrUp = function () { if (Input.ptr) Input.push('ptr', false); Input.ptr = false; Editor.up(); };
    window.addEventListener('pointerup', ptrUp);
    window.addEventListener('pointercancel', ptrUp);
    st.addEventListener('pointerleave', function () { Editor.hover = null; });
    st.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    st.addEventListener('wheel', function (e) { if (UI.screen === 'edit') Editor.wheel(e); }, { passive: false });
  },
  down: function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (!e.repeat) Audio.ensure();
    var c = e.code;
    if (Input.JUMP[c] || c === 'Space') e.preventDefault();
    if (UI.modal) {
      if (c === 'Escape') { if (UI.screen === 'play' && Game.paused) UI.resume(); else if (UI.screen !== 'play') UI.closeModal(); }
      else if ((c === 'Enter' || c === 'Space') && !e.repeat) { UI.modal.acts[0][2](); }
      return;
    }
    if (UI.screen === 'play') {
      if (Input.JUMP[c] && !Input.keys[c]) Input.push(c, true);
      Input.keys[c] = true;
      var ae = DOC.activeElement; if (ae && ae.tagName === 'BUTTON') ae.blur();
      if (c === 'Escape' || c === 'KeyP') UI.pause();
      else if (c === 'KeyR' && !e.repeat) Game.restart();
      else if (c === 'KeyZ' && !e.repeat) Game.addCp(false);
      else if (c === 'KeyX' && !e.repeat) Game.delCp();
      else if (Input.JUMP[c] && Game.phase === 'dead' && Game.deadT > 0.25) { FX.list = []; Game.respawn(false); }
      return;
    }
    if (UI.screen === 'edit') {
      var mod = e.ctrlKey || e.metaKey;
      if (c === 'Space') { Editor.space = true; return; }
      if (mod && c === 'KeyZ') { e.preventDefault(); if (e.shiftKey) Editor.redo(); else Editor.undo(); return; }
      if (mod && c === 'KeyY') { e.preventDefault(); Editor.redo(); return; }
      if (mod && c === 'KeyS') { e.preventDefault(); Editor.save(); return; }
      if (mod) return;
      var i = TOOL_KEYS.indexOf(e.key); if (i >= 0) { Editor.tool = TYPE_ORDER[i]; Editor.erase = false; UI.edTools(); return; }
      if (c === 'KeyR') { Editor.rot = (Editor.rot + (e.shiftKey ? 3 : 1)) & 3; UI.edTools(); Icons.redraw(); }
      else if (c === 'KeyE') { Editor.erase = !Editor.erase; UI.edTools(); }
      else if (c === 'ArrowLeft') Editor.nudge(e.shiftKey ? -10 : -2, 0);
      else if (c === 'ArrowRight') Editor.nudge(e.shiftKey ? 10 : 2, 0);
      else if (c === 'ArrowUp') { e.preventDefault(); Editor.nudge(0, 1); }
      else if (c === 'ArrowDown') { e.preventDefault(); Editor.nudge(0, -1); }
      else if (c === 'KeyT' || c === 'Enter') Editor.test();
      else if (c === 'Escape') UI.edExit();
      return;
    }
    if (UI.screen === 'menu') {
      if ((c === 'ArrowDown' || c === 'ArrowUp') && UI.tab === 'main') { e.preventDefault(); UI.sel = clamp(UI.sel + (c === 'ArrowDown' ? 1 : -1), 0, LEVELS.length - 1); UI.menu(); }
      else if ((c === 'Enter' || c === 'Space') && UI.tab !== 'cube') { var cur = UI.current(); if (cur && (cur.src !== 'main' || Unlock.level(cur.index))) UI.play(cur, {}); }
    }
  }
};

var Loop = {
  last: 0, simT: 0, alpha: 0, time: 0, MAXSTEPS: 60, resyncs: 0,
  frame: function (now) {
    requestAnimationFrame(Loop.frame);
    var dt = Loop.last ? (now - Loop.last) / 1000 : 0; Loop.last = now;
    if (dt > 0.1) dt = 0.1;
    Loop.time += dt;
    if (!main.fit()) return;
    if (UI.screen === 'play' && Game.on) {
      if (!Game.paused) {
        var stepMs = PH.DT * 1000, n = 0;
        if (!Loop.simT || now - Loop.simT > 250) { if (Loop.simT) Loop.resyncs++; Input.advance(now); Loop.simT = now; }
        while (Loop.simT + stepMs <= now && n < Loop.MAXSTEPS) {
          Loop.simT += stepMs; Input.advance(Loop.simT);
          if (Game.phase === 'play') Game.tick(); Input.tap = false; n++;
        }
        Loop.alpha = clamp((now - Loop.simT) / stepMs, 0, 1);
        FX.update(dt); Game.update(dt);
      } else { Loop.simT = 0; Input.advance(now); Input.tap = false; }
      Game.draw();
    } else if (UI.screen === 'edit' && Editor.on) {
      Loop.simT = 0; Input.advance(now); Input.tap = false;
      Editor.draw();
    } else if (UI.screen === 'menu') {
      Preview.draw(dt);
    }
  }
};

function watchDpr() {
  try {
    var mq = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
    var fn = function () { mq.removeEventListener('change', fn); Icons.redraw(); watchDpr(); };
    mq.addEventListener('change', fn);
  } catch (e) {}
}

/* public surface for tests and for publishing levels later */
window.Dasher = { DEMOS: DEMOS, TEST: TEST, Cube: Cube, Unlock: Unlock, Loop: Loop, Input: Input, Level: Level, Physics: Physics, PH: PH, EV: EV, TYPES: TYPES, LEVELS: LEVELS, S: S, UI: UI, Game: Game, Editor: Editor, Store: Store, Theme: Theme };

Theme.apply(); Theme.watch();
if (TEST) $('ttag').hidden = false;
UI.init(); Input.init(); watchDpr();
window.addEventListener('resize', function () { Icons.redraw(); });
Store.load();
requestAnimationFrame(Loop.frame);
})();
</script>
</body>
