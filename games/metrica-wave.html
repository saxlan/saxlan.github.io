<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrica: Wave</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Rounded look: Fredoka headings, Nunito text, flat fills, 2px lines with a 4px bottom edge, chunky buttons that press down */
  :root {
    --display: 'Fredoka', 'Nunito', system-ui, sans-serif;
    --sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font: var(--sans);
    --bg: #ffffff; --soft: #f7f7f7; --panel: #ffffff; --line: #e5e5e5; --line-hi: #d0d0d0;
    --text: #4b4b4b; --dim: #777777; --faint: #afafaf;
    --green: #58cc02; --green-dark: #58a700; --green-wash: #d7ffb8;
    --blue: #4b9af3; --blue-dark: #3c81db; --blue-wash: #e6f1ff; --blue-line: #a4ceff;
    --pri: #4b9af3; --pri-dark: #3c81db; --pri-hi: #5ea6f6; --pri-light: #a4ceff; --pri-wash: #e6f1ff; --pri-text: #3c81db;
    --red: #ff4b4b; --red-dark: #ea2b2b; --red-wash: #ffdfe0;
    --gold: #ffc800; --gold-dark: #e5a400; --purple: #ce82ff; --orange: #ff9600;
    --scrim: rgba(255, 255, 255, 0.92);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #131f24; --soft: #202f36; --panel: #131f24; --line: #37464f; --line-hi: #52656d;
    --text: #f1f7fb; --dim: #8799a3; --faint: #52656d;
    --green-wash: #1f3a1a; --blue-wash: #1c3150; --blue-line: #3c81db; --red-wash: #3c2328;
    --pri-wash: #1c3150; --pri-light: #78b0fc; --pri-text: #78b0fc;
    --scrim: rgba(19, 31, 36, 0.92);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  *:focus, *:focus-visible { outline: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 700 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }
  canvas { display: block; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .lbl { font: 800 12px/1.3 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }

  /* top bar */
  #bar { flex: none; position: relative; z-index: 20; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    background: var(--bg); border-bottom: 2px solid var(--line); min-width: 0; }
  .brand { cursor: pointer; font: 700 26px/1 var(--display); letter-spacing: -0.02em; white-space: nowrap; color: var(--pri-text); }
  #crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 14px; border-left: 2px solid var(--line); line-height: 26px; font-size: 15px; letter-spacing: 0; text-transform: none; }
  #crumb b { font-weight: 800; color: var(--text); }
  #crumb span { margin-left: 10px; }
  #crumb .tag { color: var(--pri-text); }
  #bar .sp { flex: 1; min-width: 4px; }
  #hud { display: flex; align-items: center; gap: 6px; }
  .st { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; min-width: 52px; padding: 0 8px; }
  .st .k { font: 800 11px/1.2 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; white-space: nowrap; }
  .st b { font: 700 22px/1.05 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text); }
  #acts { display: flex; align-items: center; gap: 8px; }

  /* buttons: solid fill with a darker 4px edge; pressing shifts down and the edge shrinks */
  .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; cursor: pointer;
    font: 800 14px/1.2 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
    background: var(--pri); color: #fff; border: 2px solid var(--pri-dark); border-bottom-width: 4px; border-radius: 12px; }
  .btn:not(:disabled):active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  .btn.ghost, .btn.line { background: var(--bg); color: var(--pri-text); border-color: var(--line); }
  .btn.danger { background: var(--bg); color: var(--red); border-color: var(--line); }
  .btn.sm { min-height: 38px; padding: 0 14px; font-size: 12.5px; border-radius: 10px; border-bottom-width: 3px; }
  .btn.sm:not(:disabled):active { border-bottom-width: 2px; margin-bottom: 1px; transform: translateY(1px); }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn svg { width: 14px; height: 14px; fill: currentColor; }
  @media (hover: hover) { .btn:not(:disabled):hover { background: var(--pri-hi); } .btn.ghost:not(:disabled):hover, .btn.line:not(:disabled):hover, .btn.danger:not(:disabled):hover { background: var(--soft); } }

  /* icon buttons */
  .tb { width: 42px; height: 42px; flex: none; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; cursor: pointer; background: var(--bg); color: var(--dim);
    display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .tb:not(:disabled):active { transform: translateY(2px); border-bottom-width: 2px; }
  .tb.on { background: var(--blue-wash); border-color: var(--blue-line); color: var(--pri-text); }
  .tb:disabled { opacity: 0.4; cursor: default; }
  .tb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .tb.plain { border-color: transparent; background: transparent; }
  .tb.plain:active { transform: none; }
  @media (hover: hover) { .tb:not(.on):not(:disabled):hover { background: var(--soft); } }

  /* option groups (Interpres tabs) */
  .seg { display: inline-flex; flex-wrap: wrap; gap: 8px; }
  .seg button { min-height: 42px; padding: 0 16px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; cursor: pointer; background: var(--bg);
    font: 800 13.5px/1.2 var(--sans); letter-spacing: 0.05em; text-transform: uppercase; color: var(--dim); }
  .seg button:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  .seg button.on { background: var(--blue-wash); border-color: var(--blue-line); color: var(--pri-text); }
  @media (hover: hover) { .seg button:not(.on):hover { background: var(--soft); color: var(--text); } }

  .inp { min-width: 0; height: 42px; padding: 0 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--soft);
    color: var(--text); font: 700 16px/1.3 var(--sans); -webkit-user-select: text; user-select: text; }
  .inp:focus { border-color: var(--blue); background: var(--bg); }

  /* stage */
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }

  /* menu */
  #menu { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); scrollbar-width: none; }
  #menu::-webkit-scrollbar { display: none; }
  .mwrap { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 24px; max-width: 1240px; margin: 0 auto; padding: 28px 24px 40px; min-height: 100%; align-content: start; }
  .mcol { min-width: 0; display: flex; flex-direction: column; }
  .mcol .seg { margin-bottom: 16px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .lrow { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 6px 14px; width: 100%; min-height: 72px; padding: 12px 16px 12px 12px;
    border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; background: var(--bg); cursor: pointer; text-align: left; color: var(--text); }
  .lrow:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  .lrow .n { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--pri); color: #fff; font: 700 17px/1 var(--display); font-variant-numeric: tabular-nums; box-shadow: inset 0 -4px 0 var(--pri-dark); }
  .lrow .nm { font: 700 18px/1.2 var(--display); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .pc { font: 800 15px/1 var(--sans); font-variant-numeric: tabular-nums; text-align: right; color: var(--text); }
  .lrow .pc.z { color: var(--faint); }
  .lrow .meter { grid-column: 2 / 4; }
  .lrow.on { background: var(--blue-wash); border-color: var(--blue-line); }
  .lrow.locked .n { background: var(--line); color: var(--faint); box-shadow: inset 0 -4px 0 var(--line-hi); }
  .lrow.locked .nm { color: var(--faint); }
  @media (hover: hover) { .lrow:not(.on):hover { background: var(--soft); } }
  .meter { position: relative; display: block; height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--gold); }
  .meter i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 3px; border-radius: 99px; background: rgba(255,255,255,0.35); }
  .meter.p i { background: var(--blue); }
  .lnew { margin-top: 12px; }
  .empty { padding: 26px 16px; border: 2px dashed var(--line); border-radius: 16px; color: var(--faint); font: 800 13px/1.3 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; text-align: center; }
  .pips { display: inline-flex; gap: 4px; vertical-align: middle; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .pips i.f { background: var(--gold); }

  .detail { background: var(--bg); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
  .pvwrap { position: relative; aspect-ratio: 16 / 7; border-bottom: 2px solid var(--line); overflow: hidden; background: var(--soft); }
  .pvwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dbody { padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 18px; }
  .dhead { display: flex; align-items: center; gap: 14px; }
  .dhead .lbl { display: inline-flex; align-items: center; gap: 12px; }
  .dname { font: 700 44px/1.05 var(--display); letter-spacing: -0.02em; overflow-wrap: anywhere; margin: -6px 0 0; color: var(--text); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stats > div { padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; min-width: 0; }
  .stats b { display: block; font: 700 24px/1.1 var(--display); font-variant-numeric: tabular-nums; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .bars { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  .bars .lbl { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .bars .lbl b { color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; }
  .bars .meter { height: 16px; }
  .dacts { display: flex; gap: 10px; flex-wrap: wrap; }
  .dacts .btn { min-width: 136px; }
  .dacts .sp { flex: 1; }

  /* overlays */
  .ovl { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--scrim); }
  .card { width: min(440px, 100%); max-height: 100%; overflow-y: auto; background: var(--bg); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px; padding: 26px; }
  .card .big { font: 700 40px/1.08 var(--display); letter-spacing: -0.02em; margin: 6px 0 20px; overflow-wrap: anywhere; color: var(--text); }
  .card .stats { margin-bottom: 22px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card .col { display: flex; flex-direction: column; gap: 10px; }
  .card .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card .note { color: var(--pri-text); margin: -6px 0 20px; display: flex; align-items: center; gap: 8px; font: 800 13px/1.35 var(--sans); letter-spacing: 0.04em; text-transform: uppercase; }
  .card .note svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; flex: none; }

  #flash { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none; text-align: center; white-space: nowrap; }
  #flash b { display: block; font: 700 88px/1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--text); }
  #flash .lbl { margin-top: 10px; color: var(--pri-text); font-size: 14px; }
  #flash.go { animation: flash .9s ease-out both; }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  #flash:not(.go) { opacity: 0; }

  #toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 12; padding: 10px 18px; background: var(--text); color: var(--bg); border-radius: 12px;
    font: 800 13px/1.2 var(--sans); letter-spacing: 0.04em; text-transform: uppercase; pointer-events: none; opacity: 0; white-space: nowrap; }
  #toast.on { opacity: 1; }
  .lk svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; vertical-align: middle; stroke-linecap: round; }
  .dlk { margin-left: auto; color: var(--faint); }

  #cv { cursor: pointer; }
  #menu { z-index: 8; }
  /* progress while playing: distance, a rounded bar, time */
  #pbar { position: absolute; left: 0; right: 0; top: 0; z-index: 4; display: flex; align-items: center; gap: 14px; padding: 14px 24px; pointer-events: none; }
  #pbar .lbl { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text); }
  #pbar .lbl b { font: 700 18px/1 var(--display); color: var(--text); }
  #pbar .meter { flex: 1; height: 16px; border: 3px solid var(--bg); box-sizing: content-box; }
  #pbar .meter i { background: var(--pri); }
  #pDist { min-width: 120px; }
  #pTime { min-width: 52px; text-align: right; }
  .mtop { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .mtop > div { padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; min-width: 0; }
  .mtop b { display: block; font: 700 22px/1.1 var(--display); font-variant-numeric: tabular-nums; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .lrow.endless { margin-top: 6px; }
  .lrow.endless .nm, .lrow.endless .pc { grid-row: 1 / 3; }
  .lrow.endless .n { background: var(--purple); box-shadow: inset 0 -4px 0 #a568cc; }
  .lrow.endless.locked .n { background: var(--line); box-shadow: inset 0 -4px 0 var(--line-hi); }
  .pvwrap.locked canvas { opacity: 0.45; }
  .card.skin { width: min(460px, 100%); }
  .card.skin .big { margin-bottom: 14px; }
  /* the Done button stays in view while the colours scroll */
  .card.skin .col { position: sticky; bottom: -26px; margin: 14px -26px -26px; padding: 12px 26px 26px; background: var(--bg); }
  .mskin { margin-top: 12px; }
  .card .note { margin: -6px 0 18px; }
  .scene { display: inline-flex; align-items: center; gap: 8px; }
  .scene i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

  /* a narrow level panel (small desktop windows): two stats per row so the numbers never cut off */
  .detail { container-type: inline-size; }
  @container (max-width: 620px) { .dbody .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* short desktop windows: the level panel and its Play button fit without scrolling */
  @media (min-width: 861px) and (max-height: 820px) {
    .mwrap { padding-top: 20px; }
    .pvwrap { aspect-ratio: 16 / 6; }
    .dbody { gap: 14px; padding: 18px 24px 20px; }
    .dname { font-size: 38px; }
  }
  @media (max-width: 860px) {
    .mwrap { grid-template-columns: minmax(0, 1fr); }
    .dname { font-size: 34px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #crumb span { display: none; }
  }
  @media (max-width: 560px) {
    #bar { gap: 6px; padding: 0 10px 0 14px; height: 58px; }
    .brand { font-size: 21px; }
    #crumb { display: none; }
    .st { min-width: 40px; padding: 0 4px; }
    .st b { font-size: 18px; }
    .mwrap { padding: 16px 12px 30px; }
    .bars { grid-template-columns: minmax(0, 1fr); }
    #pbar { padding: 10px 12px; gap: 10px; }
    #pDist { min-width: 0; }
    #flash b { font-size: 64px; }
    .card .big { font-size: 32px; }
    .card { padding: 20px; }
    .card.skin .col { bottom: -20px; margin: 14px -20px -20px; padding: 12px 20px 20px; }
    .card .stats > div { padding: 10px; }
    .card .stats b { font-size: 19px; }
    .mtop b { font-size: 18px; }
    .dacts .btn { flex: 1; }
  }
  @media (max-width: 440px) {
    #bar.playing { gap: 4px; padding: 0 6px 0 12px; }
    #bar.playing .brand { font-size: 17px; }
    #bar.playing #bSound { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-delay: 0s !important; transition-duration: 0.001ms !important; }
    #flash.go { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand" id="brand">Metrica: Wave</div>
    <div id="crumb" class="lbl" hidden></div>
    <div class="sp"></div>
    <div id="hud" hidden>
      <div class="st"><span class="k">Attempt</span><b id="hAtt">1</b></div>
      <div class="st"><span class="k">Best</span><b id="hBest">0%</b></div>
    </div>
    <div id="acts"></div>
    <button class="tb plain" id="bTheme" aria-label="Theme"></button>
    <button class="tb plain" id="bSound" aria-label="Sound"></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="pbar" hidden><span class="lbl" id="pDist"></span><span class="meter p"><i id="pFill"></i></span><span class="lbl" id="pTime"></span></div>
    <div id="flash"></div>
    <div id="menu"></div>
    <div id="ovl" class="ovl" hidden></div>
    <div id="toast"></div>
  </div>
</div>
<script>
(function () {
'use strict';
/* MX:BEGIN  Metrica shared. The same block sits in all three worlds (geodash.html, appel.html, metrica-wave.html):
   the one set of characters, how they are drawn, which ones are open, and reading the other worlds' saves.
   One skin for every mode: the Classic save (geodash) is the shared home of the pick (cube, cubeT). Each world also keeps a copy in
   its own save; on load every world takes the newest of the three (this also carries over picks made before the skin was shared),
   and a pick made in Platformer or Wave is written through to the Classic save at once. */
var MX = (function () {
  'use strict';
  /* the order is fixed (saves hold indexes); the colours come from the shared game palette */
  var COLORS = [
    ['Blue', '#1cb0f6'], ['Charcoal', '#4b4b4b'], ['Snow', '#ffffff'], ['Red', '#ff4b4b'], ['Yellow', '#ffc800'], ['Green', '#58cc02'],
    ['Teal', '#20c9a6'], ['Sky', '#84d8ff'], ['Purple', '#ce82ff'], ['Pink', '#ff86d0'], ['Lime', '#a5ed6e'], ['Orange', '#ff9600'],
    ['Grey', '#9a9a9a'], ['Sand', '#f5d7a1'], ['Grape', '#8a5cd8'], ['Gold', '#e5a400']
  ];
  /* 'eyes' is the Platformer world's runner; it is open from the start, like the first three.
     star, bolt and heart are earned in the other worlds: clear Platformer, clear Wave, clear every Mixed level */
  var PATTERNS = [['frame', 'Frame'], ['dot', 'Dot'], ['cross', 'Cross'], ['split', 'Split'], ['bars', 'Bars'], ['ring', 'Ring'], ['grid', 'Grid'], ['face', 'Face'], ['eyes', 'Runner'],
    ['star', 'Star'], ['bolt', 'Bolt'], ['heart', 'Heart']];
  var N = { classic: 6, plat: 10, wave: 5, mixed: 5 };
  var GAME = { classic: 'geodash', plat: 'appel', wave: 'metrica-wave' };
  var WORLD_LABEL = { plat: 'Platformer', wave: 'Wave', mixed: 'Mixed' };
  /* the latest copy of each world's save this page has seen (know() keeps it current) */
  var known = { classic: null, plat: null, wave: null };
  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function classicDone(gd, i) { var p = isObj(gd) && isObj(gd.prog) ? gd.prog['L' + (i + 1)] : null; return !!p && (p.best | 0) >= 100; }
  function mixedDone(gd) { for (var i = 0; i < N.mixed; i++) { var p = isObj(gd) && isObj(gd.prog) ? gd.prog['M' + (i + 1)] : null; if (!p || (p.best | 0) < 100) return false; } return true; }
  function colorNeed(k) { return k < 6 ? -1 : Math.floor((k - 6) / 2); }
  /* a level index of Classic, -1 for open, or the name of the world that opens it */
  function patNeed(k) { return k === 9 ? 'plat' : k === 10 ? 'wave' : k === 11 ? 'mixed' : k < 3 || k === 8 ? -1 : k - 3; }
  function colorOpen(k, gd, test) { var n = colorNeed(k); return !!test || n < 0 || classicDone(gd || known.classic, n); }
  function patOpen(k, gd, test) {
    var n = patNeed(k); if (test || n === -1) return true;
    gd = gd || known.classic;
    if (n === 'plat') return worlds(null, known.plat, null, false).plat;

/* ---------------- 11. loop and input ---------------- */
var HOLD = { Space: 1, ArrowUp: 1, KeyW: 1 };
var Input = {
  keys: {}, ptrs: {},
  held: function () { var k; for (k in Input.keys) if (Input.keys[k]) return true; for (k in Input.ptrs) if (Input.ptrs[k]) return true; return false; },
  clear: function () { Input.keys = {}; Input.ptrs = {}; }
};
var main = { cv: null, ctx: null };
var Loop = {
  last: 0,
  frame: function (now) {
    var dt = Loop.last ? Math.min(0.1, (now - Loop.last) / 1000) : 1 / 60; Loop.last = now;
    if (UI.screen === 'play' && Game.on) {
      Game.update(dt);
      Loop.draw();
      UI.prog();
    } else if (UI.screen === 'menu') Preview.draw(dt);
    requestAnimationFrame(Loop.frame);
  },
  draw: function () {
    var cv = main.cv, dpr = fit(cv), w = cv.width, h = cv.height;
    View.w = w; View.h = h; View.dpr = dpr;
    if (!Game.st) return;
    var cell = View.cellFor(w, h), camX = Game.x - View.leftFrac(cv.clientWidth) * (w / cell);
    var v = View.make(w, h, dpr, camX);
    var fl = Game.phase === 'dead' ? Math.max(0, 0.22 * (1 - Game.timer / 0.3)) * (reduceMotion ? 0.5 : 1) : 0;
    Render.frame(main.ctx, v, Game.st, { C: Game.pal(), marks: true, finish: Game.mode === 'level' ? Game.target() : null, trail: Game.trail, x: Game.x, y: Game.y, dir: Game.dir,
      player: Game.phase !== 'dead', parts: Game.parts, flash: fl });
  }
};
function initInput() {
  var cv = main.cv;
  cv.addEventListener('pointerdown', function (e) {
    if (UI.screen !== 'play' || UI.modal || !Game.on) return;
    e.preventDefault(); Input.ptrs[e.pointerId] = 1; Snd.ensure();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  var up = function (e) { delete Input.ptrs[e.pointerId]; };
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  cv.addEventListener('lostpointercapture', up);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    var c = e.code;
    if (UI.screen === 'play' && (HOLD[c] || c === 'Enter')) { var ae = DOC.activeElement; if (ae && ae.tagName === 'BUTTON') ae.blur(); }
    if (UI.modal) {
      if (c === 'Enter' || (c === 'Space' && !e.repeat)) { e.preventDefault(); UI.modal.acts[0][2](); return; }
      if (c === 'Escape' && Game.on && Game.paused) { e.preventDefault(); UI.resume(); }
      if (HOLD[c]) e.preventDefault();
      return;
    }
    if (UI.screen === 'play') {
      if (HOLD[c]) { e.preventDefault(); Input.keys[c] = 1; return; }
      if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); UI.pause(); return; }
      if (c === 'KeyR' && Game.phase === 'play') { Game.newRun(); return; }
    } else if (UI.screen === 'menu') {
      if (c === 'ArrowDown' || c === 'ArrowUp') { e.preventDefault(); UI.sel = clamp(UI.sel + (c === 'ArrowDown' ? 1 : -1), 0, 5); UI.menu(); return; }
      if (c === 'Enter' || c === 'Space') { e.preventDefault(); UI.playSel(); }
    }
  });
  window.addEventListener('keyup', function (e) { if (HOLD[e.code]) { delete Input.keys[e.code]; e.preventDefault(); } });
  window.addEventListener('blur', function () { Input.clear(); if (UI.screen === 'play' && Game.on && Game.phase === 'play' && !UI.modal) UI.pause(); });
  DOC.addEventListener('visibilitychange', function () { if (DOC.hidden && UI.screen === 'play' && Game.on && Game.phase === 'play' && !UI.modal) UI.pause(); });
}

/* debug and automation hook */
var W = window.__wave = {
  onTick: null,
  state: function () {
    return { screen: UI.screen, mode: Game.mode, level: Game.idx, phase: Game.phase, paused: Game.paused, x: Game.x, y: Game.y, dir: Game.dir,
      dist: Math.floor(Math.max(0, Game.x) * MPU), time: Game.t, attempt: Game.sessAtt, speed: Game.on ? Game.speed(Game.x) : 0,
      target: Game.on ? Game.target() : 0, modal: !!UI.modal, open: S.open };
  },
  hit: function (x, y, r) { return Game.st ? Game.st.hit(x, y, r) : false; },
  save: function () { return JSON.parse(JSON.stringify(S)); },
  unlockAll: function () { S.open = 6; Store.save(true); if (UI.screen === 'menu') UI.menu(); },
  validate: function () { return Solver.all(); },
  play: function (i) { if (i === 'endless') UI.play('endless', 0); else UI.play('level', i | 0); },
  menu: function () { UI.toMenu(); },
  select: function (i) { UI.sel = i; if (UI.screen === 'menu') UI.menu(); },
  chunks: CHUNKS.map(function (c) { return { id: c.id, d: c.d, L: c.L }; }),
  levels: LEVELS.map(function (L) { return { name: L.name, m: L.m, units: L.u, speed: L.speed, seconds: +(L.u / L.speed).toFixed(1), dmin: L.dmin, dmax: L.dmax }; }),
  R: R, PAD: SOLVE_PAD
};

/* ---------------- boot ---------------- */
main.cv = $('cv'); main.ctx = main.cv.getContext('2d');
Theme.watch(); Theme.apply(); UI.init(); initInput();
Store.load();
requestAnimationFrame(Loop.frame);
})();
</script>
</body>
</html>
