<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrica: Wave</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --font: 'Inter', ui-sans-serif, 'Helvetica Neue', Arial, sans-serif;
    --bg: #f2f0ea; --panel: #f8f7f3; --panel2: #e6e3da; --panel3: #ffffff; --hover: #d9d5ca; --edge: #d1cdc2;
    --fg: #171717; --fg2: #6e6c64; --fg3: rgba(23,23,23,0.38); --lbl: #6e6c64;
    --accent: #2b3fd3; --accent-hi: #2234bb; --accent-fg: #ffffff; --good: #1c6b42; --bad: #a33025; --gold: #8a6a00;
    --shadow: 0 1px 0 rgba(23,23,23,0.04), 0 10px 30px -18px rgba(23,23,23,0.35);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #171716; --panel: #1e1e1c; --panel2: #2c2c28; --panel3: #232322; --hover: #3a3a35; --edge: rgba(255,255,255,0.14);
    --fg: #ebeae5; --fg2: #a3a199; --fg3: rgba(235,234,229,0.4); --lbl: #a3a199;
    --accent: #8b97ff; --accent-hi: #7a87f2; --accent-fg: #101010; --good: #5cb485; --bad: #e07a6d; --gold: #d3ab2a;
    --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 14px 34px -18px rgba(0,0,0,0.8);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  *:focus, *:focus-visible { outline: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }
  canvas { display: block; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .lbl { font: 600 12px/1.3 var(--font); letter-spacing: 0.04em; text-transform: uppercase; color: var(--lbl); }

  /* top bar */
  #bar { flex: none; position: relative; z-index: 20; height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 24px;
    background: var(--bg); border-bottom: 1px solid var(--edge); min-width: 0; }
  .brand { cursor: pointer; font: 800 26px/1 var(--font); text-transform: uppercase; letter-spacing: -0.02em; white-space: nowrap; }
  #crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 14px; border-left: 1px solid var(--edge); line-height: 26px; }
  #crumb b { font-weight: 700; color: var(--fg); }
  #crumb span { margin-left: 10px; }
  #bar .sp { flex: 1; min-width: 4px; }
  #hud { display: flex; align-items: center; gap: 2px; }
  .st { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; min-width: 52px; padding: 0 10px; }
  .st .k { font: 600 11px/1.2 var(--font); letter-spacing: 0.04em; text-transform: uppercase; color: var(--lbl); margin-bottom: 3px; white-space: nowrap; }
  .st b { font: 800 21px/1.05 var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #acts { display: flex; align-items: center; gap: 8px; }

  .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; cursor: pointer;
    font: 600 12.5px/1.2 var(--font); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;
    background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 0;
    transform: scale(1); transition: background .15s, opacity .15s, transform .32s cubic-bezier(0.34, 1.9, 0.6, 1); }
  .btn:not(:disabled):active { transform: scale(0.94); transition-duration: .15s, .15s, .08s; transition-timing-function: ease; }
  .btn.ghost { background: var(--panel2); color: var(--fg); }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn svg { width: 14px; height: 14px; fill: currentColor; }
  @media (hover: hover) { .btn:not(:disabled):hover { background: var(--accent-hi); } .btn.ghost:not(:disabled):hover { background: var(--hover); } }

  .tb { width: 40px; height: 40px; flex: none; border: 0; border-radius: 0; cursor: pointer; background: var(--panel2); color: var(--fg);
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    transform: scale(1); transition: background .15s, transform .32s cubic-bezier(0.34, 1.9, 0.6, 1); }
  .tb:active { transform: scale(0.88); transition-duration: .15s, .08s; }
  .tb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tb.plain { background: transparent; }
  @media (hover: hover) { .tb:hover { background: var(--hover); } }

  /* stage */
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

  #pbar { position: absolute; left: 0; right: 0; top: 0; z-index: 4; display: flex; align-items: center; gap: 14px; padding: 14px 24px; pointer-events: none; }
  #pbar .lbl { white-space: nowrap; font-variant-numeric: tabular-nums; }
  #pbar .lbl b { color: var(--fg); font-weight: 800; }
  #pbar .meter { flex: 1; height: 6px; }
  #pDist { min-width: 120px; }
  #pTime { min-width: 52px; text-align: right; }

  /* menu */
  #menu { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); scrollbar-width: none; z-index: 8; }
  #menu::-webkit-scrollbar { display: none; }
  .mwrap { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 20px; max-width: 1240px; margin: 0 auto; padding: 28px 24px 40px; min-height: 100%; align-content: start; }
  .mcol { min-width: 0; display: flex; flex-direction: column; }
  .mtop { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 14px; border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
  .mtop > div { padding: 12px 0 12px 14px; border-left: 1px solid var(--edge); min-width: 0; }
  .mtop > div:first-child { border-left: 0; padding-left: 0; }
  .mtop b { display: block; font: 800 22px/1.1 var(--font); font-variant-numeric: tabular-nums; margin-top: 4px; white-space: nowrap; }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .lrow { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; width: 100%; min-height: 64px; padding: 12px 16px 14px;
    border: 0; border-radius: 0; background: var(--panel2); cursor: pointer; text-align: left; transition: background .15s; }
  .lrow .n { font: 800 13px/1 var(--font); color: var(--fg3); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .lrow .nm { font: 700 17px/1.25 var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .pc { font: 800 15px/1 var(--font); font-variant-numeric: tabular-nums; text-align: right; }
  .lrow .pc.z { color: var(--fg3); }
  .lrow .meter { grid-column: 2 / 4; }
  .lrow.on { background: var(--fg); color: var(--bg); }
  .lrow.on .n, .lrow.on .pc.z { color: var(--bg); opacity: 0.55; }
  .lrow.on .meter { background: rgba(127,127,127,0.35); }
  .lrow.on .meter i { background: var(--bg); }
  .lrow.locked .nm { color: var(--fg3); }
  .lrow.on.locked .nm { color: var(--bg); opacity: 0.6; }
  .lrow.endless { margin-top: 10px; }
  @media (hover: hover) { .lrow:not(.on):hover { background: var(--hover); } }
  .meter { position: relative; display: block; height: 3px; background: var(--edge); overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); }
  .meter.p i { background: var(--accent); }
  .pips { display: inline-flex; gap: 3px; vertical-align: middle; }
  .pips i { width: 7px; height: 7px; background: var(--edge); }
  .pips i.f { background: var(--fg); }

  .detail { background: var(--panel); border: 1px solid var(--edge); box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; }
  .pvwrap { position: relative; aspect-ratio: 16 / 7; border-bottom: 1px solid var(--edge); overflow: hidden; background: var(--bg); }
  .pvwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pvwrap.locked canvas { opacity: 0.4; }
  .dbody { padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 18px; }
  .dhead { display: flex; align-items: center; gap: 14px; }
  .dhead .lbl { display: inline-flex; align-items: center; gap: 12px; }
  .dname { font: 800 46px/1.02 var(--font); text-transform: uppercase; letter-spacing: -0.03em; overflow-wrap: anywhere; margin: -4px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
  .stats > div { padding: 14px 0 14px 16px; border-left: 1px solid var(--edge); min-width: 0; }
  .stats > div:first-child { border-left: 0; padding-left: 0; }
  .stats b { display: block; font: 800 26px/1.1 var(--font); font-variant-numeric: tabular-nums; margin-top: 5px; white-space: nowrap; }
  .bars { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  .bars .lbl { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .bars .lbl b { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
  .bars .meter { height: 6px; }
  .dacts { display: flex; gap: 10px; flex-wrap: wrap; }
  .dacts .btn { min-width: 132px; min-height: 48px; }
  .lk svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; vertical-align: middle; }
  .dlk { margin-left: auto; color: var(--fg2); }

  /* overlays */
  .ovl { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: color-mix(in srgb, var(--bg) 52%, transparent); animation: fade .18s ease both; }
  .card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--edge); box-shadow: var(--shadow); padding: 26px; animation: rise .32s cubic-bezier(.2,.8,.2,1) both; }
  .card .big { font: 800 44px/1.04 var(--font); text-transform: uppercase; letter-spacing: -0.03em; margin: 6px 0 20px; overflow-wrap: anywhere; }
  .card .stats { margin-bottom: 22px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card .note { color: var(--accent); margin: -6px 0 18px; display: flex; align-items: center; gap: 8px; }
  .card .note svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
  .card .col { display: flex; flex-direction: column; gap: 8px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  #flash { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none; text-align: center; white-space: nowrap; }
  #flash b { display: block; font: 800 88px/1 var(--font); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  #flash .lbl { margin-top: 10px; color: var(--accent); font-size: 13px; }
  #flash.go { animation: flash .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes flash { 0% { opacity: 0; transform: translate(-50%, -40%); } 18% { opacity: 1; transform: translate(-50%, -50%); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -54%); } }
  #flash:not(.go) { opacity: 0; }

  #toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 12; padding: 10px 16px; background: var(--fg); color: var(--bg);
    font: 600 12.5px/1.2 var(--font); letter-spacing: 0.04em; text-transform: uppercase; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  #toast.on { opacity: 1; }

  @media (max-width: 860px) {
    .mwrap { grid-template-columns: minmax(0, 1fr); }
    .dname { font-size: 34px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats > div:nth-child(3) { border-left: 0; padding-left: 0; }
    .stats > div:nth-child(n+3) { border-top: 1px solid var(--edge); }
    .card .stats > div:nth-child(3) { border-left: 1px solid var(--edge); padding-left: 16px; }
    .card .stats > div:nth-child(n+3) { border-top: 0; }
    #crumb span { display: none; }
  }
  @media (max-width: 560px) {
    #bar { gap: 6px; padding: 0 10px 0 12px; }
    .brand { font-size: 21px; }
    #crumb { display: none; }
    .st { min-width: 38px; padding: 0 5px; }
    .st b { font-size: 17px; }
    .mwrap { padding: 16px 12px 30px; }
    .bars { grid-template-columns: minmax(0, 1fr); }
    .dbody { padding: 18px 18px 20px; }
    #pbar { padding: 10px 12px; gap: 10px; }
    #pDist { min-width: 0; }
    #flash b { font-size: 64px; }
    .card { padding: 22px; }
    .card .big { font-size: 36px; }
  }
  @media (max-width: 440px) {
    #bar.playing { gap: 4px; padding: 0 6px 0 12px; }
    #bar.playing .brand { font-size: 17px; }
    #bar.playing #bSound { display: none; }
    #bar.playing .tb { width: 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-delay: 0s !important; transition-duration: 0.001ms !important; }
    #flash.go { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand" id="brand">Metrica: Wave</div>
    <div id="crumb" class="lbl" hidden></div>
    <div class="sp"></div>
    <div id="hud" hidden>
      <div class="st"><span class="k">Attempt</span><b id="hAtt">1</b></div>
      <div class="st"><span class="k">Best</span><b id="hBest">0%</b></div>
    </div>
    <div id="acts"></div>
    <button class="tb plain" id="bTheme" aria-label="Theme"></button>
    <button class="tb plain" id="bSound" aria-label="Sound"></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="pbar" hidden><span class="lbl" id="pDist"></span><span class="meter p"><i id="pFill"></i></span><span class="lbl" id="pTime"></span></div>
    <div id="flash"></div>
    <div id="menu"></div>
    <div id="ovl" class="ovl" hidden></div>
    <div id="toast"></div>
  </div>
</div>
<script>
(function () {
'use strict';

/* =====================================================================
   Metrica: Wave
   Sections:
     1. util          helpers, icons
     2. font          Inter, embedded (base64url, decoded at startup)
     3. store         save/load through the parent frame (game-save / game-load), localStorage when standalone
     4. theme         light/dark tokens for the canvas, synced with the planner
     5. chunks        hand-made terrain segments, tagged by difficulty
     6. stream        lays chunks end to end; every placement is checked by a reachability solver
     7. game          a run: fixed-timestep wave physics, crashes, completion
     8. render        drawing a stream into any canvas
     9. audio         small synth effects
    10. ui            menu, overlays, top bar
    11. loop          the frame loop and input
   ===================================================================== */

/* ---------------- 1. util ---------------- */
var DOC = document;
function $(id) { return DOC.getElementById(id); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtTime(sec) { sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + pad2(s); }
function fmtTime1(sec) { sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3) | 0; n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function rgba(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
var reduceMotion = false;
try { var rmq = window.matchMedia('(prefers-reduced-motion: reduce)'); reduceMotion = rmq.matches; rmq.addEventListener('change', function () { reduceMotion = rmq.matches; }); } catch (e) {}
var ICON = {
  play: '<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9.5-5.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="2.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>',
  snd: '<svg viewBox="0 0 24 24"><path d="M4 9h3.5L13 4.5v15L7.5 15H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M4 9h3.5L13 4.5v15L7.5 15H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="9.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>',
  open: '<svg viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="9.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 6.8-1.2"/></svg>'

    var c = Math.floor(x / STEP), dir = d.path[Math.min(d.path.length - 1, c + 1)] > d.path[Math.min(d.path.length - 1, c)] ? 1 : -1;
    var trail = [], c0 = Math.max(0, Math.floor((camX - 1) / STEP)), pd = 0;
    for (var k = c0; k < c && k < d.path.length - 1; k++) { var nd = d.path[k + 1] - d.path[k]; if (nd !== pd) { trail.push([k * STEP, d.path[k] * STEP]); pd = nd; } }
    if (!trail.length) trail.push([x, y]);
    Render.frame(cv.getContext('2d'), v, d.st, { trail: trail, x: x, y: y, dir: dir, player: true });
  }
};

/* ---------------- 9. audio ---------------- */
var Snd = {
  ctx: null,
  ensure: function () {
    if (S.muted) return null;
    try {
      if (!Snd.ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; Snd.ctx = new AC(); }
      if (Snd.ctx.state === 'suspended') Snd.ctx.resume();
    } catch (e) { return null; }
    return Snd.ctx;
  },
  tone: function (f, d, type, vol, f2, delay) {
    var c = Snd.ensure(); if (!c) return;
    var t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  },
  crash: function () {
    var c = Snd.ensure(); if (!c) return;
    try {
      var n = Math.floor(c.sampleRate * 0.22), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      var s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'lowpass'; f.frequency.value = 1400; g.gain.value = 0.22; s.buffer = b; s.connect(f); f.connect(g); g.connect(c.destination); s.start();
    } catch (e) {}
    Snd.tone(180, 0.22, 'triangle', 0.12, 50);
  },
  done: function () { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { Snd.tone(f, 0.22, 'square', 0.05, 0, i * 0.09); }); }
};

/* ---------------- 10. ui ---------------- */
var UI = {
  screen: 'menu', sel: 0, modal: null,
  init: function () {
    $('brand').addEventListener('click', function () {
      if (framed) { try { parent.postMessage({ type: 'games-menu' }, '*'); } catch (e) {} }
      else UI.toMenu();
    });
    $('bTheme').addEventListener('click', function () { Theme.toggle(); });
    $('bSound').addEventListener('click', function () { S.muted = !S.muted; if (!S.muted) Snd.ensure(); Store.save(); UI.refreshBar(); });
    UI.sel = UI.defaultSel();
    UI.menu();
  },
  defaultSel: function () { if (Unlock.endless() && Unlock.cleared() >= 5) return 5; for (var i = 0; i < 5; i++) if (Unlock.level(i) && !S.lv[i].clr) return i; return 0; },
  refreshBar: function () {
    var b = $('bTheme'); if (!b) return;
    b.innerHTML = Theme.mode === 'dark' ? ICON.sun : ICON.moon;
    $('bSound').innerHTML = S.muted ? ICON.mute : ICON.snd;
  },
  setBar: function (crumb, hud, acts) {
    var c = $('crumb'); c.hidden = !crumb; c.innerHTML = crumb || '';
    $('hud').hidden = !hud; $('bar').classList.toggle('playing', !!hud);
    $('acts').innerHTML = acts || '';
  },
  toMenu: function () { Game.stop(); UI.closeModal(); UI.menu(); },
  open: function (i) { return i < 5 ? Unlock.level(i) : Unlock.endless(); },
  menu: function () {
    UI.screen = 'menu'; $('pbar').hidden = true;
    UI.setBar('', false, '');
    var m = $('menu'); m.hidden = false;
    var rows = '';
    LEVELS.forEach(function (L, i) {
      var r = S.lv[i], open = UI.open(i), pct = TEST ? 100 : Math.floor(clamp(r.best / L.u, 0, 1) * 100);
      rows += '<button class="lrow' + (UI.sel === i ? ' on' : '') + (open ? '' : ' locked') + '" data-i="' + i + '"><span class="n">' + pad2(i + 1) + '</span><span class="nm">' + esc(L.name) +
        '</span>' + (open ? '<span class="pc' + (pct ? '' : ' z') + '">' + pct + '%</span>' : '<span class="pc z lk">' + ICON.lock + '</span>') + '<span class="meter"><i style="width:' + pct + '%"></i></span></button>';
    });
    var eo = UI.open(5), eb = Math.floor(S.end.best * MPU);
    rows += '<button class="lrow endless' + (UI.sel === 5 ? ' on' : '') + (eo ? '' : ' locked') + '" data-i="5"><span class="n">00</span><span class="nm">Endless</span>' +
      (eo ? '<span class="pc' + (eb ? '' : ' z') + '">' + eb + ' m</span>' : '<span class="pc z lk">' + ICON.lock + '</span>') + '</button>';
    var top = '<div class="mtop"><div><span class="lbl">Cleared</span><b>' + Unlock.cleared() + ' / 5</b></div><div><span class="lbl">Attempts</span><b>' + S.att + '</b></div><div><span class="lbl">Distance</span><b>' + fmtKm(S.dist) + '</b></div></div>';
    m.innerHTML = '<div class="mwrap"><div class="mcol">' + top + '<div class="list">' + rows + '</div></div><div class="detail" id="det"></div></div>';
    m.querySelectorAll('[data-i]').forEach(function (b) { b.addEventListener('click', function () { UI.sel = +b.getAttribute('data-i'); UI.menu(); }); });
    UI.detail();
  },
  detail: function () {
    var det = $('det'), i = UI.sel, open = UI.open(i), h;
    var head = function (lbl) { return '<div class="dhead"><span class="lbl">' + lbl + '</span>' + (open ? '' : '<span class="lk dlk">' + ICON.lock + '</span>') + '</div>'; };
    if (i < 5) {
      var L = LEVELS[i], r = S.lv[i], pct = TEST ? 100 : Math.floor(clamp(r.best / L.u, 0, 1) * 100), pips = '<span class="pips">';
      for (var k = 1; k <= 5; k++) pips += '<i class="' + (k <= i + 1 ? 'f' : '') + '"></i>'; pips += '</span>';
      var cl = Unlock.cleared();
      h = head('Level ' + pad2(i + 1) + pips) + '<div class="dname">' + esc(L.name) + '</div>' +
        '<div class="stats"><div><span class="lbl">Distance</span><b>' + L.m + ' m</b></div><div><span class="lbl">Speed</span><b>' + Math.round(L.speed * MPU) + ' m/s</b></div>' +
        '<div><span class="lbl">Best time</span><b>' + (r.time ? fmtTime1(r.time) : '-') + '</b></div><div><span class="lbl">Attempts</span><b>' + r.att + '</b></div></div>' +
        '<div class="bars"><div><div class="lbl"><span>Best run</span><b>' + pct + '%</b></div><div class="meter p"><i style="width:' + pct + '%"></i></div></div>' +
        '<div><div class="lbl"><span>Levels cleared</span><b>' + cl + ' / 5</b></div><div class="meter"><i style="width:' + cl * 20 + '%"></i></div></div></div>';
    } else {
      var e = S.end;
      h = head('Unlimited') + '<div class="dname">Endless</div>' +
        '<div class="stats"><div><span class="lbl">Best</span><b>' + Math.floor(e.best * MPU) + ' m</b></div><div><span class="lbl">Time</span><b>' + fmtTime1(e.time) + '</b></div>' +
        '<div><span class="lbl">Runs</span><b>' + e.runs + '</b></div><div><span class="lbl">Top speed</span><b>' + Math.round(endlessSpeed(e.best) * MPU) + ' m/s</b></div></div>';
    }
    det.innerHTML = '<div class="pvwrap' + (open ? '' : ' locked') + '"><canvas id="pv"></canvas></div><div class="dbody">' + h +
      '<div class="dacts"><button class="btn" data-a="play"' + (open ? '' : ' disabled') + '>' + ICON.play + 'Play</button></div></div>';
    det.querySelector('[data-a=play]').addEventListener('click', function () { UI.playSel(); });
  },
  playSel: function () { if (!UI.open(UI.sel)) return; if (UI.sel < 5) UI.play('level', UI.sel); else UI.play('endless', 0); },
  play: function (mode, idx) {
    UI.closeModal();
    UI.screen = 'play'; $('menu').hidden = true; $('pbar').hidden = false;
    Snd.ensure();
    var crumb = mode === 'endless' ? '<b>Endless</b>' : '<b>Level ' + pad2(idx + 1) + '</b><span>' + esc(LEVELS[idx].name) + '</span>';
    UI.setBar(crumb, true, '<button class="tb" data-a="pause" aria-label="Pause">' + ICON.pause + '</button>');
    $('acts').querySelector('[data-a=pause]').addEventListener('click', UI.pause);
    $('acts').querySelector('[data-a=pause]').addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    if (mode === 'level') UI.sel = idx; else UI.sel = 5;
    Game.start(mode, idx);
    $('pFill').parentNode.hidden = false;
  },
  hud: function () {
    if (!Game.on) return;
    $('hAtt').textContent = Game.sessAtt;
    var r = Game.rec();
    $('hBest').textContent = Game.mode === 'endless' ? Math.floor(r.best * MPU) + ' m' : (TEST ? 100 : Math.floor(clamp(r.best / Game.target(), 0, 1) * 100)) + '%';
  },
  prog: function () {
    if (!Game.on) return;
    var m = Math.floor(Math.max(0, Game.x) * MPU);
    if (Game.mode === 'endless') {
      var b = S.end.best * MPU;
      $('pDist').innerHTML = '<b>' + m + '</b> m';
      $('pFill').style.width = (b > 0 ? Math.min(1, m / b) * 100 : 0).toFixed(2) + '%';
    } else {
      var T = LEVELS[Game.idx].m; m = Math.min(m, T);
      $('pDist').innerHTML = '<b>' + m + '</b> / ' + T + ' m';
      $('pFill').style.width = (m / T * 100).toFixed(2) + '%';
    }
    $('pTime').innerHTML = '<b>' + fmtTime1(Game.t) + '</b>';
  },
  flash: function (big, small) {
    var f = $('flash'); f.innerHTML = '<b>' + esc(big) + '</b>' + (small ? '<div class="lbl">' + esc(small) + '</div>' : '');
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    clearTimeout(UI.flashT); UI.flashT = setTimeout(function () { f.classList.remove('go'); }, 900);
  },
  pause: function () {
    if (!Game.on || Game.phase === 'done' || UI.modal) return;
    Game.paused = true; Input.clear();
    var sub = Game.mode === 'endless' ? 'Endless' : 'Level ' + pad2(Game.idx + 1);
    UI.card('Paused', sub, null, null, [
      ['Resume', '', UI.resume],
      ['Restart', 'ghost', function () { UI.closeModal(); Game.paused = false; Game.newRun(); }],
      ['Levels', 'ghost', UI.toMenu]
    ]);
  },
  resume: function () { UI.closeModal(); Game.paused = false; Loop.last = 0; },
  complete: function () {
    var i = Game.idx, inf = Game.info || { time: Game.t, att: Game.sessAtt };
    var stats = [['Time', fmtTime1(inf.time)], ['Attempts', inf.att], ['Distance', LEVELS[i].m + ' m']];
    var acts = [];
    if (i < 4) acts.push(['Next level', '', function () { UI.play('level', i + 1); }]);
    else acts.push(['Endless', '', function () { UI.play('endless', 0); }]);
    acts.push(['Replay', 'ghost', function () { UI.play('level', i); }]);
    acts.push(['Levels', 'ghost', function () { UI.sel = i < 4 ? i + 1 : 5; UI.toMenu(); }]);
    UI.card('Complete', 'Level ' + pad2(i + 1) + '  ' + LEVELS[i].name, stats, inf.unlocked ? ICON.open + '<span>' + esc(inf.unlocked) + '</span>' : (inf.fastest && !inf.first ? '<span>New best time</span>' : null), acts);
  },
  card: function (title, sub, stats, note, acts) {
    var o = $('ovl'), h = '<div class="card"><div class="lbl">' + esc(sub || '') + '</div><div class="big">' + esc(title) + '</div>';
    if (stats) { h += '<div class="stats">'; stats.forEach(function (s) { h += '<div><span class="lbl">' + esc(s[0]) + '</span><b>' + esc(s[1]) + '</b></div>'; }); h += '</div>'; }
    if (note) h += '<div class="lbl note">' + note + '</div>';
    h += '<div class="col">';
    acts.forEach(function (a, i) { h += '<button class="btn wide ' + a[1] + '" data-k="' + i + '">' + esc(a[0]) + '</button>'; });
    h += '</div></div>';
    o.innerHTML = h; o.hidden = false; UI.modal = { acts: acts };
    o.querySelectorAll('[data-k]').forEach(function (b) { b.addEventListener('click', function (ev) { ev.stopPropagation(); acts[+b.getAttribute('data-k')][2](); }); });
    o.onpointerdown = function (ev) { ev.stopPropagation(); };
  },
  closeModal: function () { var o = $('ovl'); o.hidden = true; o.innerHTML = ''; UI.modal = null; },
  toast: function (msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(UI.toastT); UI.toastT = setTimeout(function () { t.classList.remove('on'); }, 1300); }
};
function fmtKm(m) { return m >= 10000 ? (m / 1000).toFixed(1) + ' km' : Math.floor(m) + ' m'; }

/* ---------------- 11. loop and input ---------------- */
var HOLD = { Space: 1, ArrowUp: 1, KeyW: 1 };
var Input = {
  keys: {}, ptrs: {},
  held: function () { var k; for (k in Input.keys) if (Input.keys[k]) return true; for (k in Input.ptrs) if (Input.ptrs[k]) return true; return false; },
  clear: function () { Input.keys = {}; Input.ptrs = {}; }
};
var main = { cv: null, ctx: null };
var Loop = {
  last: 0,
  frame: function (now) {
    var dt = Loop.last ? Math.min(0.1, (now - Loop.last) / 1000) : 1 / 60; Loop.last = now;
    if (UI.screen === 'play' && Game.on) {
      Game.update(dt);
      Loop.draw();
      UI.prog();
    } else if (UI.screen === 'menu') Preview.draw(dt);
    requestAnimationFrame(Loop.frame);
  },
  draw: function () {
    var cv = main.cv, dpr = fit(cv), w = cv.width, h = cv.height;
    View.w = w; View.h = h; View.dpr = dpr;
    if (!Game.st) return;
    var cell = View.cellFor(w, h), camX = Game.x - View.leftFrac(cv.clientWidth) * (w / cell);
    var v = View.make(w, h, dpr, camX);
    var fl = Game.phase === 'dead' ? Math.max(0, 0.22 * (1 - Game.timer / 0.3)) * (reduceMotion ? 0.5 : 1) : 0;
    Render.frame(main.ctx, v, Game.st, { marks: true, finish: Game.mode === 'level' ? Game.target() : null, trail: Game.trail, x: Game.x, y: Game.y, dir: Game.dir,
      player: Game.phase !== 'dead', parts: Game.parts, flash: fl });
  }
};
function initInput() {
  var cv = main.cv;
  cv.addEventListener('pointerdown', function (e) {
    if (UI.screen !== 'play' || UI.modal || !Game.on) return;
    e.preventDefault(); Input.ptrs[e.pointerId] = 1; Snd.ensure();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  var up = function (e) { delete Input.ptrs[e.pointerId]; };
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  cv.addEventListener('lostpointercapture', up);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    var c = e.code;
    if (UI.screen === 'play' && (HOLD[c] || c === 'Enter')) { var ae = DOC.activeElement; if (ae && ae.tagName === 'BUTTON') ae.blur(); }
    if (UI.modal) {
      if (c === 'Enter' || (c === 'Space' && !e.repeat)) { e.preventDefault(); UI.modal.acts[0][2](); return; }
      if (c === 'Escape' && Game.on && Game.paused) { e.preventDefault(); UI.resume(); }
      if (HOLD[c]) e.preventDefault();
      return;
    }
    if (UI.screen === 'play') {
      if (HOLD[c]) { e.preventDefault(); Input.keys[c] = 1; return; }
      if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); UI.pause(); return; }
      if (c === 'KeyR' && Game.phase === 'play') { Game.newRun(); return; }
    } else if (UI.screen === 'menu') {
      if (c === 'ArrowDown' || c === 'ArrowUp') { e.preventDefault(); UI.sel = clamp(UI.sel + (c === 'ArrowDown' ? 1 : -1), 0, 5); UI.menu(); return; }
      if (c === 'Enter' || c === 'Space') { e.preventDefault(); UI.playSel(); }
    }
  });
  window.addEventListener('keyup', function (e) { if (HOLD[e.code]) { delete Input.keys[e.code]; e.preventDefault(); } });
  window.addEventListener('blur', function () { Input.clear(); if (UI.screen === 'play' && Game.on && Game.phase === 'play' && !UI.modal) UI.pause(); });
  DOC.addEventListener('visibilitychange', function () { if (DOC.hidden && UI.screen === 'play' && Game.on && Game.phase === 'play' && !UI.modal) UI.pause(); });
}

/* debug and automation hook */
var W = window.__wave = {
  onTick: null,
  state: function () {
    return { screen: UI.screen, mode: Game.mode, level: Game.idx, phase: Game.phase, paused: Game.paused, x: Game.x, y: Game.y, dir: Game.dir,
      dist: Math.floor(Math.max(0, Game.x) * MPU), time: Game.t, attempt: Game.sessAtt, speed: Game.on ? Game.speed(Game.x) : 0,
      target: Game.on ? Game.target() : 0, modal: !!UI.modal, open: S.open };
  },
  hit: function (x, y, r) { return Game.st ? Game.st.hit(x, y, r) : false; },
  save: function () { return JSON.parse(JSON.stringify(S)); },
  unlockAll: function () { S.open = 6; Store.save(true); if (UI.screen === 'menu') UI.menu(); },
  validate: function () { return Solver.all(); },
  play: function (i) { if (i === 'endless') UI.play('endless', 0); else UI.play('level', i | 0); },
  menu: function () { UI.toMenu(); },
  select: function (i) { UI.sel = i; if (UI.screen === 'menu') UI.menu(); },
  chunks: CHUNKS.map(function (c) { return { id: c.id, d: c.d, L: c.L }; }),
  levels: LEVELS.map(function (L) { return { name: L.name, m: L.m, units: L.u, speed: L.speed, seconds: +(L.u / L.speed).toFixed(1), dmin: L.dmin, dmax: L.dmax }; }),
  R: R, PAD: SOLVE_PAD
};

/* ---------------- boot ---------------- */
main.cv = $('cv'); main.ctx = main.cv.getContext('2d');
Theme.watch(); Theme.apply(); UI.init(); initInput();
Store.load();
requestAnimationFrame(Loop.frame);
})();
</script>
