<style>

  .scbox b { white-space: nowrap; overflow: hidden; min-width: 0; line-height: 1.2 !important; }

  .cm { display: flex; align-items: center; gap: 6px; }

    font: 700 24px/1 var(--display); color: #fff; overflow: hidden; }

    transition: transform .32s cubic-bezier(.2,.8,.25,1), opacity .3s; touch-action: none; }
  .pcard.s-H { color: var(--ink-h); } .pcard.s-D { color: var(--ink-d); } .pcard.s-C { color: var(--ink-c); }
  .pcard .ci { position: absolute; left: 7%; top: 5%; display: flex; flex-direction: column; align-items: center; width: 26%; }
  .pcard .ci b { font: 700 calc(var(--cw) * .25)/1 var(--display); letter-spacing: -0.04em; }
  .pcard .ci svg { width: calc(var(--cw) * .17); height: calc(var(--cw) * .17); margin-top: 1px; }

  .pcard .cc svg { width: 100%; height: auto; }
