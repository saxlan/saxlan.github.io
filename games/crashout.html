<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>crashout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --display: 'Fredoka', 'Nunito', system-ui, sans-serif;
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --green: #58cc02; --green-dark: #58a700;
    --blue: #1cb0f6; --blue-dark: #1899d6; --blue-wash: #ddf4ff; --blue-line: #84d8ff;
    --red: #ff4b4b; --gold: #ffc800;
    --line: #e5e5e5; --text: #4b4b4b; --text-dim: #777; --text-faint: #afafaf;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #d9ccff; color: var(--text); font: 800 16px/1.4 var(--font); }
  body { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button, input { font-family: inherit; }
  :focus, :focus-visible { outline: none; }
  [hidden] { display: none !important; }

  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #bar { position: absolute; top: 0; left: 0; right: 0; height: 64px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: #fff; border-bottom: 2px solid var(--line); }
  #brand { cursor: pointer; font: 700 28px/1 var(--display); letter-spacing: -0.02em; color: var(--blue); flex: 0 0 auto; }
  #meter { flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
  .mwrap { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 340px; }
  .mlabel { font: 700 15px/1 var(--display); color: var(--text-dim); white-space: nowrap; }
  .mtrack { position: relative; flex: 1; height: 16px; border-radius: 99px; background: #e5e5e5; overflow: hidden; }
  .mfill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 99px; background: var(--red); transition: width .25s ease, background-color .4s; }
  .mfill::after { content: ''; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.35); }
  .right { display: flex; gap: 8px; flex: 0 0 auto; }
  .ib { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer;
    background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; color: var(--text-faint); padding: 0; }
  .ib svg { width: 22px; height: 22px; }
  .ib:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  .ib:hover { background: #f7f7f7; }

  #dock { position: absolute; left: 0; right: 0; bottom: 12px; z-index: 5; display: flex; justify-content: flex-start; pointer-events: none; padding: 0 10px; overflow-x: auto; overscroll-behavior: none; scrollbar-width: none; }
  #dock::-webkit-scrollbar { display: none; }
  #tools { pointer-events: auto; margin: 0 auto; flex: 0 0 auto; display: flex; gap: 8px; padding: 8px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 22px; }
  .tool { width: 66px; height: 66px; border-radius: 16px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; color: var(--text-dim); transition: transform .08s; }
  .tool svg { width: 34px; height: 34px; }
  .tool span { font: 700 12px/1 var(--display); letter-spacing: .01em; }
  .tool:hover { background: #f7f7f7; }
  .tool.on { background: var(--blue-wash); border-color: var(--blue-line); color: var(--blue-dark); }
  .tool:active { transform: translateY(2px); border-bottom-width: 2px; }
  .tool.tog.on { background: #e9ffd9; border-color: #a5ed6e; color: #58a700; }
  .ib.on { background: #ffdfe0; border-color: #ffb3b8; color: #ff4b4b; }

  #nameCard { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(40,30,70,.35); }
  .card { width: min(340px, calc(100vw - 32px)); background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 20px; padding: 20px; text-align: center; }
  .card h2 { margin: 0 0 14px; font: 700 24px/1.2 var(--display); color: var(--text); }
  .card input { width: 100%; height: 50px; border: 2px solid var(--line); border-radius: 14px; background: #f7f7f7; padding: 0 14px; font: 800 20px/1 var(--font); color: var(--text); text-align: center; }
  .card input:focus { border-color: var(--blue-line); background: #fff; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; height: 48px; border-radius: 14px; cursor: pointer; font: 800 15px/1 var(--font); text-transform: uppercase; letter-spacing: .05em;
    border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; color: var(--text-dim); }
  .btn.go { background: var(--green); border-color: var(--green-dark); color: #fff; }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; }

  @media (max-width: 600px) {
    #bar { height: 56px; padding: 0 10px; gap: 8px; }
    #brand { font-size: 23px; }
    .mlabel { display: none; }
    .ib { width: 38px; height: 38px; border-radius: 11px; }
    .ib svg { width: 19px; height: 19px; }
    .right { gap: 6px; }
    #dock { bottom: 8px; padding: 0 6px; pointer-events: auto; touch-action: pan-x; }
    #tools { gap: 4px; padding: 5px; border-radius: 18px; }
    .tool { width: 50px; height: 56px; border-radius: 13px; flex: 0 0 auto; }
    .tool svg { width: 28px; height: 28px; }
    .tool span { font-size: 10px; }
  }
  @media (max-width: 360px) { .tool { width: 46px; } .tool span { font-size: 9px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar">
  <div id="brand" onclick="try{parent.postMessage({type:'games-menu'},'*')}catch(e){}">crashout</div>
  <div id="meter"><div class="mwrap"><span class="mlabel">stress</span><div class="mtrack"><div class="mfill" id="mfill"></div></div></div></div>
  <div class="right">
    <button class="ib" id="bName" aria-label="Name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
    <button class="ib" id="bSound" aria-label="Sound"></button>
    <button class="ib" id="bBlood" aria-label="Fake blood"><svg viewBox="0 0 24 24"><path d="M12 3c3 4.5 6.5 8 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 11 9 7.5 12 3z" fill="currentColor"/><path d="M9 15a3 3 0 0 0 2 2.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/></svg></button>
    <button class="ib" id="bReset" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
  </div>
</div>

<div id="dock"><div id="tools"></div></div>

<div id="nameCard" hidden>
  <div class="card">
    <h2>Name your buddy</h2>
    <input id="nameIn" maxlength="14" autocomplete="off" spellcheck="false">
    <div class="row"><button class="btn" id="nCancel">Cancel</button><button class="btn go" id="nSave">Save</button></div>
  </div>
</div>

<script>
(function(){
'use strict';
try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'game-ready', game: 'crashout' }, '*'); } catch (e) {}

/* ---------- storage ---------- */
function lsGet(k, d){ try { var v = localStorage.getItem('sx-crash-' + k); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem('sx-crash-' + k, v); } catch (e) {} }

var dollName = lsGet('name', 'Mochi');
var muted = lsGet('mute', '0') === '1';
var toolId = lsGet('tool', 'grab');

/* ---------- helpers ---------- */
var TAU = Math.PI * 2;
function rnd(a, b){ return a + Math.random() * (b - a); }
function pick(a){ return a[(Math.random() * a.length) | 0]; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function lerp(a, b, t){ return a + (b - a) * t; }
function hexRgb(h){ h = h.replace('#',''); return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
function shade(h, amt){ var c = hexRgb(h); var f = amt < 0 ? 0 : 255, t = Math.abs(amt);
  return 'rgb(' + Math.round(c[0] + (f - c[0]) * t) + ',' + Math.round(c[1] + (f - c[1]) * t) + ',' + Math.round(c[2] + (f - c[2]) * t) + ')'; }
function easeOutBack(t){ var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

/* ---------- audio ---------- */
var AC = null, master = null, noiseBuf = null;
function ac(){
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.55;
    var comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 1.2, AC.sampleRate);
    var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function env(g, t, vol, att, dur){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function tone(o){
  if (muted || !ac()) return;
  var t = AC.currentTime + (o.delay || 0), osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f0, t);
  if (o.fm) osc.frequency.exponentialRampToValueAtTime(o.fm, t + o.dur * (o.mid || 0.4));
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
  if (o.vib) { var l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = o.vib; lg.gain.value = o.vibAmt || 30; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + o.dur + 0.05); }
  var node = osc;
  if (o.filter) { var f = AC.createBiquadFilter(); f.type = o.filter; f.frequency.value = o.ff || 1200; f.Q.value = o.q || 1; osc.connect(f); node = f; }
  node.connect(g); g.connect(master);
  env(g, t, o.vol || 0.3, o.att || 0.005, o.dur);
  osc.start(t); osc.stop(t + o.dur + 0.05);
}
function noise(o){
  if (muted || !ac()) return;
  var t = AC.currentTime + (o.delay || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
  f.frequency.setValueAtTime(o.f0, t); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
  s.connect(f); f.connect(g); g.connect(master);
  env(g, t, o.vol || 0.3, o.att || 0.004, o.dur);
  s.start(t, Math.random() * 0.4); s.stop(t + o.dur + 0.05);
}
var SFX = {
  thump: function(p){ p = p || 1; tone({ f0: 170 * rnd(.9,1.1), f1: 48, dur: .2, vol: .45 * p }); noise({ f0: 500, f1: 150, type: 'lowpass', dur: .12, vol: .25 * p }); },
  squeak: function(){ var b = rnd(800, 1100); tone({ type: 'triangle', f0: b, fm: b * 1.6, f1: b * 1.15, mid: .35, dur: .22, vol: .22, vib: 28, vibAmt: 60 }); },
  boing: function(p){ p = p || 1; var b = rnd(180, 240); tone({ type: 'sine', f0: b, fm: b * 2.4, f1: b * 1.6, mid: .2, dur: .42, vol: .32 * p, vib: 14, vibAmt: 45 }); },
  whoosh: function(){ noise({ f0: 300, f1: 1800, q: .9, dur: .2, vol: .18, att: .05 }); },
  slap: function(){ noise({ f0: 2400, f1: 900, q: .7, dur: .09, vol: .5 }); tone({ f0: 220, f1: 70, dur: .14, vol: .35 }); },
  floof: function(){ noise({ f0: 900, f1: 250, q: .6, dur: .3, vol: .32, att: .02 }); tone({ f0: 120, f1: 60, dur: .2, vol: .25 }); },
  squawk: function(){ var b = rnd(520, 640); tone({ type: 'sawtooth', f0: b, fm: b * 1.5, f1: b * .7, mid: .3, dur: .38, vol: .16, vib: 34, vibAmt: 70, filter: 'bandpass', ff: 1400, q: 2.5 }); tone({ type: 'square', f0: b * 2, f1: b * 1.2, dur: .3, vol: .04, vib: 30, vibAmt: 90 }); },
  pop: function(){ tone({ f0: 900, f1: 180, dur: .09, vol: .3 }); },
  fuse: function(){ noise({ f0: 5000, q: 2, dur: .45, vol: .08, att: .05 }); },
  boom: function(){ noise({ f0: 1400, f1: 90, type: 'lowpass', dur: .8, vol: .6 }); tone({ f0: 110, f1: 32, dur: .55, vol: .55 }); for (var i = 0; i < 6; i++) tone({ type: 'triangle', f0: rnd(1500, 3200), dur: .12, vol: .06, delay: .1 + i * .06 }); },
  chime: function(){ [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone({ type: 'triangle', f0: f, dur: .7, vol: .16, delay: i * .11, att: .01 }); }); },
  gun: function(type){ if (type === 'shotgun') { noise({ type: 'lowpass', f0: 3200, f1: 220, dur: .32, vol: .42 }); tone({ f0: 130, f1: 35, dur: .26, vol: .36 }); noise({ type: 'highpass', f0: 2500, dur: .03, vol: .12, delay: .34 }); noise({ type: 'highpass', f0: 2000, dur: .04, vol: .12, delay: .45 }); } else { noise({ type: 'lowpass', f0: 4200, f1: 500, dur: .14, vol: .3 }); tone({ f0: 210, f1: 50, dur: .1, vol: .24 }); } },
  whistle: function(d){ tone({ f0: 1500, f1: 380, dur: Math.max(.3, d), vol: .07, att: .05 }); },
  rumble: function(){ noise({ type: 'lowpass', f0: 700, f1: 50, dur: 3, vol: .7, att: .01 }); tone({ f0: 62, f1: 22, dur: 2.6, vol: .55, att: .01 }); tone({ type: 'triangle', f0: 95, f1: 30, dur: 1.4, vol: .28 }); },
  fizz: function(){ noise({ type: 'highpass', f0: 3500 + Math.random() * 2500, dur: .13, vol: .045, att: .01 }); },
  splat: function(){ tone({ f0: 330, f1: 110, dur: .1, vol: .14 }); noise({ f0: 700, q: 1.2, dur: .08, vol: .12 }); },
  launch: function(){ tone({ f0: 300, f1: 900, dur: .1, vol: .18 }); noise({ f0: 1200, q: .8, dur: .08, vol: .15 }); }
};

/* ---------- canvas & layout ---------- */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1, U = 40, floorY = 0, wallBase = 0, topH = 64, dockH = 90;
var bg = document.createElement('canvas'), bgx = bg.getContext('2d');

function layout(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  var bar = document.getElementById('bar'), tools = document.getElementById('tools');
  topH = bar.offsetHeight;
  dockH = tools.offsetHeight + (W <= 600 ? 8 : 12);
  floorY = H - dockH - Math.max(16, H * 0.045);
  var oldU = U;
  U = Math.min((floorY - topH - 24) / 8.2, W / 9.5);
  U = Math.max(U, 18);
  wallBase = floorY - Math.max(36, U * 1.1);
  drawBg();
  if (doll) {
    if (Math.abs(oldU - U) > 0.5) buildDoll(W / 2);
    else for (var i = 0; i < doll.length; i++) { var p = doll[i]; p.x = clamp(p.x, p.r, W - p.r); p.px = p.x; p.y = Math.min(p.y, floorY - p.r); p.py = p.y; }
  }
}

/* ---------- background: padded room ---------- */
function drawBg(){
  bg.width = cv.width; bg.height = cv.height;
  var g = bgx; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  // wall base
  g.fillStyle = '#d9ccff'; g.fillRect(0, 0, W, H);
  // quilted diamonds
  var cell = Math.max(64, U * 2.1), hh = cell * 0.62;
  for (var row = -1; row * hh < wallBase + hh; row++) {
    for (var col = -1; col * cell < W + cell; col++) {
      var cx = col * cell + (row % 2 ? cell / 2 : 0), cy = row * hh;
      g.save();
      g.beginPath(); g.moveTo(cx, cy - hh); g.lineTo(cx + cell / 2, cy); g.lineTo(cx, cy + hh); g.lineTo(cx - cell / 2, cy); g.closePath();
      var rg = g.createRadialGradient(cx - cell * .1, cy - hh * .25, 2, cx, cy, cell * .62);
      rg.addColorStop(0, '#ebe3ff'); rg.addColorStop(.55, '#d8cbff'); rg.addColorStop(1, '#b9a6f2');
      g.fillStyle = rg; g.fill();
      g.restore();
    }
  }
  // seams + stitches
  g.strokeStyle = 'rgba(140,116,214,.55)'; g.lineWidth = 1.5;
  g.setLineDash([5, 5]);
  for (var k = -40; k < 40; k++) {
    var x0 = k * cell / 2;
    g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0 + (wallBase / hh) * cell / 2, wallBase); g.stroke();
    g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0 - (wallBase / hh) * cell / 2, wallBase); g.stroke();
  }
  g.setLineDash([]);
  // tuft buttons
  for (row = 0; row * hh < wallBase; row++) {
    for (col = -1; col * cell < W + cell; col++) {
      var bx = col * cell + (row % 2 ? 0 : cell / 2), by = row * hh;
      if (by < 4) continue;
      g.fillStyle = 'rgba(90,60,170,.18)'; g.beginPath(); g.arc(bx, by + 2, 6, 0, TAU); g.fill();
      g.fillStyle = '#a28ce8'; g.beginPath(); g.arc(bx, by, 5, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(bx - 1.5, by - 1.5, 1.8, 0, TAU); g.fill();
    }
  }
  // soft lamp glow
  var lg = g.createRadialGradient(W * .5, topH + 40, 10, W * .5, topH + 40, Math.max(W, H) * .7);
  lg.addColorStop(0, 'rgba(255,248,230,.45)'); lg.addColorStop(1, 'rgba(255,248,230,0)');
  g.fillStyle = lg; g.fillRect(0, 0, W, wallBase);
  // wall shadow toward floor
  var ws = g.createLinearGradient(0, wallBase - U * 1.2, 0, wallBase);
  ws.addColorStop(0, 'rgba(80,50,150,0)'); ws.addColorStop(1, 'rgba(80,50,150,.18)');
  g.fillStyle = ws; g.fillRect(0, wallBase - U * 1.2, W, U * 1.2);
  // floor mat
  var fg = g.createLinearGradient(0, wallBase, 0, H);
  fg.addColorStop(0, '#f4c08f'); fg.addColorStop(.25, '#ffd7aa'); fg.addColorStop(1, '#ffcf9c');
  g.fillStyle = fg; g.fillRect(0, wallBase, W, H - wallBase);
  // mat seams (perspective)
  g.strokeStyle = 'rgba(214,150,92,.45)'; g.lineWidth = 2;
  var vpX = W / 2, n = Math.ceil(W / (U * 2.6)) + 6;
  for (var i = -n; i <= n; i++) {
    var xt = vpX + i * U * 2.6, xb = vpX + i * U * 2.6 * 1.9;
    g.beginPath(); g.moveTo(xt, wallBase + 6); g.lineTo(xb, H); g.stroke();
  }
  var ys = [wallBase + (H - wallBase) * .32, wallBase + (H - wallBase) * .7];
  ys.forEach(function(y){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); });
  // bumper cushion along wall
  var bh = Math.max(14, U * .42);
  g.fillStyle = 'rgba(120,70,40,.15)'; roundRect(g, -10, wallBase - bh * .2, W + 20, bh + 6, bh / 2); g.fill();
  var bgr = g.createLinearGradient(0, wallBase - bh * .5, 0, wallBase + bh * .6);
  bgr.addColorStop(0, '#fff3e6'); bgr.addColorStop(1, '#f7d2b0');
  g.fillStyle = bgr; roundRect(g, -10, wallBase - bh * .5, W + 20, bh, bh / 2); g.fill();
  g.strokeStyle = 'rgba(214,150,92,.5)'; g.setLineDash([6, 5]); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(0, wallBase); g.lineTo(W, wallBase); g.stroke(); g.setLineDash([]);
  // vignette
  var vg = g.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .35, W / 2, H * .45, Math.max(W, H) * .85);
  vg.addColorStop(0, 'rgba(60,30,90,0)'); vg.addColorStop(1, 'rgba(60,30,90,.22)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}
function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

/* ---------- ragdoll ---------- */
var HEAD = 0, CHEST = 1, PELV = 2, LEL = 3, LHA = 4, REL = 5, RHA = 6, LKN = 7, LFT = 8, RKN = 9, RFT = 10;
var RADII = [0.95, 0.6, 0.58, 0.26, 0.32, 0.26, 0.32, 0.28, 0.34, 0.28, 0.34];
// standing pose: [x, height above floor] in U

/* ---------- mood ---------- */
var mood = { dizzy: 0, annoyed: 0, relieved: 0, worried: 0, heat: 0, blink: 0, nextBlink: 2, wasDown: false, calm: 0 };

function onHit(amount, big){

  mood.heat += big ? 1.6 : 1;
  if (mood.heat > 4.5 || big && mood.heat > 2.5) mood.dizzy = 2.6 + Math.random();
  mood.annoyed = 2.2;
  mood.relieved = 0;
  mood.wasDown = true;
  stress = Math.max(0, stress - amount * 1.4);
  if (stress <= 0) allBetter();
}
function allBetter(){
  calmT = 4.2;
  setTimeout(SFX.chime, 250);
  mood.relieved = 4.5; mood.dizzy = 0; mood.annoyed = 0;
  var c = center();
  for (var i = 0; i < 18; i++) particles.push({ k: 'heart', x: c.x + rnd(-3, 3) * U, y: c.y + rnd(-1, 2) * U, vx: rnd(-.3, .3) * U, vy: rnd(-2.2, -1) * U, life: rnd(2, 3.2), t: 0, s: rnd(.25, .45) * U, rot: rnd(-.4, .4), col: pick(['#ff7a9a', '#ff9eb5', '#ff5c85']) });

  lsSet('calms', String((+lsGet('calms', '0') || 0) + 1));
}
function moodUpdate(dt){
  mood.heat = Math.max(0, mood.heat - dt * 0.9);
  mood.dizzy = Math.max(0, mood.dizzy - dt);
  mood.annoyed = Math.max(0, mood.annoyed - dt);
  mood.relieved = Math.max(0, mood.relieved - dt);
  mood.worried = Math.max(0, mood.worried - dt);
  mood.nextBlink -= dt;
  if (mood.nextBlink <= 0) { mood.blink = 0.14; mood.nextBlink = rnd(2, 4.5); }
  mood.blink = Math.max(0, mood.blink - dt);
  if (mood.wasDown && getup > 0.97 && mood.dizzy <= 0 && grabbed < 0) { mood.wasDown = false; mood.relieved = 2.2; mood.annoyed = 0; }
}
function face(){
  if (calmT > 0 && grabbed < 0) return 'relieved';
  if (mood.dizzy > 0) return 'dizzy';
  if (grabbed >= 0) return 'worried';
  if (mood.annoyed > 0) return 'annoyed';
  if (calmT > 0 || mood.relieved > 0) return 'relieved';
  if (mood.worried > 0) return 'worried';
  return 'happy';
}

    } else {
      f.shots.push([px, py]);
      if (py < wallBase - 6) { addDecal({ k: 'hole', x: px, y: py, r: rnd(.13, .17) * U, rot: rnd(0, TAU), life: 9 }); puff(px, py, 2, .35); }
      else { addDecal({ k: 'scorch', x: px, y: Math.max(py, wallBase + 6), r: rnd(.3, .45) * U, flat: .4, life: 8 }); puff(px, py, 2, .4); }
    }
  }
  if (hits) { stars(f.shots[0][0], f.shots[0][1], type === 'shotgun' ? 4 : 2); onHit(type === 'shotgun' ? 2 + hits * .6 : 2.8, head); }
  SFX.gun(type); shake(type === 'shotgun' ? 11 : 5);
  texts.push({ x: clamp(mx + Math.cos(a) * .3 * U, 70, W - 70), y: clamp(my - 1.1 * U, topH + 50, floorY - 30), txt: type === 'shotgun' ? pick(['BLAM', 'KABLAM', 'BANG']) : pick(['BANG', 'PEW', 'BAM']), t: 0, rot: rnd(-.25, .25), col: pick(['#ffc800', '#ff9600']) });

}
function drawGunFx(f){
  var p = f.t / f.dur, fade = p > .7 ? 1 - (p - .7) / .3 : 1;
  var rk = (f.t < .025 ? f.t / .025 : 1) * Math.exp(-Math.max(0, f.t - .025) * 14);

  if (f.t < .07) {
    ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,248,210,' + (1 - f.t / .07) + ')'; ctx.lineWidth = U * .07;

  }
  ctx.globalAlpha = fade;
  var back = rk * (f.type === 'shotgun' ? .75 : .5) * U, ra = f.a - rk * (f.type === 'shotgun' ? .35 : .5) * f.flip;
  drawGun(f.type, f.gx - Math.cos(f.a) * back, f.gy - Math.sin(f.a) * back, ra, f.flip, 1);
  if (f.t < .13) { ctx.globalAlpha = 1; drawMuzzleFlash(f.mx - Math.cos(f.a) * back, f.my - Math.sin(f.a) * back, f.a, (f.type === 'shotgun' ? .85 : .6) * U * (1.1 - f.t / .13 * .5)); }

}

/* nuke */
function trefoil(cx, cy, r1, r2){

    var a0 = (-120 + k * 120) * Math.PI / 180, a1 = a0 + Math.PI / 3;
    d += 'M' + f(cx + Math.cos(a0) * r1) + ' ' + f(cy + Math.sin(a0) * r1) + 'L' + f(cx + Math.cos(a0) * r2) + ' ' + f(cy + Math.sin(a0) * r2) +
      'A' + r2 + ' ' + r2 + ' 0 0 1 ' + f(cx + Math.cos(a1) * r2) + ' ' + f(cy + Math.sin(a1) * r2) + 'L' + f(cx + Math.cos(a1) * r1) + ' ' + f(cy + Math.sin(a1) * r1) +

function drawNuke(x, y, sc, rot){

  g.addColorStop(0, '#fff3a6'); g.addColorStop(.55, '#ffd23f'); g.addColorStop(1, '#e0a400');
  ctx.beginPath(); ctx.ellipse(0, 0, .6 * u, .98 * u, 0, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, .6 * u, .98 * u, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = '#3d4155'; ctx.fillRect(-u, -.66 * u, 2 * u, .17 * u); ctx.restore();
  ctx.fillStyle = '#2b2142'; circ(0, .12 * u, .08 * u); ctx.fill(new Path2D(trefoil(0, .12 * u, .13 * u, .4 * u)));
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ell(-.3 * u, -.2 * u, .08 * u, .26 * u, .25);
  ctx.restore();
}
function dropNuke(x){
  if (nukes.length >= 2) return;
  x = clamp(x, 1.5 * U, W - 1.5 * U);
  var y0 = topH - 1.6 * U, g = 15 * U, vy0 = 2 * U, d = floorY - 1.05 * U - y0;
  nukes.push({ x: x, y: y0, vy: vy0, g: g, t: 0, wob: rnd(0, TAU) });
  SFX.whistle((-vy0 + Math.sqrt(vy0 * vy0 + 2 * g * d)) / g);
}
function updNukes(dt){
  for (var i = nukes.length - 1; i >= 0; i--) {
    var n = nukes[i]; n.t += dt; n.vy += n.g * dt; n.y += n.vy * dt;
    var tip = n.y + 1.0 * U, hitDoll = false;
    for (var j = 0; j < doll.length; j++) { var p = doll[j]; if (Math.hypot(p.x - n.x, p.y - tip) < p.r + .25 * U) { hitDoll = true; break; } }

  }
}
function drawNukes(){
  nukes.forEach(function(n){
    var h = clamp((floorY - n.y) / (8 * U), 0, 1);
    ctx.fillStyle = 'rgba(120,60,30,' + (.25 * (1 - h)) + ')'; ell(n.x, floorY, (1.1 - h * .6) * U, (.3 - h * .15) * U, 0);
    drawNuke(n.x, n.y, 1, Math.sin(n.t * 14 + n.wob) * .07);
  });
}
function detonate(x, y){
  flashT = 1; glowT = 1;
  var big = Math.hypot(W, H);
  particles.push({ k: 'ring', x: x, y: y, t: 0, life: 1.1, s: big * 1.1, w: U * 1.1 });
  particles.push({ k: 'ring', x: x, y: y, t: 0, life: .75, s: big * .6, w: U * .6 });
  mushrooms.push({ x: x, t: 0, life: 5.5, seed: blobSeed(13) });
  for (var i = 0; i < doll.length; i++) {
    var p = doll[i], dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1, f = clamp(1.5 - d / (14 * U), .4, 1.5);
    impulse(i, dx / d * 1.1 * U * f, (dy / d * .6 - 1.0) * U * f);
  }
  balls.forEach(function(o){ var dx = o.x - x, d = Math.abs(dx) || 1; o.px -= dx / d * U * .8; o.py += U * .9; });
  addSquash(0, .45, 0); addSquash(1, .4, Math.PI / 2);
  addDecal({ k: 'scorch', x: x, y: floorY, r: 3.4 * U, flat: .3, life: 9 });
  stars(x, y - U, 10); puff(x, y, 18, 2); confetti(x, y, 30, 12);
  shakeAmt = 40;
  SFX.rumble();
  bigText = null;
  texts.push({ x: clamp(x, 120, W - 120), y: clamp(floorY - 7 * U, topH + 60, floorY - 60), txt: 'KABOOOM', t: 0, rot: rnd(-.12, .12), col: '#ff9600' });
  bleed(doll[CHEST].x, doll[CHEST].y, 16, 1.4);

var mLayer = document.createElement('canvas'), mctx = mLayer.getContext('2d');
function drawMushrooms(dt){
  if (!mushrooms.length) return;
  if (mLayer.width !== cv.width || mLayer.height !== cv.height) { mLayer.width = cv.width; mLayer.height = cv.height; }
  var main = ctx, tf = main.getTransform();
  for (var i = mushrooms.length - 1; i >= 0; i--) {
    var m = mushrooms[i]; m.t += dt; if (m.t >= m.life) { mushrooms.splice(i, 1); continue; }
    var q = m.t / m.life, e = 1 - Math.pow(1 - Math.min(1, m.t / 2.2), 3), a = q > .55 ? 1 - (q - .55) / .45 : Math.min(1, m.t * 8);
    var capR = (1 + 2 * e) * U, top = Math.max(topH + capR * .8 + .3 * U, floorY - (1.6 + 6 * e) * U - m.t * .25 * U);
    var heat = clamp(1 - m.t / 2.6, 0, 1);
    var cOut = mixCol('#f3ece6', '#ff8a3d', heat), cIn = mixCol('#ffffff', '#ffe066', heat), cDark = mixCol('#c9bcb4', '#e0542a', heat);
    ctx = mctx; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, mLayer.width, mLayer.height); ctx.setTransform(tf);
    ctx.save();
    var sw = (.45 + .25 * e) * U, steps = 9, k, t, yy, w;
    for (var pass = 0; pass < 2; pass++) {
      ctx.fillStyle = pass ? cOut : cDark;
      for (k = 0; k <= steps; k++) { t = k / steps; yy = lerp(floorY - .4 * U, top + capR * .3, t); w = sw * (1.35 - .55 * t) + Math.sin(m.t * 4 + k * 1.7) * .05 * U;
        circ(m.x + (pass ? -w * .12 : w * .1), yy + (pass ? -2 : 2), w * (pass ? .86 : 1)); }
    }
    for (k = 0; k < 7; k++) {
      var bx = m.x + (k - 3) * (.5 + e * .55) * U, br = (.5 + .3 * Math.abs(Math.sin(k * 2.1 + 1))) * U * (.6 + e * .6);
      ctx.fillStyle = cDark; circ(bx, floorY - br * .45, br); ctx.fillStyle = cOut; circ(bx - br * .15, floorY - br * .6, br * .8);
    }
    ctx.fillStyle = cOut; ell(m.x, lerp(floorY, top, .58), sw * 2.1, sw * .55, 0);
    var blobs = [];
    m.seed.forEach(function(s, j){ var an = Math.PI + (j + .5) / m.seed.length * Math.PI; blobs.push([m.x + Math.cos(an) * capR * .82, top + Math.sin(an) * capR * .55, capR * (.32 + s[2] * .5)]); });
    for (k = -2; k <= 2; k++) blobs.push([m.x + k * capR * .4, top + capR * .28, capR * .36]);
    ctx.fillStyle = cDark; blobs.forEach(function(b){ circ(b[0] + .05 * U, b[1] + capR * .12, b[2]); });
    ctx.fillStyle = cOut; blobs.forEach(function(b){ circ(b[0], b[1], b[2] * .92); });
    ctx.globalAlpha = .85; ctx.fillStyle = cIn; circ(m.x - capR * .22, top - capR * .18, capR * .42); circ(m.x + capR * .25, top - capR * .05, capR * .28);
    ctx.restore();
    ctx = main;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a; ctx.drawImage(mLayer, 0, 0); ctx.restore();
  }
  ctx = main;
}

/* acid rain */
function setAcid(on){
  acidOn = on;
  [].forEach.call(toolsEl.children, function(b){ if (b.dataset.tog) b.classList.toggle('on', on); });
  if (on) SFX.fizz();
}
function updAcid(dt){
  if (acidOn) {
    acidAcc += dt * W / 7;
    while (acidAcc >= 1) { acidAcc -= 1; drops.push({ x: rnd(-U, W + 2 * U), y: topH - rnd(0, 3 * U), vy: rnd(10, 13) * U, len: rnd(.3, .5) * U, landY: floorY + rnd(-.45, .5) * U }); }
    mood.worried = Math.max(mood.worried, .3); mood.relieved = 0;
  }
  fizzCD -= dt; splatCD -= dt;
  for (var i = drops.length - 1; i >= 0; i--) {
    var d = drops[i]; d.y += d.vy * dt; d.x -= .8 * U * dt;
    var hit = -1;
    for (var j = 0; j < doll.length; j++) { var p = doll[j], dx = d.x - p.x, dy = d.y - p.y; if (dx * dx + dy * dy < p.r * p.r) { hit = j; break; } }
    if (hit >= 0) {
      p = doll[hit];
      spots.push({ i: hit, ox: (d.x - p.x) * .75, oy: (d.y - p.y) * .75, r: rnd(.07, .14) * U, t: 0, life: rnd(3, 4.5) });
      if (spots.length > 50) spots.shift();
      particles.push({ k: 'puff', col: '#c9ffa3', x: d.x, y: d.y, vx: rnd(-.6, .6) * U, vy: -rnd(.6, 1.4) * U, life: .55, t: 0, s: rnd(.09, .16) * U });
      if (fizzCD <= 0) { SFX.fizz(); fizzCD = .07; }
      if (calmT <= 0) { stress = Math.max(0, stress - .12); if (stress <= 0) allBetter(); }
      drops.splice(i, 1); continue;
    }
    if (d.y >= d.landY) {
      var pd = null;
      for (j = 0; j < puddles.length; j++) if (Math.abs(puddles[j].x - d.x) < puddles[j].w * .8 && Math.abs(puddles[j].y - d.landY) < .45 * U) { pd = puddles[j]; break; }
      if (pd) { pd.w = Math.min(pd.w + .025 * U, 2.2 * U); pd.life = Math.min(pd.life + .35, 9); }
      else if (puddles.length < 45) puddles.push({ x: d.x, y: d.landY, w: rnd(.25, .4) * U, life: 3 });
      if (Math.random() < .35) particles.push({ k: 'gdrop', x: d.x, y: d.landY, vx: rnd(-1, 1) * U, vy: -rnd(1.5, 3) * U, life: .35, t: 0, s: rnd(.035, .065) * U });
      drops.splice(i, 1);
    }
  }
  for (i = puddles.length - 1; i >= 0; i--) {
    var q = puddles[i]; q.life -= dt;
    if (q.life <= 0) { puddles.splice(i, 1); continue; }
    if (Math.random() < dt * .9) particles.push({ k: 'puff', col: '#e8ffd9', x: q.x + rnd(-.5, .5) * q.w, y: q.y, vx: 0, vy: -U * .7, life: .9, t: 0, s: rnd(.06, .12) * U });
  }
  for (i = spots.length - 1; i >= 0; i--) { spots[i].t += dt; if (spots[i].t >= spots[i].life) spots.splice(i, 1); }
}
function drawPuddles(){
  puddles.forEach(function(q){
    var w = q.w * clamp(q.life / 3, .35, 1);
    ctx.globalAlpha = clamp(q.life / 2, 0, 1) * .9;
    ctx.fillStyle = 'rgba(60,170,30,.5)'; ell(q.x, q.y, w, w * .28, 0);
    ctx.fillStyle = 'rgba(160,255,100,.85)'; ell(q.x - w * .08, q.y - w * .04, w * .78, w * .19, 0);
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ell(q.x - w * .35, q.y - w * .08, w * .18, w * .045, 0);
  });
  ctx.globalAlpha = 1;
}
function drawSpots(){
  spots.forEach(function(s){
    var p = doll[s.i], a = clamp((s.life - s.t) / 1.5, 0, 1) * .8, x = p.x + s.ox, y = p.y + s.oy;
    ctx.globalAlpha = a * .5; ctx.fillStyle = '#b6ff7a'; circ(x, y, s.r * 1.5);
    ctx.globalAlpha = a; ctx.fillStyle = '#6fe830'; circ(x, y, s.r);
    ctx.fillStyle = 'rgba(240,255,220,.85)'; circ(x - s.r * .3, y - s.r * .3, s.r * .32);
  });
  ctx.globalAlpha = 1;
}
function drawAcid(){
  if (!drops.length) return;
  ctx.lineCap = 'round';
  function path(){ ctx.beginPath(); drops.forEach(function(d){ var sx = .8 * U / d.vy * d.len; ctx.moveTo(d.x + sx, d.y - d.len); ctx.lineTo(d.x, d.y); }); }
  path(); ctx.strokeStyle = 'rgba(140,255,70,.22)'; ctx.lineWidth = U * .2; ctx.stroke();
  ctx.strokeStyle = '#8dfa4a'; ctx.lineWidth = U * .07; ctx.stroke();
  ctx.fillStyle = '#efffdc'; drops.forEach(function(d){ circ(d.x, d.y, U * .035); });
}
function drawOverlay(dt){
  if (glowT > 0) { ctx.fillStyle = 'rgba(255,150,60,' + (glowT * glowT * .32) + ')'; ctx.fillRect(0, 0, W, H); glowT = Math.max(0, glowT - dt / 4); }
  if (flashT > 0) { ctx.fillStyle = 'rgba(255,255,250,' + Math.min(1, flashT * 1.2) + ')'; ctx.fillRect(0, 0, W, H); flashT = Math.max(0, flashT - dt * 1.1); }
}

/* ---------- loop ---------- */
var now = 0, last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  var dt = Math.min(.05, (ts - last) / 1000); last = ts; now = ts;
  if (!W) return;

  var steps = 0;
  while (acc >= STEP && steps < 8) { physStep(); ballStep(); acc -= STEP; steps++; if (impactCD > 0) impactCD -= STEP; }

  for (var i = toolsFx.length - 1; i >= 0; i--) { var f = toolsFx[i]; var before = f.t; f.t += dt; if (before < f.hitAt * f.dur && f.t >= f.hitAt * f.dur) toolHit(f); if (f.t >= f.dur) toolsFx.splice(i, 1); }

  drawPuddles();
  drawDoll(dt);
  drawSpots();
  balls.forEach(drawBall);
  drawNukes();
  drawAcid();
  toolsFx.forEach(drawToolFx);
  drawMushrooms(dt);
  drawParticles();
  drawTexts();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

}

window.addEventListener('resize', layout);
paintSound();
paintBlood();
setTool(toolId);
layout();
buildDoll(W / 2);
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){});

// test hook
window.__crash = {
  use: function(id, x, y){ setTool(id); useTool(x, y); },
  acid: function(on){ setAcid(on); }, blood: function(on){ blood = on; paintBlood(); },
  counts: function(){ return { decals: decals.length, puddles: puddles.length, spots: spots.length, drops: drops.length, nukes: nukes.length, mush: mushrooms.length }; },
  doll: function(){ return doll; }, state: function(){ return { stress: stress, face: face(), balls: balls.length, particles: particles.length, U: U, floorY: floorY }; }
};
})();
