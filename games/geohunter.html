<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>GeoBowl</title>
<style>
  :root {
    --bg: #171716; --panel: rgba(26,26,24,0.95); --panel2: rgba(44,44,40,0.97); --box: #232322; --box2: #2c2c29;
    --fg: #ebeae5; --fg2: #a3a199; --fg3: rgba(235,234,229,0.42); --line: rgba(255,255,255,0.12); --edge: #4a4942;
    --accent: #8b97ff; --accent-fg: #101010; --accent-bg: rgba(139,151,255,0.14);
    --green: #5cb485; --gold: #d3ab2a; --danger: #e07a6d;
    --font-ui: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
  *:focus, *:focus-visible { outline: none; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 400 14.5px/1.55 var(--font-ui);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-user-select: none; user-select: none; }
  body { overflow-x: hidden; }
  #bgc { display: none; }
  #gal { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: #171716; }
  #gal .trk { position: absolute; left: 0; top: 0; height: 100vh; width: calc(100vw + 480vh); background-repeat: repeat-x; background-size: auto 100vh; background-position: 0 0;
    will-change: transform; animation: galSlide 110s linear infinite; }
  #gal::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse farthest-corner at 50% 50%, rgba(8,8,7,0.34) 0%, rgba(8,8,7,0.5) 30%, rgba(8,8,7,0.74) 55%, rgba(6,6,5,0.92) 78%, rgba(4,4,3,0.985) 100%); }
  @keyframes galSlide { from { transform: translate3d(0,0,0); } to { transform: translate3d(-240vh,0,0); } }
  @media (prefers-reduced-motion: reduce) { #gal .trk { animation: none; } }
  button { font-family: inherit; color: inherit; }
  .lbl { font: 500 12.5px/1.4 var(--font-ui); letter-spacing: 0.03em; text-transform: uppercase; color: var(--fg2); }

  /* ---------- top bar (planner style) ---------- */
  #bar { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 1px 0 var(--line); }
  .tb { display: flex; align-items: center; gap: 22px; padding: 8px 24px; min-height: 62px; }
  .brand { cursor: pointer; font: 800 26px/1.1 var(--font-ui); letter-spacing: -0.02em; text-transform: uppercase; color: var(--fg); white-space: nowrap; }
  .sxtest { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; margin-left: -12px; font: 800 10.5px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-fg); background: var(--accent); white-space: nowrap; flex: none; }
  @media (max-width: 560px) { .sxtest { display: none; } }
  nav.tabs { display: flex; align-items: stretch; gap: 4px; }
  nav.tabs button { position: relative; appearance: none; background: none; border: 0; cursor: pointer; padding: 6px 12px 8px; text-align: left;
    display: flex; flex-direction: column; justify-content: center; }
  nav.tabs .t { font: 700 15.5px/1.3 var(--font-ui); letter-spacing: 0.025em; text-transform: uppercase; color: var(--fg); }
  nav.tabs .s { font: 500 11px/1.3 var(--font-ui); letter-spacing: 0.03em; color: var(--fg2); white-space: nowrap; }
  nav.tabs .s:empty { display: none; }
  nav.tabs button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; background: currentColor; transform: scaleX(0); transition: transform 0.22s; }
  nav.tabs button.on::after { transform: scaleX(1); }
  @media (hover: hover) { nav.tabs button:hover::after { transform: scaleX(1); } }
  nav.tabs button.lock .t { color: var(--fg2); }
  #bar .sp { flex: 1; min-width: 0; }
  .stats { display: flex; align-items: center; gap: 18px; }
  .st { display: flex; flex-direction: column; align-items: flex-end; }
  .st .k { font: 500 12px/1.3 var(--font-ui); letter-spacing: 0.03em; text-transform: uppercase; color: var(--fg2); }
  .st b { font: 800 21px/1.2 var(--font-ui); color: var(--fg); font-variant-numeric: tabular-nums; }

  /* ---------- buttons (planner .btn and .hbtn) ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; appearance: none; cursor: pointer; white-space: nowrap;
    font: 600 12.5px/1 var(--font-ui); letter-spacing: 0.05em; text-transform: uppercase; padding: 0 22px; height: 44px;
    background: var(--accent); color: var(--accent-fg); border: 1px solid var(--accent); border-radius: 0; }
  .btn svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: square; stroke-linejoin: miter; }
  /* press: squeeze in, then spring back out on release */
  .btn { transform: scale(1); transition-property: background, color, box-shadow, border-color, transform, opacity; transition-duration: 0.15s, 0.15s, 0.15s, 0.15s, 0.32s, 0.15s;
    transition-timing-function: ease, ease, ease, ease, cubic-bezier(0.34, 1.9, 0.6, 1), ease; }
  .btn:not(:disabled):active { transform: scale(0.9); transition-duration: 0.15s, 0.15s, 0.15s, 0.15s, 0.08s, 0.15s; transition-timing-function: ease; }
  @media (hover: hover) { .btn:hover { opacity: 0.88; } }
  .chip { display: inline-block; flex: none; font: 600 11px/1.4 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border: 1px solid; white-space: nowrap; }
  .chip.a { color: var(--gold); background: #343013; border-color: var(--gold); }

  /* ---------- layout ---------- */
  #main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 24px 24px 48px; }
  #play { display: grid; grid-template-columns: minmax(0, 430px) minmax(0, 1fr); gap: 16px; align-items: start; }
  #left { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .panel { background: var(--panel); }
  .flag { display: block; flex: none; box-shadow: 0 0 0 1px rgba(255,255,255,0.14); }

  /* country */
  #country { padding: 20px 22px 0; }
  #ctop { display: flex; align-items: center; gap: 10px; min-height: 22px; }
  #ctop .sp2 { flex: 1; }
  #prog { display: flex; gap: 3px; flex: none; }
  #prog i { width: 12px; height: 3px; background: var(--line); }
  #prog i.d { background: var(--fg2); }
  #prog i.c { background: var(--accent); }
  #crow { display: flex; align-items: center; gap: 16px; min-width: 0; margin: 14px 0 18px; }
  #cflag .flag { width: 84px; height: 56px; }
  #cname { font: 800 34px/1.16 var(--font-ui); letter-spacing: -0.015em; color: var(--fg); padding-bottom: 0.06em;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  #mapw { position: relative; height: 150px; margin: 0 -22px; background: #1d1d1b; box-shadow: inset 0 1px 0 var(--line); }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .anim-in { animation: rise 0.3s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  /* reveal */
  #reveal { position: relative; padding: 18px 22px 20px; min-height: 166px; overflow: hidden; }
  #reveal.show { animation: rise 0.28s cubic-bezier(.2,.8,.2,1) both; }
  #rrow { display: flex; align-items: flex-end; gap: 16px; margin-top: 6px; }
  #rnum { font: 800 56px/1.05 var(--font-ui); font-variant-numeric: tabular-nums; color: var(--fg); letter-spacing: -0.02em; }
  #rnum small { font-size: 26px; font-weight: 700; color: var(--fg3); margin-right: 2px; }
  #rnum.pop { animation: pop 0.42s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes pop { 0% { transform: scale(0.75); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); } }
  #rof { padding-bottom: 9px; }
  #rval { font: 700 19px/1.3 var(--font-ui); color: var(--fg); margin-top: 6px; }
  #rbest { font: 400 14px/1.45 var(--font-ui); color: var(--fg2); margin-top: 2px; }
  #rbest b { color: var(--fg); font-weight: 600; }
  #rbest b.ok { color: var(--green); }
  #next { margin-top: 14px; width: 100%; }
  #rbar { position: absolute; left: 0; top: 0; height: 3px; width: 0; background: var(--green); transition: width 0.7s cubic-bezier(.2,.8,.2,1); }
  #reveal.idle > * { visibility: hidden; }
  #reveal.idle::before { content: ""; position: absolute; left: 22px; top: 22px; width: 120px; height: 10px; background: rgba(255,255,255,0.06); }
  #reveal.idle::after { content: ""; position: absolute; left: 22px; top: 48px; width: 180px; height: 52px; background: rgba(255,255,255,0.045); }

  /* stat list */
  #list { min-width: 0; }
  #lhead { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; }
  #lhead .sp2 { flex: 1; }
  #cats { display: flex; flex-direction: column; }
  .cat { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 66px; padding: 10px 18px; text-align: left; cursor: pointer;
    background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; color: var(--fg); position: relative; transition: background 0.12s; }
  .cat .key { flex: none; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font: 600 12.5px/1 var(--font-ui);
    color: var(--fg2); background: var(--box); font-variant-numeric: tabular-nums; }
  .cat .ic { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--fg2); stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; }
  .cat .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .cat .n { font: 700 15.5px/1.3 var(--font-ui); letter-spacing: 0.025em; text-transform: uppercase; color: var(--fg); padding-bottom: 0.05em;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .cat .unit { font: 400 13px/1.35 var(--font-ui); color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat .u { flex: none; display: flex; align-items: center; gap: 10px; max-width: 48%; min-width: 0; }
  .cat .u .flag { width: 33px; height: 22px; }
  .cat .cn { font: 500 14px/1.35 var(--font-ui); color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .cat .rk { flex: none; min-width: 58px; text-align: right; font: 800 24px/1.2 var(--font-ui); font-variant-numeric: tabular-nums; color: var(--fg); }
  .cat .rk small { font-size: 14px; font-weight: 700; color: var(--fg3); margin-right: 1px; }
  .cat.used { cursor: default; }
  .cat.used .n { color: var(--fg2); }
  .cat.lock { cursor: default; }
  .cat.just { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .cat.just .key { background: var(--accent); color: var(--accent-fg); }
  .cat.just .n { color: var(--fg); }
  .cat.just .rk { animation: pop 0.42s cubic-bezier(.2,1.5,.4,1) both; }
  @media (hover: hover) {
    .cat:not(.used):not(.lock):hover { background: var(--panel2); }
    .cat:not(.used):not(.lock):hover .key { background: var(--fg); color: var(--bg); }
  }
  .cat:not(.used):not(.lock):active { background: var(--box2); }

  /* locked mode */
  #locked { display: none; padding: 40px 28px 44px; text-align: center; max-width: 560px; margin: 40px auto 0; }
  #locked.on { display: block; animation: rise 0.3s ease both; }
  #locked h2 { margin: 6px 0 4px; font: 800 30px/1.2 var(--font-ui); letter-spacing: -0.01em; text-transform: uppercase; }
  #locked .left { font: 500 15px/1.5 var(--font-ui); color: var(--fg2); }
  #locked .bst { margin-top: 22px; display: inline-flex; flex-direction: column; align-items: center; padding: 12px 24px; background: var(--box); }
  #locked .bst b { font: 800 30px/1.15 var(--font-ui); }

  /* end */
  #end { display: none; max-width: 860px; margin: 0 auto; }
  #end.on { display: block; animation: rise 0.35s cubic-bezier(.2,.8,.2,1) both; }
  #ehead { padding: 22px 24px 22px; }
  #ehead .ttl { display: flex; align-items: center; gap: 10px; }
  #ehead h2 { margin: 6px 0 18px; font: 800 34px/1.2 var(--font-ui); letter-spacing: -0.015em; text-transform: uppercase; color: var(--fg); }
  #sumrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .sum { min-width: 0; padding: 12px 16px 14px; background: var(--box); }
  .sum .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sum .v { font: 800 42px/1.15 var(--font-ui); margin-top: 4px; font-variant-numeric: tabular-nums; color: var(--fg); }
  .sum.me .v { color: var(--accent); }
  #verdict { margin-top: 14px; font: 400 15px/1.45 var(--font-ui); color: var(--fg2); }
  #etable { margin-top: 12px; padding: 4px 10px 8px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font: 400 14.5px/1.4 var(--font-ui); }
  th { text-align: left; font: 500 12.5px/1.4 var(--font-ui); text-transform: uppercase; letter-spacing: 0.03em; color: var(--fg2); padding: 12px 10px 8px; }
  td { padding: 10px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
  th.rr, td.r { text-align: right; }
  td.c .cw { display: flex; align-items: center; gap: 12px; min-width: 0; }
  td.c .flag { width: 33px; height: 22px; }
  td.c span { font: 600 15.5px/1.4 var(--font-ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  td .rk { font: 800 20px/1.2 var(--font-ui); font-variant-numeric: tabular-nums; }
  td .cn { margin-top: 2px; color: var(--fg2); font: 500 11px/1.35 var(--font-ui); text-transform: uppercase; letter-spacing: 0.05em;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  td.opt .rk { color: var(--fg2); }
  tr.miss td.r.me .rk { color: var(--danger); }
  tr.hit td.r.me .rk { color: var(--green); }
  #endbtns { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 18px; }
  #again { min-width: 240px; }
  #elock { font: 500 14px/1.5 var(--font-ui); color: var(--fg2); text-align: center; }

  @media (max-width: 960px) {
    #play { grid-template-columns: minmax(0, 1fr); }
    #left { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    #country { padding-bottom: 0; }
  }
  @media (max-width: 700px) {
    .tb { flex-wrap: wrap; row-gap: 0; padding: 6px 12px 0; gap: 12px; min-height: 0; }
    .brand { font-size: 22px; padding: 6px 0; }
    nav.tabs { order: 3; width: calc(100% + 24px); margin: 0 -12px; padding: 0 4px; box-shadow: inset 0 1px 0 var(--line); }
    nav.tabs button { flex: 1; padding: 7px 8px 9px; align-items: center; text-align: center; }
    nav.tabs .t { font-size: 14px; }
    nav.tabs .s { font-size: 11px; }
    nav.tabs button::after { left: 8px; right: 8px; }
    .stats { gap: 14px; }
    .st b { font-size: 18px; }
    .st .k { font-size: 11px; }
    #main { padding: 12px 10px 32px; }
    #play, #left { gap: 10px; }
    #left { grid-template-columns: minmax(0, 1fr); }
    #country { padding: 14px 14px 0; }
    #crow { gap: 12px; margin: 10px 0 14px; }
    #cflag .flag { width: 60px; height: 40px; }
    #cname { font-size: 25px; }
    #mapw { height: 92px; margin: 0 -14px; }
    #reveal { padding: 14px 14px 14px; min-height: 0; }
    #reveal.idle { display: none; }
    #rnum { font-size: 44px; }
    #rval { font-size: 17px; }
    #rbest { font-size: 13.5px; }
    #next { height: 44px; }
    #lhead { padding: 12px 12px 8px; }
    .cat { gap: 10px; padding: 9px 12px; min-height: 60px; }
    .cat .ic { display: none; }
    .cat .key { width: 24px; height: 24px; }
    .cat .n { font-size: 14.5px; letter-spacing: 0.02em; }
    .cat .unit { font-size: 12px; }
    .cat .u { max-width: 50%; gap: 8px; }
    .cat .cn { display: none; }
    .cat .rk { font-size: 21px; min-width: 50px; }
    .cat .u .flag { width: 30px; height: 20px; }
    #locked { padding: 28px 16px 32px; margin-top: 12px; }
    #locked h2 { font-size: 24px; }
    #ehead { padding: 16px 14px 16px; }
    #ehead h2 { font-size: 25px; margin-bottom: 14px; }
    #sumrow { gap: 6px; }
    .sum { padding: 10px 10px 12px; }
    .sum .lbl { font-size: 11px; letter-spacing: 0.02em; }
    .sum .v { font-size: 30px; }
    #verdict { font-size: 14px; }
    #etable { padding: 2px 4px 6px; }
    td { padding: 9px 6px; }
    th { padding: 10px 6px 6px; }
    td.c .cw { gap: 8px; }
    td.c .flag { width: 27px; height: 18px; }
    td.c span { font-size: 14.5px; }
    td .rk { font-size: 18px; }
    td .cn { font-size: 11px; letter-spacing: 0.03em; }
  }
  .btn.mus { flex: none; width: 40px; height: 40px; padding: 0; background: var(--box); border-color: var(--box); color: var(--fg); }
  .btn.mus svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div id="gal"><div class="trk" id="galTrk"></div></div>
<div id="bar">
  <div class="tb">
    <div class="brand" id="brand" title="Games">GeoBowl</div><script>if (window.SX_TEST) document.write('<span class="sxtest">Test</span>');</script>
    <nav class="tabs" id="modes">
      <button type="button" data-m="classic"><span class="t">Classic</span><span class="s"></span></button>
      <button type="button" data-m="daily"><span class="t">Daily</span><span class="s"></span></button>
      <button type="button" data-m="weekly"><span class="t">Weekly</span><span class="s"></span></button>
    </nav>
    <div class="sp"></div>
    <div class="stats">
      <div class="st"><span class="k">Pick</span><b id="sPick">1/8</b></div>
      <div class="st"><span class="k">Total</span><b id="sTot">0</b></div>
      <div class="st"><span class="k">Best</span><b id="sBest">0</b></div>
    </div>
    <button type="button" id="bMusic" class="btn mus"></button>
  </div>
</div>
<script>
