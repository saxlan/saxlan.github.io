<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metrica: Platformer</title>
<style>
  :root {
    --bg: #f2f0ea; --out: #e8e5dc; --surface: #fbfaf6; --box: #e6e3da; --box2: #dbd7cc; --fg: #171717; --fg2: #6e6c64; --fg3: #9a978d;
    --edge: #c9c6bc; --line: rgba(110,104,88,.28); --grid: rgba(110,104,88,.11); --grid2: rgba(110,104,88,.2); --hatch: rgba(23,23,23,.07);
    --accent: #2b3fd3; --accent2: #2234b8; --accent-fg: #ffffff; --danger: #a33025; --gold: #8a6a00; --green: #1c6b42; --ice: #cfe0f4;
    --shade: rgba(23,23,23,.18);
    --font: 'Inter', ui-sans-serif, 'Helvetica Neue', Arial, sans-serif; color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #171716; --out: #111110; --surface: #232322; --box: #2a2a27; --box2: #35342f; --fg: #ebeae5; --fg2: #a3a199; --fg3: #6f6d66;
    --edge: #4a4942; --line: rgba(255,255,255,.14); --grid: rgba(255,255,255,.045); --grid2: rgba(255,255,255,.09); --hatch: rgba(255,255,255,.05);
    --accent: #8b97ff; --accent2: #a3acff; --accent-fg: #101010; --danger: #e07a6d; --gold: #d3ab2a; --green: #5cb485; --ice: #2c3e57;
    --shade: rgba(0,0,0,.5); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; }
  input { -webkit-user-select: text; user-select: text; }
  textarea { -webkit-user-select: text; user-select: text; }
  button { font-family: var(--font); }
  *:focus { outline: none; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  svg { display: block; }

  /* top bar */
  .top { flex: none; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 0 24px;
    border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 5; }
  .brand { font: 800 22px/1 var(--font); letter-spacing: -0.02em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .crumb { font: 600 12px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); margin-left: 16px; padding-left: 16px;
    border-left: 1px solid var(--line); height: 20px; display: flex; align-items: center; }
  .tag { margin-left: 14px; padding: 4px 7px 3px; font: 700 10.5px/1 var(--font); letter-spacing: .08em; text-transform: uppercase;
    color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
  .tag[hidden] { display: none; }
  .tl { display: flex; align-items: center; min-width: 0; }
  .tr { display: flex; gap: 4px; }
  .ico { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 0; background: transparent;
    color: var(--fg); cursor: pointer; padding: 0; }
  .ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
  @media (hover: hover) { .ico:hover { background: var(--box); } }
  .ico .off { display: none; }
  .ico.muted .on { display: none; } .ico.muted .off { display: block; }
  :root[data-theme="dark"] .i-moon { display: none; }
  :root:not([data-theme="dark"]) .i-sun { display: none; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 0;
    background: var(--box); color: var(--fg); font: 600 12.5px/1.2 var(--font); letter-spacing: .05em; text-transform: uppercase; cursor: pointer;
    touch-action: manipulation; white-space: nowrap; }
  .btn.acc { background: var(--accent); color: var(--accent-fg); }
  .btn.ghost { background: transparent; color: var(--fg2); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.line { background: transparent; box-shadow: inset 0 0 0 1px var(--fg); }
  .btn.sm { min-height: 34px; padding: 7px 12px; font-size: 11.5px; }
  .btn.wide { width: 100%; justify-content: space-between; min-height: 56px; padding: 0 20px; font-size: 13.5px; font-weight: 700; }
  .btn.wide .k { font-weight: 600; opacity: .55; font-variant-numeric: tabular-nums; }
  .btn[disabled] { opacity: .35; cursor: default; }
  @media (hover: hover) {
    .btn:not([disabled]):hover { background: var(--box2); }
    .btn.acc:not([disabled]):hover { background: var(--accent2); }
    .btn.ghost:not([disabled]):hover, .btn.line:not([disabled]):hover { background: var(--box); color: var(--fg); }
  }
  .btn.danger { color: var(--danger); }

  .lbl { font: 600 11.5px/1.3 var(--font); letter-spacing: .07em; text-transform: uppercase; color: var(--fg2); }
  .h1 { font: 800 clamp(40px, 6.4vw, 76px)/.95 var(--font); letter-spacing: -0.035em; text-transform: uppercase; margin: 0; }
  .h2 { font: 800 15px/1.2 var(--font); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
  .num { font-variant-numeric: tabular-nums; }

  /* screens */
  main { flex: 1; position: relative; min-height: 0; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: block; }
  .scroll { overflow-y: auto; overscroll-behavior: contain; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 48px 32px 64px; }

  /* menu */
  #sMenu .wrap { min-height: 100%; display: flex; align-items: center; }
  #sMenu .hero { width: 100%; }
  .hero { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 48px; align-items: stretch; }
  .hero .side { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { padding: 14px 0 12px; }
  .stat + .stat { padding-left: 16px; border-left: 1px solid var(--line); }
  .stat .v { font: 800 28px/1.1 var(--font); letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 15px; font-weight: 600; color: var(--fg2); letter-spacing: 0; }
  .mlist { display: flex; flex-direction: column; gap: 6px; }
  .preview { position: relative; min-height: 360px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; }
  .preview .cv { flex: 1; position: relative; min-height: 0; }
  .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .preview .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .preview .cap .h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* level grid */
  .sec { margin-top: 48px; }
  .sec:first-child { margin-top: 0; }
  .sech { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--fg); margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { position: relative; display: flex; flex-direction: column; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer;
    text-align: left; border: 0; border-radius: 0; padding: 0; color: var(--fg); font: inherit; min-width: 0; }
  .card .thumb { height: 104px; position: relative; border-bottom: 1px solid var(--line); }
  .card .thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card .row1 { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .card .n { font: 800 22px/1 var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .card .nm { font: 700 12.5px/1.2 var(--font); letter-spacing: .04em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .t { font: 600 12.5px/1 var(--font); font-variant-numeric: tabular-nums; color: var(--fg2); letter-spacing: .02em; }
  .card .t.ok { color: var(--fg); }
  .pips { display: flex; gap: 4px; }
  .pips i { width: 9px; height: 9px; transform: rotate(45deg) scale(.86); box-shadow: inset 0 0 0 1.5px var(--fg3); }
  .pips i.on { background: var(--accent); box-shadow: none; }
  .card.lock { cursor: default; }
  .card.lock .thumb, .card.lock .body { opacity: .38; }
  .card.cur { box-shadow: inset 0 0 0 2px var(--accent); }
  @media (hover: hover) { .card:not(.lock):hover { box-shadow: inset 0 0 0 1px var(--fg); } .card.cur:hover { box-shadow: inset 0 0 0 2px var(--accent); } }
  .card .acts { display: flex; gap: 6px; margin-top: 2px; }
  .card .acts .btn { flex: 1; }
  .card.new { align-items: center; justify-content: center; min-height: 180px; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .card.new .plus { width: 28px; height: 28px; position: relative; }
  .card.new .plus::before, .card.new .plus::after { content: ''; position: absolute; background: var(--fg); }
  .card.new .plus::before { left: 13px; top: 0; width: 2px; height: 28px; }
  .card.new .plus::after { top: 13px; left: 0; height: 2px; width: 28px; }
  .card.new .lbl { margin-top: 12px; color: var(--fg); }

  /* play */
  #sPlay canvas, #sEdit canvas.ed { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 24px; pointer-events: none; }
  .hud .lv { display: flex; align-items: baseline; gap: 12px; }
  .hud .lv .n { font: 800 26px/1 var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .hud .lv .nm { font: 700 13px/1 var(--font); letter-spacing: .05em; text-transform: uppercase; }
  .hud .st { display: flex; gap: 28px; }
  .hud .st div { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .hud .st b { font: 800 20px/1 var(--font); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .hud .tst { color: var(--accent); }

  /* overlays */
  .ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: var(--shade); z-index: 4; }
  .ov.on { display: flex; }
  .panel { width: min(420px, calc(100% - 32px)); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), 0 24px 60px -24px rgba(0,0,0,.35); padding: 28px; }
  .panel .h1 { font-size: 40px; }
  .panel .big { font: 800 64px/1 var(--font); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; margin: 6px 0 0; }
  .panel .rows { margin: 22px 0 24px; border-top: 1px solid var(--line); }
  .panel .rows div { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .panel .rows b { font: 700 15px/1 var(--font); font-variant-numeric: tabular-nums; }
  .panel .rows b.new { color: var(--accent); }
  .panel .acts { display: flex; flex-direction: column; gap: 6px; }
  .panel .acts .r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .panel .head { display: flex; justify-content: space-between; align-items: baseline; }
  .panel textarea { width: 100%; height: 220px; resize: none; border: 0; border-radius: 0; background: var(--bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line);
    font: 500 11.5px/1.45 ui-monospace, 'SF Mono', Menlo, monospace; padding: 12px; margin: 18px 0 14px; white-space: pre; }
  .panel textarea.bad { box-shadow: inset 0 0 0 1px var(--danger); }

  /* touch */
  .touch { position: absolute; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 0 20px 22px; pointer-events: none; }
  .touch .g { display: flex; gap: 10px; pointer-events: auto; }
  .touch button { width: 76px; height: 76px; border: 0; border-radius: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); opacity: .9; touch-action: none; }
  .touch button svg { width: 26px; height: 26px; margin: auto; fill: none; stroke: currentColor; stroke-width: 2; }
  .touch button.dn { background: var(--box2); }
  @media (pointer: coarse) { .touch { display: flex; } }

  /* editor */
  #sEdit { display: none; }
  #sEdit.on { display: grid; grid-template-columns: 172px 1fr; grid-template-rows: auto 1fr; }
  .ebar { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
  .ebar .sp { flex: 1; }
  .field { min-height: 34px; padding: 6px 10px; border: 0; border-radius: 0; background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line);
    font: 600 13px/1.2 var(--font); letter-spacing: .02em; width: 220px; min-width: 80px; }
  .field:focus { box-shadow: inset 0 0 0 1px var(--fg); }
  .dim { display: flex; align-items: center; height: 34px; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); }
  .dim .lbl { padding: 0 8px 0 10px; }
  .dim button { width: 28px; height: 34px; border: 0; background: transparent; color: var(--fg); cursor: pointer; font: 500 16px/1 var(--font); padding: 0; }
  .dim b { min-width: 30px; text-align: center; font: 700 13px/1 var(--font); font-variant-numeric: tabular-nums; }
  @media (hover: hover) { .dim button:hover { background: var(--box); } }
  .vsep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; flex: none; }
  .tools { border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; background: var(--bg); }
  .tool { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border: 0; border-radius: 0; background: transparent; color: var(--fg);
    cursor: pointer; font: 600 11.5px/1 var(--font); letter-spacing: .05em; text-transform: uppercase; text-align: left; }
  .tool canvas { width: 24px; height: 24px; flex: none; }
  .tool .k { margin-left: auto; color: var(--fg3); font-weight: 600; font-variant-numeric: tabular-nums; }
  .tool.on { background: var(--box2); box-shadow: inset 2px 0 0 var(--accent); }
  .tool.on .k { color: var(--fg); }
  @media (hover: hover) { .tool:not(.on):hover { background: var(--box); } }
  .tools .lbl { padding: 14px 8px 6px; }
  .tools .lbl:first-child { padding-top: 4px; }
  .ecv { position: relative; min-width: 0; min-height: 0; }
  .btn.saved { color: var(--green); }
  #toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 12; padding: 10px 16px; background: var(--fg); color: var(--bg);
    font: 600 12.5px/1.2 var(--font); letter-spacing: 0.04em; text-transform: uppercase; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  #ovSkin .panel { width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; }
  #ovSkin .head { margin-bottom: 18px; }
  .unote { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; color: var(--accent); font: 600 12.5px/1.35 var(--font); letter-spacing: .04em; text-transform: uppercase; }
  .unote svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
  .dot { width: 6px; height: 6px; background: var(--accent); display: none; }
  .dirty .dot { display: block; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .preview { min-height: 260px; }
    .wrap { padding: 28px 18px 48px; }
    #sEdit.on { grid-template-columns: 56px 1fr; }
    .tool span, .tool .k, .tools .lbl { display: none; }
    .field { width: 120px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="tl"><div class="brand" id="brand">Metrica: Platformer</div><div class="crumb" id="crumb"></div><span class="tag" id="testTag" hidden>Test</span></div>
  <div class="tr">
    <button class="ico" id="bAudio" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
    <button class="ico" id="bTheme" aria-label="Theme"><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button>
  </div>
</header>
<main>
  <section class="screen scroll" id="sMenu">
    <div class="wrap">
      <div class="hero">
        <div class="side">
          <h1 class="h1">Metrica<br><span style="font-size:.6em;color:var(--accent)">Platformer</span></h1>
          <div class="stats">
            <div class="stat"><div class="lbl">Cleared</div><div class="v" id="stClear">0</div></div>
            <div class="stat"><div class="lbl">Gems</div><div class="v" id="stGems">0</div></div>
            <div class="stat"><div class="lbl">Made</div><div class="v" id="stMade">0</div></div>
          </div>
          <div class="mlist">
            <button class="btn acc wide" id="bPlay"><span id="bPlayT">Play</span><span class="k" id="bPlayK">01</span></button>
            <button class="btn wide" id="bLevels"><span>Levels</span></button>
            <button class="btn wide" id="bEditor"><span>Editor</span></button>
            <button class="btn wide" id="bSkin"><span>Skin</span></button>
          </div>
        </div>
        <div class="preview"><div class="cv"><canvas id="cvPrev"></canvas></div><div class="cap"><div class="h2" id="prevName"></div><div class="lbl num" id="prevBest"></div></div></div>
      </div>
    </div>
  </section>

  <div id="toast"></div>
  <div class="ov" id="ovSkin"><div class="panel">
    <div class="head"><div class="h2">Skin</div><button class="btn sm" id="skDone">Done</button></div>
    <div id="skBody"></div>
  </div></div>
  <section class="screen scroll" id="sLevels">
    <div class="wrap">
      <div class="sec"><div class="sech"><div class="h2">Levels</div><div class="lbl num" id="lvCount"></div></div><div class="grid" id="gridMain"></div></div>
      <div class="sec"><div class="sech"><div class="h2">My Levels</div><div class="lbl num" id="myCount"></div></div><div class="grid" id="gridMine"></div></div>
    </div>
  </section>

  <section class="screen" id="sPlay">
    <canvas id="cvPlay"></canvas>
    <div class="hud">
      <div class="lv"><span class="n" id="hudN">01</span><span class="nm" id="hudName"></span></div>
      <div class="st">
        <div><span class="lbl">Gems</span><b id="hudGems">0/0</b></div>
        <div><span class="lbl">Deaths</span><b id="hudDeaths">0</b></div>
        <div><span class="lbl">Time</span><b id="hudTime">0.00</b></div>
      </div>
    </div>
    <div class="touch" id="touch">
      <div class="g"><button data-k="l" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button data-k="r" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
      <div class="g"><button data-k="j" aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button></div>
    </div>
    <div class="ov" id="ovPause"><div class="panel">
      <div class="head"><div class="h1">Paused</div><div class="lbl num" id="pzTime"></div></div>
      <div class="rows"><div><span class="lbl">Gems</span><b id="pzGems"></b></div><div><span class="lbl">Deaths</span><b id="pzDeaths"></b></div></div>
      <div class="acts"><button class="btn acc wide" id="bResume"><span>Resume</span></button>
        <div class="r2"><button class="btn" id="bRestart">Restart</button><button class="btn" id="bQuit">Levels</button></div></div>
    </div></div>
    <div class="ov" id="ovWin"><div class="panel">
      <div class="lbl" id="wnLbl">Cleared</div>
      <div class="big" id="wnTime">0.00</div>
      <div class="rows">
        <div><span class="lbl">Best</span><b id="wnBest"></b></div>
        <div><span class="lbl">Gems</span><b id="wnGems"></b></div>
        <div><span class="lbl">Deaths</span><b id="wnDeaths"></b></div>
      </div>
      <div class="acts"><button class="btn acc wide" id="bNext"><span id="bNextT">Next</span><span class="k" id="bNextK"></span></button>
        <div class="r2"><button class="btn" id="bRetry">Retry</button><button class="btn" id="bWinQuit">Levels</button></div></div>
    </div></div>
  </section>

  <section class="screen" id="sEdit">
    <div class="ebar">
      <input class="field" id="edName" maxlength="32" spellcheck="false" autocomplete="off">
      <div class="dim"><span class="lbl">W</span><button data-d="w-">&minus;</button><b id="edW">40</b><button data-d="w+">+</button></div>
      <div class="dim"><span class="lbl">H</span><button data-d="h-">&minus;</button><b id="edH">16</b><button data-d="h+">+</button></div>

  /* ================= play ================= */

      else b.g = Math.max(b.g, got);

  function onKey(e) {

      if (k === 'KeyR' && !e.metaKey && !e.ctrlKey) { restart(); return; }

  /* --- camera and view --- */
  function playView(cw, ch) {

    var lw = W.w * tp, lh = W.h * tp, ox, oy;
    ox = lw <= cw ? Math.round((cw - lw) / 2) : Math.round(clamp(cw / 2 - G.cam.x * k, cw - lw, 0));
    oy = lh <= ch ? Math.round((ch - lh) / 2) : Math.round(clamp(ch / 2 - G.cam.y * k, ch - lh, 0));
    return { tp: tp, ox: ox, oy: oy };
  }
  function camTarget() { var p = G.R.p; return { x: p.x + P.w / 2 + p.face * 40 + p.vx * 0.12, y: p.y + P.h / 2 - 24 }; }
  function snapCam() { if (!G.R) return; var t = camTarget(); G.cam.x = t.x; G.cam.y = t.y; }

  /* --- effects --- */
  function burst(x, y, n, col, sp, life, size) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = sp * (0.35 + Math.random() * 0.65);
      G.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - sp * 0.2, life: life * (0.6 + Math.random() * 0.4), max: life, c: col, s: size * (0.6 + Math.random() * 0.6), g: 900 });
    }
  }
  function events() {
    var ev = G.R.ev; if (!ev.length) return;
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.k === 'jump') { sfx('jump'); G.sqv -= 9; dust(e.x, e.y, 5); }
      else if (e.k === 'wall') { sfx('wall'); G.sqv -= 7; dust(e.x, e.y, 4); }
      else if (e.k === 'land') { if (e.s > 0.45) sfx('land'); G.sqv += 6 + 10 * e.s; dust(e.x, e.y, 3 + Math.round(e.s * 5)); }
      else if (e.k === 'spring') { sfx('spring'); G.springs[e.ty * G.W.w + e.tx] = 1; G.sqv -= 12; }
      else if (e.k === 'gem') { sfx('gem'); burst(e.x, e.y, 10, 'accent', 220, 0.45, 4); }
      else if (e.k === 'check') { sfx('check'); burst(e.x, e.y, 8, 'accent', 160, 0.4, 3); }
      else if (e.k === 'die') { sfx('die'); burst(e.x, e.y, 18, 'danger', 320, 0.6, 5); G.shake = 1; }
      else if (e.k === 'spawn') { G.sq = 0; G.sqv = 0; }
      else if (e.k === 'win') { sfx('win'); burst(e.x, e.y - 16, 22, 'accent', 300, 0.7, 4); win(); }
    }
    G.R.ev.length = 0;
  }
  function dust(x, y, n) {
    for (var i = 0; i < n; i++) G.parts.push({ x: x + (Math.random() - 0.5) * 16, y: y - 2, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 60, life: 0.3, max: 0.3, c: 'fg3', s: 3, g: 200 });
  }
  function updateFx(dt) {
    for (var i = G.parts.length - 1; i >= 0; i--) {

      if (q.life <= 0) { G.parts.splice(i, 1); continue; }

  }
  var clock = 0;
  function renderPlay() {
    var cv = $('cvPlay'); if (!fit(cv) || !G.R) return;
    var c = cv.getContext('2d'), cw = cv.width, ch = cv.height, v = playView(cw, ch), d = dpr();
    if (G.shake > 0) { v.ox += Math.round((Math.random() - 0.5) * 6 * d * G.shake); v.oy += Math.round((Math.random() - 0.5) * 6 * d * G.shake); }
    G.view = v;

    }

  }

  /* ================= editor ================= */
  var TOOLS = [
    { c: '#', n: 'Block' }, { c: '^', n: 'Spike' }, { c: '-', n: 'Ledge' }, { c: 'o', n: 'Spring' },
    { c: 'I', n: 'Ice' }, { c: 'K', n: 'Crumble' }, { c: 'L', n: 'Lava' },
    { c: '*', n: 'Gem' }, { c: 'C', n: 'Checkpoint' }, { c: 'S', n: 'Start' }, { c: 'G', n: 'Goal' }, { c: '.', n: 'Erase' }
  ];
  var iconsDirty = true;
  var Ed = (function () {
    var E = { id: null, lv: null, rows: null, W: null, tool: '#', cam: { x: 0, y: 0 }, css: 30, undo: [], redo: [], dirty: false, hover: null, drag: null, space: false, savedFlash: 0 };
    var cv = $('cvEdit');

    function toolsUI() {
      var t = $('tools'), h = '<div class="lbl">Tiles</div>';
      TOOLS.forEach(function (o, i) {
        if (i === 9) h += '<div class="lbl">Markers</div>';
        if (i === 11) h += '<div class="lbl">Clear</div>';
        h += '<button class="tool" data-c="' + o.c + '" title="' + o.n + '"><canvas width="24" height="24"></canvas><span>' + o.n + '</span><span class="k">' + (i < 9 ? i + 1 : '') + '</span></button>';
      });
      t.innerHTML = h;
      Array.prototype.forEach.call(t.querySelectorAll('.tool'), function (b) { b.addEventListener('click', function () { setTool(b.getAttribute('data-c')); }); });
      paintTools();
    }
    function setTool(c) { E.tool = c; paintTools(); }
    function paintTools() {
      Array.prototype.forEach.call($('tools').querySelectorAll('.tool'), function (b) { b.classList.toggle('on', b.getAttribute('data-c') === E.tool); });
    }
    function drawIcons() {
      if (!iconsDirty) return;
      var any = false;
      Array.prototype.forEach.call($('tools').querySelectorAll('.tool canvas'), function (icv) {
        var r = icv.getBoundingClientRect(); if (r.width < 1) return; any = true;
        var d = dpr(), sz = Math.round(24 * d); if (icv.width !== sz) { icv.width = sz; icv.height = sz; }
        var c = icv.getContext('2d'), ch0 = icv.parentNode.getAttribute('data-c');
        c.clearRect(0, 0, sz, sz);
        var tp = sz;
        if (ch0 === '#') {
          var lw = Math.max(1, Math.round(d)), lt = Math.max(2, Math.round(2 * d));
          c.fillStyle = PAL.surface; c.fillRect(0, 0, tp, tp);
          c.fillStyle = PAL.fg; c.fillRect(0, 0, tp, lt); c.fillRect(0, tp - lw, tp, lw); c.fillRect(0, 0, lw, tp); c.fillRect(tp - lw, 0, lw, tp);
        } else if (ch0 === '^') { c.fillStyle = PAL.danger; drawSpike(c, 0, 0, tp, 0); }
        else if (ch0 === '-') drawLedge(c, 0, Math.round(tp * 0.35), tp);
        else if (ch0 === 'o') drawSpring(c, 0, 0, tp, 0);
        else if (ch0 === 'I') drawIce(c, 0, 0, tp);
        else if (ch0 === 'K') drawCrumble(c, 0, 0, tp, 0);
        else if (ch0 === 'L') drawLava(c, 0, 0, tp);
        else if (ch0 === '*') drawGem(c, Math.round(tp / 2), Math.round(tp / 2), tp * 1.5);
        else if (ch0 === 'C') drawCheck(c, Math.round(tp * 0.15), Math.round(tp * 0.38), Math.round(tp * 0.62), true);
        else if (ch0 === 'S') drawStart(c, 0, 0, tp);
        else if (ch0 === 'G') drawGoal(c, Math.round(tp * 0.12), Math.round(tp * 0.45), Math.round(tp * 0.55), 0);
        else if (ch0 === '.') {
          var l = Math.max(1, Math.round(1.5 * d)); c.strokeStyle = 'currentColor';
          c.fillStyle = getComputedStyle(icv.parentNode).color;
          var m = Math.round(tp * 0.22), e = tp - m;
          c.save(); c.translate(tp / 2, tp / 2); c.rotate(Math.PI / 4); c.fillRect(-tp * 0.36, -l / 2, tp * 0.72, l); c.fillRect(-l / 2, -tp * 0.36, l, tp * 0.72); c.restore();
        }
      });
      if (any) iconsDirty = false;
    }

    function load(lv) {
      E.lv = Core.normalize(lv); E.rows = E.lv.rows.map(function (r) { return r.split(''); }); rebuild();
      $('edName').value = E.lv.name; dims(); E.undo = []; E.redo = []; setDirty(false); center();
    }
    function snapshot() { return { w: E.lv.w, h: E.lv.h, rows: E.rows.map(function (r) { return r.join(''); }) }; }
    function restore(s) { E.lv.w = s.w; E.lv.h = s.h; E.rows = s.rows.map(function (r) { return r.split(''); }); rebuild(); dims(); }
    function pushUndo() { E.undo.push(snapshot()); if (E.undo.length > 120) E.undo.shift(); E.redo = []; }
    function rebuild() { E.lv.rows = E.rows.map(function (r) { return r.join(''); }); E.W = Core.build(E.lv); }
    function current() { rebuild(); var o = Core.normalize({ name: $('edName').value, w: E.lv.w, h: E.lv.h, rows: E.lv.rows }); return o; }
    function dims() { $('edW').textContent = E.lv.w; $('edH').textContent = E.lv.h; }
    function setDirty(v) { E.dirty = v; $('edSave').classList.toggle('dirty', v); if (v) { $('edSaveT').textContent = 'Save'; $('edSave').classList.remove('saved'); } }

    function open(id) {
      E.id = id;
      var it = id ? SV.mine.filter(function (m) { return m.id === id; })[0] : null;
      load(it ? it.level : Core.blank(40, 16));
      if (!it) setDirty(false);
      show('edit'); iconsDirty = true; center(); draw();
    }
    function save() {
      var lv = current(), ok;
      if (E.id) { var it = SV.mine.filter(function (m) { return m.id === E.id; })[0]; if (it) it.level = lv; else SV.mine.push({ id: E.id, level: lv }); }
      else { E.id = uid(); SV.mine.push({ id: E.id, level: lv }); }
      ok = saveNow();
      if (!ok) { $('edSaveT').textContent = 'Full'; return false; }
      setDirty(false); $('edSaveT').textContent = 'Saved'; $('edSave').classList.add('saved');
      clearTimeout(E.savedFlash); E.savedFlash = setTimeout(function () { if (!E.dirty) { $('edSaveT').textContent = 'Save'; $('edSave').classList.remove('saved'); } }, 1400);
      return true;
    }
    function leave(fn) {
      if (!E.dirty) { fn(); return; }
      E.after = fn; $('ovLeave').classList.add('on');
    }

    /* view */
    function view() {
      var d = dpr(), tp = Math.max(4, Math.round(E.css * d));
      return { tp: tp, ox: Math.round(cv.width / 2 - E.cam.x * tp / T), oy: Math.round(cv.height / 2 - E.cam.y * tp / T) };
    }
    function center() {
      var r = cv.getBoundingClientRect();
      if (r.width > 0 && r.height > 0) E.css = clamp(Math.floor(Math.min((r.width - 80) / E.lv.w, (r.height - 80) / E.lv.h)), 14, 40);
      E.cam.x = E.lv.w * T / 2; E.cam.y = E.lv.h * T / 2;
      if (r.width > 0 && E.lv.w * E.css > r.width - 80) E.cam.x = (r.width / 2 - 40) / E.css * T;
    }
    function cellAt(e) {
      var r = cv.getBoundingClientRect(), d = dpr(), v = view();
      var x = (e.clientX - r.left) * d, y = (e.clientY - r.top) * d;
      return { x: Math.floor((x - v.ox) / v.tp), y: Math.floor((y - v.oy) / v.tp) };
    }
    function inb(x, y) { return x >= 0 && y >= 0 && x < E.lv.w && y < E.lv.h; }
    function paint(x, y, c) {
      if (!inb(x, y)) return false;
      if (E.rows[y][x] === c) return false;
      if (c === 'S' || c === 'G') for (var j = 0; j < E.lv.h; j++) for (var i = 0; i < E.lv.w; i++) if (E.rows[j][i] === c) E.rows[j][i] = '.';
      E.rows[y][x] = c; return true;
    }
    function line(a, b, c) {
      var dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y), sx = a.x < b.x ? 1 : -1, sy = a.y < b.y ? 1 : -1, err = dx - dy, x = a.x, y = a.y, ch = false;
      for (var guard = 0; guard < 2000; guard++) {
        if (paint(x, y, c)) ch = true;
        if (x === b.x && y === b.y) break;
        var e2 = 2 * err; if (e2 > -dy) { err -= dy; x += sx; } if (e2 < dx) { err += dx; y += sy; }
      }
      return ch;
    }

    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    cv.addEventListener('pointerdown', function (e) {
      if (!E.lv) return;
      try { cv.setPointerCapture(e.pointerId); } catch (er) {}
      if (e.button === 1 || E.space || (e.button === 0 && e.altKey)) { E.drag = { pan: true, x: e.clientX, y: e.clientY, cx: E.cam.x, cy: E.cam.y }; e.preventDefault(); return; }
      var c = e.button === 2 ? '.' : E.tool, at = cellAt(e);
      var before = snapshot();
      E.drag = { pan: false, c: c, last: at, before: before, changed: false };
      if (paint(at.x, at.y, c)) { E.drag.changed = true; rebuild(); }
      if (c === 'S' || c === 'G') E.drag.single = true;
      draw();
    });
    cv.addEventListener('pointermove', function (e) {
      if (!E.lv) return;
      var at = cellAt(e);
      if (!E.hover || E.hover.x !== at.x || E.hover.y !== at.y) { E.hover = at; draw(); }
      if (!E.drag) return;
      if (E.drag.pan) {
        var k = T / E.css; E.cam.x = E.drag.cx - (e.clientX - E.drag.x) * k; E.cam.y = E.drag.cy - (e.clientY - E.drag.y) * k; clampCam(); draw(); return;
      }
      if (E.drag.single) { if (paint(at.x, at.y, E.drag.c)) { E.drag.changed = true; rebuild(); draw(); } return; }
      if (line(E.drag.last, at, E.drag.c)) { E.drag.changed = true; rebuild(); draw(); }
      E.drag.last = at;
    });
    function endDrag() {
      if (E.drag && !E.drag.pan && E.drag.changed) { E.undo.push(E.drag.before); if (E.undo.length > 120) E.undo.shift(); E.redo = []; setDirty(true); }
      E.drag = null;
    }
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    cv.addEventListener('pointerleave', function () { if (!E.drag) { E.hover = null; draw(); } });
    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        var r = cv.getBoundingClientRect(), mx = e.clientX - r.left - r.width / 2, my = e.clientY - r.top - r.height / 2;
        var wx = E.cam.x + mx * T / E.css, wy = E.cam.y + my * T / E.css;
        E.css = clamp(E.css * Math.exp(-e.deltaY * 0.004), 8, 72);
        E.cam.x = wx - mx * T / E.css; E.cam.y = wy - my * T / E.css;
      } else {
        var s = e.deltaMode === 1 ? 16 : 1;
        E.cam.x += (e.shiftKey ? e.deltaY : e.deltaX) * s * T / E.css; if (!e.shiftKey) E.cam.y += e.deltaY * s * T / E.css;
      }
      clampCam(); draw();
    }, { passive: false });
    function clampCam() { E.cam.x = clamp(E.cam.x, -4 * T, (E.lv.w + 4) * T); E.cam.y = clamp(E.cam.y, -4 * T, (E.lv.h + 4) * T); }

    function resizeLevel(dw, dh) {
      var w = clamp(E.lv.w + dw, Core.LIMITS.minW, Core.LIMITS.maxW), h = clamp(E.lv.h + dh, Core.LIMITS.minH, Core.LIMITS.maxH);
      if (w === E.lv.w && h === E.lv.h) return;
      pushUndo();
      var rows = [], y, x;
      /* keep the bottom edge fixed: rows are added or removed at the top */
      for (y = 0; y < h; y++) {
        var sy = y - (h - E.lv.h), r = [];
        for (x = 0; x < w; x++) r.push(sy >= 0 && sy < E.lv.h && x < E.lv.w ? E.rows[sy][x] : '.');
        rows.push(r);
      }
      E.cam.y += (h - E.lv.h) * T;
      E.lv.w = w; E.lv.h = h; E.rows = rows; rebuild(); dims(); setDirty(true); draw();
    }
    Array.prototype.forEach.call(document.querySelectorAll('.dim button'), function (b) {
      b.addEventListener('click', function () {
        var d = b.getAttribute('data-d'), n = d.charAt(1) === '+' ? 1 : -1;
        if (d.charAt(0) === 'w') resizeLevel(n, 0); else resizeLevel(0, n);
      });
    });
    function doUndo() { if (!E.undo.length) return; E.redo.push(snapshot()); restore(E.undo.pop()); setDirty(true); draw(); }
    function doRedo() { if (!E.redo.length) return; E.undo.push(snapshot()); restore(E.redo.pop()); setDirty(true); draw(); }
    $('edUndo').addEventListener('click', doUndo);
    $('edRedo').addEventListener('click', doRedo);
    $('edName').addEventListener('input', function () { setDirty(true); });
    $('edName').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); $('edName').blur(); } });
    $('edSave').addEventListener('click', save);
    $('edExit').addEventListener('click', function () { leave(function () { show('levels'); }); });
    $('edTest').addEventListener('click', test);
    function test() {
      var lv = current();
      if (!Core.build(lv).ok) { flashMissing(); return; }
      playLevel(lv, E.id ? 'u' + E.id : 'utest', { test: true });
    }
    function flashMissing() {
      var b = $('edTest'), t = b.textContent; b.textContent = !E.W.start ? 'No start' : 'No goal'; b.classList.remove('acc'); b.classList.add('danger');
      setTimeout(function () { b.textContent = t; b.classList.add('acc'); b.classList.remove('danger'); }, 1200);
    }
    /* JSON */
    $('edJson').addEventListener('click', function () {
      var s = JSON.stringify(current());
      $('jsText').value = s.replace('"rows":[', '"rows":[\n  ').replace(/","/g, '",\n  "').replace(/"\]\}$/, '"\n]}');
      $('jsText').classList.remove('bad'); $('jsSize').textContent = s.length + ' chars';
      $('ovJson').classList.add('on');
      setTimeout(function () { $('jsText').focus(); $('jsText').select(); }, 0);
    });
    $('jsCancel').addEventListener('click', function () { $('ovJson').classList.remove('on'); });
    $('jsApply').addEventListener('click', function () {
      var lv = Core.deserialize($('jsText').value);
      if (!lv) { $('jsText').classList.add('bad'); return; }
      pushUndo(); E.lv = lv; E.rows = lv.rows.map(function (r) { return r.split(''); }); rebuild(); $('edName').value = lv.name; dims(); setDirty(true);
      $('ovJson').classList.remove('on'); center(); draw();
    });
    $('jsText').addEventListener('input', function () { $('jsText').classList.remove('bad'); $('jsSize').textContent = $('jsText').value.length + ' chars'; });
    $('lvSave').addEventListener('click', function () { if (save()) { $('ovLeave').classList.remove('on'); var f = E.after; E.after = null; if (f) f(); } });
    $('lvDiscard').addEventListener('click', function () { $('ovLeave').classList.remove('on'); setDirty(false); var f = E.after; E.after = null; if (f) f(); });
    $('lvCancel').addEventListener('click', function () { $('ovLeave').classList.remove('on'); E.after = null; });

    function key(e) {
      if ($('ovJson').classList.contains('on') || $('ovLeave').classList.contains('on')) {
        if (e.code === 'Escape') { $('ovJson').classList.remove('on'); $('ovLeave').classList.remove('on'); }
        return;
      }
      var k = e.code, mod = e.metaKey || e.ctrlKey;
      if (mod && k === 'KeyZ') { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); return; }
      if (mod && k === 'KeyY') { e.preventDefault(); doRedo(); return; }
      if (mod && k === 'KeyS') { e.preventDefault(); save(); return; }
      if (mod) return;
      var dg = /^Digit([1-9])$/.exec(k);
      if (dg) { setTool(TOOLS[+dg[1] - 1].c); return; }
      if (k === 'KeyE') { setTool('.'); return; }
      if (k === 'KeyT' || k === 'Enter') { test(); return; }
      if (k === 'Space') { E.space = true; e.preventDefault(); return; }
      var pan = 4 * T;
      if (k === 'ArrowLeft') { E.cam.x -= pan; } else if (k === 'ArrowRight') { E.cam.x += pan; } else if (k === 'ArrowUp') { E.cam.y -= pan; } else if (k === 'ArrowDown') { E.cam.y += pan; } else return;
      e.preventDefault(); clampCam(); draw();
    }
    window.addEventListener('keyup', function (e) { if (e.code === 'Space') E.space = false; });

    function draw() {
      if (cur !== 'edit' || !E.W) return;
      if (!fit(cv)) return;
      drawIcons();
      var c = cv.getContext('2d'), v = view(), cw = cv.width, ch = cv.height;
      drawWorld(c, E.W, v, cw, ch, { editor: true, still: true }, null, 0);
      if (E.hover && inb(E.hover.x, E.hover.y) && !(E.drag && E.drag.pan)) {
        var lw = Math.max(1, Math.round(1.5 * dpr())), X = v.ox + E.hover.x * v.tp, Y = v.oy + E.hover.y * v.tp, tp = v.tp;
        c.fillStyle = PAL.accent; c.globalAlpha = 0.12; c.fillRect(X, Y, tp, tp); c.globalAlpha = 1;
        c.fillRect(X, Y, tp, lw); c.fillRect(X, Y + tp - lw, tp, lw); c.fillRect(X, Y, lw, tp); c.fillRect(X + tp - lw, Y, lw, tp);
      }
      cv.style.cursor = E.space || (E.drag && E.drag.pan) ? 'grab' : 'crosshair';
    }
    function resize() { draw(); }
    toolsUI();
    return { open: open, draw: draw, resize: resize, key: key, leave: leave, center: center };
  })();

  /* ================= loop ================= */
  var last = 0, running = false;
  function frame(ts) {
    running = false;
    var dt = last ? Math.min(0.1, (ts - last) / 1000) : 1 / 60; last = ts;
    clock += dt;
    if (cur === 'play') { updatePlay(dt); renderPlay(); }
    if (cur === 'play') kick();
    else last = 0;
  }
  function kick() { if (running) return; running = true; try { requestAnimationFrame(frame); } catch (e) { running = false; } }

  function redrawStatic() {
    if (!PAL.bg) return;
    if (cur === 'menu') drawPreview();
    else if (cur === 'levels') buildLevels();
    else if (cur === 'edit') Ed.draw();
    else if (cur === 'play') renderPlay();
  }
  var rzT = 0;
  function onResize() { clearTimeout(rzT); if (cur === 'play') renderPlay(); else if (cur === 'edit') Ed.draw(); rzT = setTimeout(function () { iconsDirty = true; if (cur !== 'play') redrawStatic(); }, 60); }
  window.addEventListener('resize', onResize);
  try { if (window.ResizeObserver) new ResizeObserver(onResize).observe(document.querySelector('main')); } catch (e) {}
  (function watchDpr() {
    try {
      var mq = matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
      var h = function () { iconsDirty = true; onResize(); watchDpr(); };
      if (mq.addEventListener) mq.addEventListener('change', h, { once: true }); else if (mq.addListener) mq.addListener(function f() { mq.removeListener(f); h(); });
    } catch (e) {}
  })();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (!SV.theme) setTheme(plannerTheme()); }); } catch (e) {}
  document.addEventListener('visibilitychange', function () { if (document.hidden && cur === 'play' && G.R && !G.R.done) pause(true); });

  if (TEST) {
    $('testTag').hidden = false;
    /* read-only probe for automated play tests */
    window.LM_TEST = { state: function () { var R = G.R; return { screen: cur, level: G.idx, frames: R ? R.frames : 0, done: R ? R.done : false, deaths: R ? R.deaths : 0, x: R ? R.p.x : 0, y: R ? R.p.y : 0, ground: R ? R.p.ground : false }; } };
  }
  show('menu');
  loadSave();
})();
</script>
</body>
