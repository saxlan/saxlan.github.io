<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>metrica: platformer</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* rounded look: Fredoka headings, Nunito text, flat fills, 2px lines with a 4px bottom edge, chunky buttons that press down */
  :root {
    --display: 'Fredoka', 'Nunito', system-ui, sans-serif;
    --sans: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font: var(--sans);
    --bg: #ffffff; --soft: #f7f7f7; --line: #e5e5e5; --line-hi: #d0d0d0;
    --text: #4b4b4b; --dim: #777777; --faint: #afafaf;
    --green: #58cc02; --green-dark: #58a700; --green-wash: #d7ffb8;
    --blue: #4b9af3; --blue-dark: #3c81db; --blue-wash: #e6f1ff; --blue-line: #a4ceff;
    --pri: #4b9af3; --pri-dark: #3c81db; --pri-hi: #5ea6f6; --pri-light: #a4ceff; --pri-wash: #e6f1ff; --pri-text: #3c81db;
    --red: #ff4b4b; --red-dark: #ea2b2b; --gold: #ffc800; --gold-dark: #e5a400; --purple: #ce82ff;
    --scrim: rgba(255, 255, 255, 0.92);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #131f24; --soft: #202f36; --line: #37464f; --line-hi: #52656d;
    --text: #f1f7fb; --dim: #8799a3; --faint: #52656d;
    --green-wash: #1f3a1a; --blue-wash: #1c3150; --blue-line: #3c81db;
    --pri-wash: #1c3150; --pri-light: #78b0fc; --pri-text: #78b0fc;
    --scrim: rgba(19, 31, 36, 0.92);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 700 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  button { font-family: var(--sans); }
  *:focus, *:focus-visible { outline: none; }
  svg { display: block; }

  /* top bar */
  .top { flex: none; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px 0 20px;
    border-bottom: 2px solid var(--line); background: var(--bg); position: relative; z-index: 5; }
  .brand { font: 700 26px/1 var(--display); letter-spacing: -0.02em; cursor: pointer; white-space: nowrap; color: var(--pri-text); }
  .crumb { font: 700 16px/1 var(--display); letter-spacing: 0; color: var(--dim); margin-left: 16px; padding-left: 16px;
    border-left: 2px solid var(--line); height: 22px; display: flex; align-items: center; white-space: nowrap; }
  .tag { margin-left: 14px; padding: 6px 8px; font: 800 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--red); border-radius: 8px; }
  .tag[hidden] { display: none; }
  .tl { display: flex; align-items: center; min-width: 0; }
  .tr { display: flex; gap: 4px; }
  .ico { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent;
    color: var(--dim); cursor: pointer; padding: 0; }
  .ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  @media (hover: hover) { .ico:hover { background: var(--soft); } }
  .ico .off { display: none; }
  .ico.muted .on { display: none; } .ico.muted .off { display: block; }
  :root[data-theme="dark"] .i-moon { display: none; }
  :root:not([data-theme="dark"]) .i-sun { display: none; }

  /* buttons: secondary is white with a grey edge; .acc is the blue primary */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 18px; cursor: pointer;
    border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; background: var(--bg); color: var(--pri-text);
    font: 800 14px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; touch-action: manipulation; white-space: nowrap; }
  .btn:not([disabled]):active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  .btn.acc { background: var(--pri); border-color: var(--pri-dark); color: #fff; }
  .btn.ghost, .btn.line { color: var(--dim); }
  .btn.sm { min-height: 38px; padding: 0 12px; font-size: 12.5px; border-radius: 10px; border-bottom-width: 3px; }
  .btn.sm:not([disabled]):active { border-bottom-width: 2px; margin-bottom: 1px; transform: translateY(1px); }
  .btn.wide { width: 100%; justify-content: space-between; min-height: 58px; padding: 0 20px; font-size: 15px; }
  .btn.wide .k { opacity: .7; font-variant-numeric: tabular-nums; }
  .btn[disabled] { opacity: .45; cursor: default; }
  @media (hover: hover) {
    .btn:not([disabled]):hover { background: var(--soft); }
    .btn.acc:not([disabled]):hover { background: var(--pri-hi); }
  }
  .btn.danger { color: var(--red); }

  .lbl { font: 800 12px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .h1 { font: 700 clamp(44px, 6.4vw, 80px)/.95 var(--display); letter-spacing: -0.03em; margin: 0; color: var(--pri-text); }
  .h2 { font: 700 20px/1.2 var(--display); letter-spacing: -0.01em; margin: 0; color: var(--text); }
  .num { font-variant-numeric: tabular-nums; }

  /* screens */
  main { flex: 1; position: relative; min-height: 0; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: block; }
  .scroll { overflow-y: auto; overscroll-behavior: contain; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 44px 28px 64px; }

  /* menu */
  #sMenu .wrap { min-height: 100%; display: flex; align-items: center; }
  #sMenu .hero { width: 100%; }
  .hero { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 44px; align-items: stretch; }
  .hero .side { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  .hero .h1 span { display: block; font-size: .5em; color: var(--dim); margin-top: 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; min-width: 0; }
  .stat .v { font: 700 28px/1.1 var(--display); margin-top: 4px; font-variant-numeric: tabular-nums; color: var(--text); }
  .stat .v small { font-size: 15px; font-weight: 600; color: var(--dim); letter-spacing: 0; }
  .mlist { display: flex; flex-direction: column; gap: 10px; }
  .preview { position: relative; min-height: 360px; background: var(--bg); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .preview .cv { flex: 1; position: relative; min-height: 0; }
  .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .preview .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; border-top: 2px solid var(--line); }
  .preview .cap .h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* level grid */
  .sec { margin-top: 44px; }
  .sec:first-child { margin-top: 0; }
  .sech { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 12px; margin-bottom: 16px; }
  .sech .h2 { font-size: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { position: relative; display: flex; flex-direction: column; background: var(--bg); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; overflow: hidden; cursor: pointer;
    text-align: left; padding: 0; color: var(--text); font: inherit; min-width: 0; }
  button.card:not([disabled]):active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  .card .thumb { height: 108px; position: relative; border-bottom: 2px solid var(--line); }
  .card .thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card .row1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .card .n { width: 30px; height: 30px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--pri); color: #fff;
    font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; box-shadow: inset 0 -3px 0 var(--pri-dark); box-sizing: border-box; padding: 0 0 4px; }
  .card .nm { font: 700 16px/1.2 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .t { font: 800 13px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--dim); }
  .card .t.ok { color: var(--text); }
  .pips { display: flex; gap: 4px; }
  .pips i { width: 10px; height: 10px; border-radius: 3px; transform: rotate(45deg) scale(.85); background: var(--line); }
  .pips i.on { background: var(--blue); }
  .card.lock { cursor: default; }
  .card.lock .thumb, .card.lock .body { opacity: .55; }
  .card.lock .n { background: var(--line); box-shadow: inset 0 -3px 0 var(--line-hi); color: var(--faint); }
  .card.cur { border-color: var(--pri-light); background: var(--pri-wash); }
  @media (hover: hover) { .card:not(.lock):not(.cur):hover { background: var(--soft); } }
  .card .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .card .acts .btn { flex: 1 1 auto; padding: 0 8px; }
  .card.new { align-items: center; justify-content: center; min-height: 180px; border-style: dashed; border-bottom-width: 2px; }
  .card.new .plus { width: 44px; height: 44px; position: relative; border-radius: 50%; background: var(--pri); box-shadow: inset 0 -4px 0 var(--pri-dark); }
  .card.new .plus::before, .card.new .plus::after { content: ''; position: absolute; background: #fff; border-radius: 2px; }
  .card.new .plus::before { left: 20px; top: 10px; width: 4px; height: 20px; }
  .card.new .plus::after { top: 18px; left: 12px; height: 4px; width: 20px; }
  .card.new .lbl { margin-top: 12px; color: var(--text); }

  /* play */
  #sPlay canvas, #sEdit canvas.ed { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 18px; pointer-events: none; }
  .hud .lv, .hud .st div { background: var(--bg); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; }
  .hud .lv { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; }
  .hud .lv .n { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--pri); color: #fff;
    font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; box-shadow: inset 0 -3px 0 var(--pri-dark); box-sizing: border-box; padding: 0 0 4px; }
  .hud .lv .nm { font: 700 17px/1 var(--display); color: var(--text); }
  .hud .hl { display: flex; gap: 8px; align-items: flex-start; }
  .hpz { pointer-events: auto; width: 54px; height: 54px; display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; color: var(--text);
    background: var(--bg); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; touch-action: manipulation; }
  .hpz svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; }
  .hpz:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  @media (hover: hover) { .hpz:hover { background: var(--soft); } }
  .hud .st { display: flex; gap: 8px; }
  .hud .st div { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding: 8px 12px; min-width: 70px; }
  .hud .st b { font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--text); }
  .hud .tst { color: var(--red); }

  /* overlays */
  .ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: var(--scrim); z-index: 4; }
  .ov.on { display: flex; }
  .panel { width: min(420px, calc(100% - 32px)); background: var(--bg); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 20px; padding: 26px; }
  .panel .h1 { font-size: 40px; color: var(--text); }
  .panel .big { font: 700 64px/1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 6px 0 0; color: var(--text); }
  .panel .rows { margin: 20px 0 22px; display: flex; flex-direction: column; gap: 8px; }
  .panel .rows div { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; }
  .panel .rows b { font: 700 17px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--text); }
  .panel .rows b.new { color: var(--pri-text); }
  .panel .acts { display: flex; flex-direction: column; gap: 10px; }
  .panel .codebig { font: 700 48px/1 var(--display); letter-spacing: 0.06em; margin: 8px 0 6px; color: var(--text); }
  .panel .codein { width: 100%; height: 56px; margin: 14px 0 6px; padding: 0 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text);
    font: 800 26px/1 var(--sans); letter-spacing: 0.18em; text-align: center; text-transform: uppercase; outline: none; }
  .panel .codein:focus { border-color: var(--pri); }
  .panel .codeerr { min-height: 20px; margin-bottom: 12px; text-align: center; color: var(--red); font: 700 13px/1.4 var(--sans); }
  .panel .codenote { margin: 4px 0 18px; color: var(--dim); font: 600 14px/1.4 var(--sans); }
  .panel .acts .r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel .acts .r2.one { grid-template-columns: 1fr; }
  .panel .head { display: flex; justify-content: space-between; align-items: center; }
  .panel textarea { width: 100%; height: 220px; resize: none; border: 2px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--text);
    font: 600 12px/1.45 ui-monospace, 'SF Mono', Menlo, monospace; padding: 12px; margin: 18px 0 14px; white-space: pre; }
  .panel textarea.bad { border-color: var(--red); }

  /* touch */
  .touch { position: absolute; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 0 18px 20px; pointer-events: none; }
  .touch .g { display: flex; gap: 10px; pointer-events: auto; }
  .touch button { width: 76px; height: 76px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 18px; background: var(--bg); color: var(--text); touch-action: none; }
  .touch button svg { width: 28px; height: 28px; margin: auto; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .touch button.dn { background: var(--soft); transform: translateY(2px); border-bottom-width: 2px; }
  @media (pointer: coarse) { .touch { display: flex; } }

  /* editor */
  #sEdit { display: none; }
  #sEdit.on { display: grid; grid-template-columns: 184px 1fr; grid-template-rows: auto 1fr; }
  .ebar { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 2px solid var(--line); background: var(--bg); min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .ebar::-webkit-scrollbar { display: none; }
  .ebar .sp { flex: 1; }
  .field { min-height: 40px; padding: 0 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--text);
    font: 700 15px/1.2 var(--sans); width: 220px; min-width: 80px; }
  .field:focus { border-color: var(--blue); background: var(--bg); }
  .dim { display: flex; align-items: center; height: 40px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); flex: none; overflow: hidden; }
  .dim .lbl { padding: 0 6px 0 10px; }
  .dim button { width: 30px; height: 36px; border: 0; background: transparent; color: var(--pri-text); cursor: pointer; font: 800 18px/1 var(--sans); padding: 0; }
  .dim b { min-width: 30px; text-align: center; font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; }
  @media (hover: hover) { .dim button:hover { background: var(--soft); } }
  .vsep { width: 2px; height: 26px; background: var(--line); margin: 0 4px; flex: none; }
  .tools { border-right: 2px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; background: var(--bg); }
  .tool { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px 0 8px; border: 2px solid transparent; border-radius: 12px; background: transparent; color: var(--text);
    cursor: pointer; font: 800 12px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; text-align: left; flex: none; }
  .tool canvas { width: 26px; height: 26px; flex: none; }
  .tool .k { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tool.on { background: var(--pri-wash); border-color: var(--pri-light); color: var(--pri-text); }
  .tool.on .k { color: var(--pri-text); }
  @media (hover: hover) { .tool:not(.on):hover { background: var(--soft); } }
  .tools .lbl { padding: 14px 8px 4px; }
  .tools .lbl:first-child { padding-top: 4px; }
  .ecv { position: relative; min-width: 0; min-height: 0; }
  .btn.saved { color: var(--pri-text); }
  #ovSkin .panel { width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; }
  #ovSkin .head { margin-bottom: 18px; }
  #ovUnlock .big { font-size: 40px; line-height: 1.08; margin-bottom: 14px; }
  .unote { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; color: var(--pri-text); font: 800 13px/1.35 var(--sans); letter-spacing: .04em; text-transform: uppercase; }
  .unote svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; flex: none; stroke-linecap: round; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); display: none; }
  .dirty .dot { display: block; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; gap: 28px; }
    .preview { min-height: 260px; }
    .wrap { padding: 24px 16px 48px; }
    #sEdit.on { grid-template-columns: 62px 1fr; }
    .tool { justify-content: center; padding: 0; }
    .tool span, .tool .k, .tools .lbl { display: none; }
    .field { width: 120px; }
  }
  @media (max-width: 560px) {
    .top { height: 58px; padding: 0 8px 0 14px; }
    .brand { font-size: 21px; }
    .crumb { display: none; }
    .ebar { flex-wrap: wrap; overflow: visible; row-gap: 8px; padding: 10px; }
    .ebar .field { order: 0; flex: 1 1 calc(100% - 120px); width: auto; min-width: 0; }
    #edTest { order: 1; flex: 1 1 auto; }
    .ebar .dim { order: 2; flex: 1 1 40%; justify-content: space-between; }
    #edUndo, #edRedo, #edJson { order: 3; flex-basis: 25%; }
    #edExit, #edSave { order: 4; flex-basis: 40%; }
    .ebar .vsep, .ebar .sp { display: none; }
    .ebar .btn.sm { flex: 1 1 auto; }
    .hud { padding: 10px; }
    .hud .lv .nm { display: none; }
    .hud .lv.nonum { display: none; }
    .hud .st { gap: 6px; }
    .hud .st div { min-width: 0; padding: 6px 8px; }
    .hud .st b { font-size: 16px; }
    .stat .v { font-size: 22px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card .thumb { height: 84px; }
    .card .acts { flex-wrap: wrap; }

<script>
/* ===== Core: level format, parsing, physics. No DOM access; runs in Node for level tests. ===== */
var Core = (function () {
  'use strict';
  var T = 32;
  /* tile codes in the serialized row strings */
  var EMPTY = '.', SOLID = '#', SPIKE = '^', LEDGE = '-', SPRING = 'o', GEM = '*', CHECK = 'C', START = 'S', GOAL = 'G';
  /* added with the worlds update: ice (slippery), crumble (falls away soon after you stand on it), lava (deadly) */
  var ICE = 'I', CRUMBLE = 'K', LAVA = 'L';
  var CODES = '.#^-o*CSGIKL';
  var LIMITS = { minW: 12, maxW: 240, minH: 8, maxH: 80, name: 32 };
  var P = {
    w: 22, h: 22,
    run: 250, accG: 2600, accA: 1800, decG: 3000, decA: 1100, turnG: 5200,
    grav: 2300, jumpV: 740, cut: 0.45, hangV: 80, hangG: 0.55, maxFall: 900,
    coyote: 0.09, buffer: 0.12,
    wallSlide: 160, wallJumpVX: 290, wallJumpVY: 690, wallLock: 0.14, wallCoyote: 0.08,
    spring: 1180, dropT: 0.18, iceAcc: 700, iceDec: 260, crumbleT: 0.45
  };
  var DT = 1 / 120;

  function clampInt(v, lo, hi, d) { v = Math.round(+v); return isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d; }

  /* Normalize any untrusted level object into a clean one: {v, name, w, h, rows}. */
  function normalize(o) {
    if (!o || typeof o !== 'object') o = {};
    var rows = Array.isArray(o.rows) ? o.rows : [];
    var h = clampInt(o.h != null ? o.h : rows.length, LIMITS.minH, LIMITS.maxH, 16);
    var w0 = 0; for (var i = 0; i < rows.length; i++) if (typeof rows[i] === 'string') w0 = Math.max(w0, rows[i].length);
    var w = clampInt(o.w != null ? o.w : w0, LIMITS.minW, LIMITS.maxW, 40);
    var out = [], seenS = false, seenG = false;
    for (var y = 0; y < h; y++) {
      var r = typeof rows[y] === 'string' ? rows[y] : '', s = '';
      for (var x = 0; x < w; x++) {
        var c = r.charAt(x) || EMPTY;
        if (CODES.indexOf(c) < 0) c = EMPTY;
        if (c === START) { if (seenS) c = EMPTY; seenS = true; }
        if (c === GOAL) { if (seenG) c = EMPTY; seenG = true; }
        s += c;
      }
      out.push(s);
    }
    var name = typeof o.name === 'string' ? o.name.replace(/[\u0000-\u001f]/g, '').trim().slice(0, LIMITS.name) : '';
    return { v: 1, name: name || 'Untitled', w: w, h: h, rows: out };
  }

  function serialize(lv) { return JSON.stringify(normalize(lv)); }
  function deserialize(str) { try { return normalize(JSON.parse(str)); } catch (e) { return null; } }

  function blank(w, h) {
    var rows = [];
    for (var y = 0; y < h; y++) {
      var s = '';
      for (var x = 0; x < w; x++) s += y >= h - 2 ? SOLID : EMPTY;
      rows.push(s);
    }
    rows[h - 3] = rows[h - 3].slice(0, 2) + START + rows[h - 3].slice(3, w - 3) + GOAL + rows[h - 3].slice(w - 2);
    return { v: 1, name: 'Untitled', w: w, h: h, rows: rows };
  }

  /* Build the runtime world from a normalized level. */
  function build(lv) {
    lv = normalize(lv);
    var w = lv.w, h = lv.h, g = new Array(w * h), orient = new Uint8Array(w * h);
    var start = null, goal = null, gems = [], checks = [];
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var c = lv.rows[y].charAt(x), i = y * w + x;
      if (c === START) { start = { x: x, y: y }; c = EMPTY; }
      else if (c === GOAL) { goal = { x: x, y: y }; c = EMPTY; }
      else if (c === GEM) { gems.push({ x: x, y: y }); c = EMPTY; }
      else if (c === CHECK) { checks.push({ x: x, y: y }); c = EMPTY; }
      g[i] = c;
    }
    var W = { lv: lv, w: w, h: h, g: g, orient: orient, start: start, goal: goal, gems: gems, checks: checks, ok: !!(start && goal) };
    /* spikes point away from the block they sit on: 0 up, 1 down, 2 right, 3 left */
    for (var j = 0; j < w * h; j++) if (g[j] === SPIKE) {
      var sx = j % w, sy = (j / w) | 0;
      orient[j] = solidAt(W, sx, sy + 1) ? 0 : solidAt(W, sx, sy - 1) ? 1 : solidAt(W, sx - 1, sy) ? 2 : solidAt(W, sx + 1, sy) ? 3 : 0;
    }
    return W;
  }

  function cell(W, x, y) { return x < 0 || y < 0 || x >= W.w || y >= W.h ? '' : W.g[y * W.w + x]; }
  /* sides and top of the level are walls, the bottom is open (falling out kills) */
  function solidAt(W, x, y) {
    if (x < 0 || x >= W.w || y < 0) return true; if (y >= W.h) return false;
    var i = y * W.w + x, c = W.g[i];
    return c === SOLID || c === ICE || (c === CRUMBLE && !crumbled(W, i));
  }
  /* crumble blocks: the time each was first stood on lives on the world for the current run */
  function crumbled(W, i) { var t = W.crumb ? W.crumb[i] : null; return t != null && W.now - t > P.crumbleT; }

  function spawnPoint(W, c) { var s = c || W.start || { x: 1, y: 1 }; return { x: s.x * T + (T - P.w) / 2, y: (s.y + 1) * T - P.h }; }

  function newRun(W) {
    var sp = spawnPoint(W); W.crumb = {}; W.now = 0;
    return {
      t: 0, frames: 0, deaths: 0, done: false, cp: -1, got: W.gems.map(function () { return false; }), cpOn: W.checks.map(function () { return false; }),
      dead: 0, ev: [],
      p: { x: sp.x, y: sp.y, px: sp.x, py: sp.y, vx: 0, vy: 0, ground: true, coyote: 0, buffer: 0, wall: 0, wallT: 0, wallSide: 0, lock: 0, face: 1,
        jumping: false, held: false, drop: 0, land: 0, sprung: 0, ice: false }
    };
  }

  function overlapSolid(W, x, y, w, h) {
    var x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.001) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.001) / T);
    for (var ty = y0; ty <= y1; ty++) for (var tx = x0; tx <= x1; tx++) if (solidAt(W, tx, ty)) return true;
    return false;
  }

  function wallContact(W, p) {
    if (overlapSolid(W, p.x + P.w, p.y + 3, 3, P.h - 8)) return 1;
    if (overlapSolid(W, p.x - 3, p.y + 3, 3, P.h - 8)) return -1;
    return 0;
  }

  function approach(v, t, d) { return v < t ? Math.min(t, v + d) : Math.max(t, v - d); }

  function kill(R) { if (R.dead > 0 || R.done) return; R.dead = 0.55; R.deaths++; R.ev.push({ k: 'die', x: R.p.x + P.w / 2, y: R.p.y + P.h / 2 }); }

  function spikeBox(W, tx, ty) {
    var o = W.orient[ty * W.w + tx], x = tx * T, y = ty * T, m = 5, d = T * 0.55;
    if (o === 0) return [x + m, y + T - d + 4, T - 2 * m, d - 4];
    if (o === 1) return [x + m, y, T - 2 * m, d - 4];
    if (o === 2) return [x, y + m, d - 4, T - 2 * m];
    return [x + T - d + 4, y + m, d - 4, T - 2 * m];
  }
  function hit(ax, ay, aw, ah, b) { return ax < b[0] + b[2] && ax + aw > b[0] && ay < b[1] + b[3] && ay + ah > b[1]; }

  /* One fixed step. inp: {l, r, j, d} booleans (held). */
  function step(W, R, inp) {
    var p = R.p, dt = DT;
    p.px = p.x; p.py = p.y;
    if (R.done) return;
    R.frames++; R.t = R.frames * dt; W.now = R.t;
    if (R.dead > 0) {
      R.dead -= dt;
      if (R.dead <= 0) {
        var sp = spawnPoint(W, R.cp >= 0 ? W.checks[R.cp] : null);
        p.x = p.px = sp.x; p.y = p.py = sp.y; p.vx = p.vy = 0; p.ground = true; p.lock = 0; p.buffer = 0; p.jumping = false; p.held = inp.j; p.face = 1;
        R.dead = 0; W.crumb = {}; R.ev.push({ k: 'spawn', x: p.x + P.w / 2, y: p.y + P.h / 2 });
      }
      return;
    }
    var pressed = inp.j && !p.held; p.held = inp.j;
    p.buffer = pressed ? P.buffer : Math.max(0, p.buffer - dt);
    var dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
    if (dir) p.face = dir;

    /* horizontal */
    if (p.lock > 0) p.lock -= dt;
    else {
      var target = dir * P.run, a;
      if (p.ground && p.ice) a = dir === 0 ? P.iceDec : P.iceAcc;
      else if (p.ground) a = dir === 0 ? P.decG : (p.vx * dir < 0 ? P.turnG : P.accG);
      else a = dir === 0 ? P.decA : P.accA;
      p.vx = approach(p.vx, target, a * dt);
    }

    /* vertical */
    var gr = P.grav;
    if (p.jumping && inp.j && Math.abs(p.vy) < P.hangV) gr *= P.hangG;
    p.vy = Math.min(P.maxFall, p.vy + gr * dt);
    p.wall = p.ground ? 0 : wallContact(W, p);
    /* a wall jump still works for a moment after leaving the wall */
    if (p.wall) { p.wallT = P.wallCoyote; p.wallSide = p.wall; } else p.wallT = p.ground ? 0 : Math.max(0, p.wallT - dt);
    if (p.wall && dir === p.wall && p.vy > P.wallSlide) p.vy = P.wallSlide;

    if (p.buffer > 0) {
      if (p.ground || p.coyote > 0) {
        p.vy = -P.jumpV; p.buffer = 0; p.coyote = 0; p.ground = false; p.jumping = true;
        R.ev.push({ k: 'jump', x: p.x + P.w / 2, y: p.y + P.h });
      } else if (p.wallT > 0) {
        var sd = p.wallSide;
        p.vy = -P.wallJumpVY; p.vx = -sd * P.wallJumpVX; p.lock = P.wallLock; p.face = -sd; p.buffer = 0; p.jumping = true; p.wallT = 0;
        R.ev.push({ k: 'wall', x: p.x + (sd > 0 ? P.w : 0), y: p.y + P.h / 2, d: sd });
      }
    }
    if (p.jumping && !inp.j && p.vy < 0) { p.vy *= P.cut; p.jumping = false; }
    if (p.vy >= 0) p.jumping = false;
    if (p.drop > 0) p.drop -= dt;
    if (inp.d && p.ground && onLedge(W, p)) p.drop = P.dropT;

    /* move x */
    p.x += p.vx * dt;
    if (p.vx > 0 && overlapSolid(W, p.x, p.y, P.w, P.h)) { p.x = Math.floor((p.x + P.w) / T) * T - P.w; p.vx = 0; }
    else if (p.vx < 0 && overlapSolid(W, p.x, p.y, P.w, P.h)) { p.x = (Math.floor(p.x / T) + 1) * T; p.vx = 0; }

    /* move y */
    var wasGround = p.ground, oldBottom = p.y + P.h;
    p.y += p.vy * dt;
    p.ground = false;
    if (p.vy > 0) {
      var by = p.y + P.h;
      if (overlapSolid(W, p.x, p.y, P.w, P.h)) { p.y = Math.floor(by / T) * T - P.h; p.ground = true; }
      else if (p.drop <= 0) {
        var row = Math.floor(by / T), top = row * T;
        if (oldBottom <= top + 0.01 && by >= top) {
          var x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + P.w - 0.001) / T);
          for (var tx = x0; tx <= x1; tx++) if (cell(W, tx, row) === LEDGE) { p.y = top - P.h; p.ground = true; break; }
        }
      }
      if (p.ground) { if (!wasGround && p.vy > 300) { p.land = Math.min(1, p.vy / P.maxFall); R.ev.push({ k: 'land', x: p.x + P.w / 2, y: p.y + P.h, s: p.land }); } p.vy = 0; }
    } else if (p.vy < 0 && overlapSolid(W, p.x, p.y, P.w, P.h)) {
      p.y = (Math.floor(p.y / T) + 1) * T; p.vy = 0; p.jumping = false;
    }
    if (!p.ground && p.vy === 0) {
      /* resting exactly on a surface */
      if (overlapSolid(W, p.x, p.y + P.h, P.w, 1) || (p.drop <= 0 && ledgeBelow(W, p))) p.ground = true;
    }
    p.coyote = p.ground ? P.coyote : Math.max(0, p.coyote - dt);
    /* what the feet stand on: ice for the next step, crumble starts to fall */
    p.ice = false;
    if (p.ground) {
      var fr = Math.round((p.y + P.h) / T), fx0 = Math.floor(p.x / T), fx1 = Math.floor((p.x + P.w - 0.001) / T);
      for (var fx = fx0; fx <= fx1; fx++) {
        var fc = cell(W, fx, fr);
        if (fc === ICE) p.ice = true;
        else if (fc === CRUMBLE && W.crumb[fr * W.w + fx] == null) W.crumb[fr * W.w + fx] = R.t;
      }
    }

    /* tiles touched */
    interact(W, R);
  }

  function onLedge(W, p) { return ledgeBelow(W, p) && !overlapSolid(W, p.x, p.y + P.h, P.w, 1); }
  function ledgeBelow(W, p) {
    var by = p.y + P.h; if (Math.abs(by - Math.round(by / T) * T) > 0.01) return false;
    var row = Math.round(by / T), x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + P.w - 0.001) / T);
    for (var tx = x0; tx <= x1; tx++) if (cell(W, tx, row) === LEDGE) return true;
    return false;
  }

  function interact(W, R) {
    var p = R.p, i;
    if (p.y > W.h * T + 64) { kill(R); return; }
    var x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + P.w - 0.001) / T), y0 = Math.floor(p.y / T), y1 = Math.floor((p.y + P.h - 0.001) / T);
    for (var ty = y0; ty <= y1; ty++) for (var tx = x0; tx <= x1; tx++) {
      var c = cell(W, tx, ty);

  function renderPlay() {
    var cv = $('cvPlay'); if (!fit(cv) || !G.R) return;
    var c = cv.getContext('2d'), cw = cv.width, ch = cv.height, v = playView(cw, ch), d = dpr();
    if (G.shake > 0) { v.ox += Math.round((Math.random() - 0.5) * 6 * d * G.shake); v.oy += Math.round((Math.random() - 0.5) * 6 * d * G.shake); }
    G.view = v;
    var sp = {}; for (var k in G.springs) sp[k] = Math.sin(clamp(G.springs[k], 0, 1) * Math.PI);
    drawWorld(c, G.W, v, cw, ch, { springs: sp, cache: true }, G.R, clock);
    var p = G.R.p, a = G.paused ? 1 : clamp(G.acc / Core.DT, 0, 1);
    if (G.R.dead <= 0) drawPlayer(c, v, p.px + (p.x - p.px) * a, p.py + (p.y - p.py) * a, p.face, G.sq, G.blinkT < 0);
    var kk = v.tp / T;
    for (var i = 0; i < G.parts.length; i++) {
      var q = G.parts[i], s = Math.max(1, Math.round(q.s * kk * (0.4 + 0.6 * q.life / q.max)));
      c.globalAlpha = clamp(q.life / q.max * 1.4, 0, 1);
      c.fillStyle = q.c === 'accent' ? PAL.gem : q.c === 'danger' ? PAL.danger : q.c === 'look' ? look().c1 : PAL.fg3;
      c.beginPath(); c.arc(v.ox + q.x * kk, v.oy + q.y * kk, s / 2, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
  }

  /* ================= editor ================= */
  var TOOLS = [
    { c: '#', n: 'Block' }, { c: '^', n: 'Spike' }, { c: '-', n: 'Ledge' }, { c: 'o', n: 'Spring' },
    { c: 'I', n: 'Ice' }, { c: 'K', n: 'Crumble' }, { c: 'L', n: 'Lava' },
    { c: '*', n: 'Gem' }, { c: 'C', n: 'Checkpoint' }, { c: 'S', n: 'Start' }, { c: 'G', n: 'Goal' }, { c: '.', n: 'Erase' }, { c: 'pan', n: 'Move' }
  ];
  var iconsDirty = true;
  var Ed = (function () {
    var E = { id: null, lv: null, rows: null, W: null, tool: '#', cam: { x: 0, y: 0 }, css: 30, undo: [], redo: [], dirty: false, hover: null, drag: null, space: false, savedFlash: 0 };
    var cv = $('cvEdit');

    function toolsUI() {
      var t = $('tools'), h = '<div class="lbl">Tiles</div>';
      TOOLS.forEach(function (o, i) {
        if (i === 9) h += '<div class="lbl">Markers</div>';
        if (i === 11) h += '<div class="lbl">Clear</div>';
        if (i === 12) h += '<div class="lbl">View</div>';
        h += '<button class="tool" data-c="' + o.c + '" title="' + o.n + '"><canvas width="24" height="24"></canvas><span>' + o.n + '</span><span class="k">' + (i < 9 ? i + 1 : '') + '</span></button>';
      });
      t.innerHTML = h;
      Array.prototype.forEach.call(t.querySelectorAll('.tool'), function (b) { b.addEventListener('click', function () { setTool(b.getAttribute('data-c')); }); });
      paintTools();
    }
    function setTool(c) { E.tool = c; paintTools(); iconsDirty = true; draw(); }
    function paintTools() {
      Array.prototype.forEach.call($('tools').querySelectorAll('.tool'), function (b) { b.classList.toggle('on', b.getAttribute('data-c') === E.tool); });
    }
    function drawIcons() {
      if (!iconsDirty) return;
      var any = false;
      Array.prototype.forEach.call($('tools').querySelectorAll('.tool canvas'), function (icv) {
        var r = icv.getBoundingClientRect(); if (r.width < 1) return; any = true;
        var d = dpr(), sz = Math.round(24 * d); if (icv.width !== sz) { icv.width = sz; icv.height = sz; }
        var c = icv.getContext('2d'), ch0 = icv.parentNode.getAttribute('data-c');
        c.clearRect(0, 0, sz, sz);
        var tp = sz;
        if (ch0 === '#') soilTile(c, 0, 0, tp, [true, true, true, true], 0, 0);
        else if (ch0 === '^') drawSpike(c, 0, 0, tp, 0);
        else if (ch0 === '-') drawLedge(c, 0, Math.round(tp * 0.35), tp);
        else if (ch0 === 'o') drawSpring(c, 0, 0, tp, 0);
        else if (ch0 === 'I') drawIce(c, 0, 0, tp);
        else if (ch0 === 'K') drawCrumble(c, 0, 0, tp, 0);
        else if (ch0 === 'L') drawLava(c, 0, 0, tp);
        else if (ch0 === '*') drawGem(c, Math.round(tp / 2), Math.round(tp / 2), tp * 1.5);
        else if (ch0 === 'C') drawCheck(c, Math.round(tp * 0.15), Math.round(tp * 0.38), Math.round(tp * 0.62), true);
        else if (ch0 === 'S') drawStart(c, 0, 0, tp);
        else if (ch0 === 'G') drawGoal(c, Math.round(tp * 0.12), Math.round(tp * 0.45), Math.round(tp * 0.55), 0);
        else if (ch0 === 'pan') {
          var pl = Math.max(1.5, 1.8 * d), q = tp * 0.36, a = tp * 0.12;
          c.strokeStyle = getComputedStyle(icv.parentNode).color; c.lineWidth = pl; c.lineCap = 'round'; c.lineJoin = 'round';
          c.save(); c.translate(tp / 2, tp / 2); c.beginPath(); c.moveTo(-q, 0); c.lineTo(q, 0); c.moveTo(0, -q); c.lineTo(0, q);
          [[-q, 0, 1, 0], [q, 0, -1, 0], [0, -q, 0, 1], [0, q, 0, -1]].forEach(function (r) { c.moveTo(r[0] + r[2] * a + r[3] * a, r[1] + r[3] * a + r[2] * a); c.lineTo(r[0], r[1]); c.lineTo(r[0] + r[2] * a - r[3] * a, r[1] + r[3] * a - r[2] * a); });
          c.stroke(); c.restore();
        }
        else if (ch0 === '.') {
          var l = Math.max(1, Math.round(1.5 * d)); c.strokeStyle = 'currentColor';
          c.fillStyle = getComputedStyle(icv.parentNode).color;
          var m = Math.round(tp * 0.22), e = tp - m;
          c.save(); c.translate(tp / 2, tp / 2); c.rotate(Math.PI / 4); c.fillRect(-tp * 0.36, -l / 2, tp * 0.72, l); c.fillRect(-l / 2, -tp * 0.36, l, tp * 0.72); c.restore();
        }
      });
      if (any) iconsDirty = false;
    }

    function load(lv) {
      E.lv = Core.normalize(lv); E.rows = E.lv.rows.map(function (r) { return r.split(''); }); rebuild();
      $('edName').value = E.lv.name; dims(); E.undo = []; E.redo = []; setDirty(false); center();
    }
    function snapshot() { return { w: E.lv.w, h: E.lv.h, rows: E.rows.map(function (r) { return r.join(''); }) }; }
    function restore(s) { E.lv.w = s.w; E.lv.h = s.h; E.rows = s.rows.map(function (r) { return r.split(''); }); rebuild(); dims(); }
    function pushUndo() { E.undo.push(snapshot()); if (E.undo.length > 120) E.undo.shift(); E.redo = []; }
    function rebuild() { E.lv.rows = E.rows.map(function (r) { return r.join(''); }); E.W = Core.build(E.lv); }
    function current() { rebuild(); var o = Core.normalize({ name: $('edName').value, w: E.lv.w, h: E.lv.h, rows: E.lv.rows }); return o; }
    function dims() { $('edW').textContent = E.lv.w; $('edH').textContent = E.lv.h; }
    function setDirty(v) { E.dirty = v; $('edSave').classList.toggle('dirty', v); if (v) { $('edSaveT').textContent = 'Save'; $('edSave').classList.remove('saved'); } }

    function open(id) {
      E.id = id;
      var it = id ? SV.mine.filter(function (m) { return m.id === id; })[0] : null;
      load(it ? it.level : Core.blank(40, 16));
      if (!it) setDirty(false);
      show('edit'); iconsDirty = true; center(); draw();
    }
    function save() {
      var lv = current(), ok;
      if (E.id) { var it = SV.mine.filter(function (m) { return m.id === E.id; })[0]; if (it) it.level = lv; else SV.mine.push({ id: E.id, level: lv }); }
      else { E.id = uid(); SV.mine.push({ id: E.id, level: lv }); }
      ok = saveNow();
      if (!ok) { $('edSaveT').textContent = 'Full'; return false; }
      setDirty(false); $('edSaveT').textContent = 'Saved'; $('edSave').classList.add('saved');
      clearTimeout(E.savedFlash); E.savedFlash = setTimeout(function () { if (!E.dirty) { $('edSaveT').textContent = 'Save'; $('edSave').classList.remove('saved'); } }, 1400);
      return true;
    }
    function leave(fn) {
      if (!E.dirty) { fn(); return; }
      E.after = fn; $('ovLeave').classList.add('on');
    }

    /* view */
    function view() {
      var d = dpr(), tp = Math.max(4, Math.round(E.css * d));
      return { tp: tp, ox: Math.round(cv.width / 2 - E.cam.x * tp / T), oy: Math.round(cv.height / 2 - E.cam.y * tp / T) };
    }
    function center() {
      var r = cv.getBoundingClientRect();
      if (r.width > 0 && r.height > 0) E.css = clamp(Math.floor(Math.min((r.width - 80) / E.lv.w, (r.height - 80) / E.lv.h)), 14, 40);
      E.cam.x = E.lv.w * T / 2; E.cam.y = E.lv.h * T / 2;
      if (r.width > 0 && E.lv.w * E.css > r.width - 80) E.cam.x = (r.width / 2 - 40) / E.css * T;
    }
    function cellAt(e) {
      var r = cv.getBoundingClientRect(), d = dpr(), v = view();
      var x = (e.clientX - r.left) * d, y = (e.clientY - r.top) * d;
      return { x: Math.floor((x - v.ox) / v.tp), y: Math.floor((y - v.oy) / v.tp) };
    }
    function inb(x, y) { return x >= 0 && y >= 0 && x < E.lv.w && y < E.lv.h; }
    function paint(x, y, c) {
      if (!inb(x, y)) return false;
      if (E.rows[y][x] === c) return false;
      if (c === 'S' || c === 'G') for (var j = 0; j < E.lv.h; j++) for (var i = 0; i < E.lv.w; i++) if (E.rows[j][i] === c) E.rows[j][i] = '.';
      E.rows[y][x] = c; return true;
    }
    function line(a, b, c) {
      var dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y), sx = a.x < b.x ? 1 : -1, sy = a.y < b.y ? 1 : -1, err = dx - dy, x = a.x, y = a.y, ch = false;
      for (var guard = 0; guard < 2000; guard++) {
        if (paint(x, y, c)) ch = true;
        if (x === b.x && y === b.y) break;
        var e2 = 2 * err; if (e2 > -dy) { err -= dy; x += sx; } if (e2 < dx) { err += dx; y += sy; }
      }
      return ch;
    }

    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    cv.addEventListener('pointerdown', function (e) {
      if (!E.lv) return;
      try { cv.setPointerCapture(e.pointerId); } catch (er) {}
      if (e.button === 1 || E.space || (e.button === 0 && (e.altKey || E.tool === 'pan'))) { E.drag = { pan: true, x: e.clientX, y: e.clientY, cx: E.cam.x, cy: E.cam.y }; e.preventDefault(); return; }
      var c = e.button === 2 ? '.' : E.tool, at = cellAt(e);
      var before = snapshot();
      E.drag = { pan: false, c: c, last: at, before: before, changed: false };
      if (paint(at.x, at.y, c)) { E.drag.changed = true; rebuild(); }
      if (c === 'S' || c === 'G') E.drag.single = true;
      draw();
    });
    cv.addEventListener('pointermove', function (e) {
      if (!E.lv) return;
      var at = cellAt(e);
      if (!E.hover || E.hover.x !== at.x || E.hover.y !== at.y) { E.hover = at; draw(); }
      if (!E.drag) return;
      if (E.drag.pan) {
        var k = T / E.css; E.cam.x = E.drag.cx - (e.clientX - E.drag.x) * k; E.cam.y = E.drag.cy - (e.clientY - E.drag.y) * k; clampCam(); draw(); return;
      }
      if (E.drag.single) { if (paint(at.x, at.y, E.drag.c)) { E.drag.changed = true; rebuild(); draw(); } return; }
      if (line(E.drag.last, at, E.drag.c)) { E.drag.changed = true; rebuild(); draw(); }
      E.drag.last = at;
    });
    function endDrag() {
      if (E.drag && !E.drag.pan && E.drag.changed) { E.undo.push(E.drag.before); if (E.undo.length > 120) E.undo.shift(); E.redo = []; setDirty(true); }
      E.drag = null;
    }
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    cv.addEventListener('pointerleave', function () { if (!E.drag) { E.hover = null; draw(); } });
    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        var r = cv.getBoundingClientRect(), mx = e.clientX - r.left - r.width / 2, my = e.clientY - r.top - r.height / 2;
        var wx = E.cam.x + mx * T / E.css, wy = E.cam.y + my * T / E.css;
        E.css = clamp(E.css * Math.exp(-e.deltaY * 0.004), 8, 72);
        E.cam.x = wx - mx * T / E.css; E.cam.y = wy - my * T / E.css;
      } else {
        var s = e.deltaMode === 1 ? 16 : 1;
        E.cam.x += (e.shiftKey ? e.deltaY : e.deltaX) * s * T / E.css; if (!e.shiftKey) E.cam.y += e.deltaY * s * T / E.css;
      }
      clampCam(); draw();
    }, { passive: false });
    function clampCam() { E.cam.x = clamp(E.cam.x, -4 * T, (E.lv.w + 4) * T); E.cam.y = clamp(E.cam.y, -4 * T, (E.lv.h + 4) * T); }

    function resizeLevel(dw, dh) {
      var w = clamp(E.lv.w + dw, Core.LIMITS.minW, Core.LIMITS.maxW), h = clamp(E.lv.h + dh, Core.LIMITS.minH, Core.LIMITS.maxH);
      if (w === E.lv.w && h === E.lv.h) return;
      pushUndo();
      var rows = [], y, x;
      /* keep the bottom edge fixed: rows are added or removed at the top */
      for (y = 0; y < h; y++) {
        var sy = y - (h - E.lv.h), r = [];
        for (x = 0; x < w; x++) r.push(sy >= 0 && sy < E.lv.h && x < E.lv.w ? E.rows[sy][x] : '.');
        rows.push(r);
      }
      E.cam.y += (h - E.lv.h) * T;
      E.lv.w = w; E.lv.h = h; E.rows = rows; rebuild(); dims(); setDirty(true); draw();
    }
    Array.prototype.forEach.call(document.querySelectorAll('.dim button'), function (b) {
      b.addEventListener('click', function () {
        var d = b.getAttribute('data-d'), n = d.charAt(1) === '+' ? 1 : -1;
        if (d.charAt(0) === 'w') resizeLevel(n, 0); else resizeLevel(0, n);
      });
    });
    function doUndo() { if (!E.undo.length) return; E.redo.push(snapshot()); restore(E.undo.pop()); setDirty(true); draw(); }
    function doRedo() { if (!E.redo.length) return; E.undo.push(snapshot()); restore(E.redo.pop()); setDirty(true); draw(); }
    $('edUndo').addEventListener('click', doUndo);
    $('edRedo').addEventListener('click', doRedo);
    $('edName').addEventListener('input', function () { setDirty(true); });
    $('edName').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); $('edName').blur(); } });
    $('edSave').addEventListener('click', save);
    $('edExit').addEventListener('click', function () { leave(function () { show('levels'); }); });
    $('edTest').addEventListener('click', test);
    function test() {
      var lv = current();
      if (!Core.build(lv).ok) { flashMissing(); return; }
      playLevel(lv, E.id ? 'u' + E.id : 'utest', { test: true });
    }
    function flashMissing() {
      var b = $('edTest'), t = b.textContent; b.textContent = !E.W.start ? 'No start' : 'No goal'; b.classList.remove('acc'); b.classList.add('danger');
      setTimeout(function () { b.textContent = t; b.classList.add('acc'); b.classList.remove('danger'); }, 1200);
    }
    /* JSON */
    $('edJson').addEventListener('click', function () {
      var s = JSON.stringify(current());
      $('jsText').value = s.replace('"rows":[', '"rows":[\n  ').replace(/","/g, '",\n  "').replace(/"\]\}$/, '"\n]}');
      $('jsText').classList.remove('bad'); $('jsSize').textContent = s.length + ' chars';
      $('ovJson').classList.add('on');
      setTimeout(function () { $('jsText').focus(); $('jsText').select(); }, 0);
    });
    $('jsCancel').addEventListener('click', function () { $('ovJson').classList.remove('on'); });
    $('jsApply').addEventListener('click', function () {
      var lv = Core.deserialize($('jsText').value);
      if (!lv) { $('jsText').classList.add('bad'); return; }
      pushUndo(); E.lv = lv; E.rows = lv.rows.map(function (r) { return r.split(''); }); rebuild(); $('edName').value = lv.name; dims(); setDirty(true);
      $('ovJson').classList.remove('on'); center(); draw();
    });
    $('jsText').addEventListener('input', function () { $('jsText').classList.remove('bad'); $('jsSize').textContent = $('jsText').value.length + ' chars'; });
    $('lvSave').addEventListener('click', function () { if (save()) { $('ovLeave').classList.remove('on'); var f = E.after; E.after = null; if (f) f(); } });
    $('lvDiscard').addEventListener('click', function () { $('ovLeave').classList.remove('on'); setDirty(false); var f = E.after; E.after = null; if (f) f(); });
    $('lvCancel').addEventListener('click', function () { $('ovLeave').classList.remove('on'); E.after = null; });

    function key(e) {
      if ($('ovJson').classList.contains('on') || $('ovLeave').classList.contains('on')) {
        if (e.code === 'Escape') { $('ovJson').classList.remove('on'); $('ovLeave').classList.remove('on'); }
        return;
      }
      var k = e.code, mod = e.metaKey || e.ctrlKey;
      if (mod && k === 'KeyZ') { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); return; }
      if (mod && k === 'KeyY') { e.preventDefault(); doRedo(); return; }
      if (mod && k === 'KeyS') { e.preventDefault(); save(); return; }
      if (mod) return;
      var dg = /^Digit([1-9])$/.exec(k);
      if (dg) { setTool(TOOLS[+dg[1] - 1].c); return; }
      if (k === 'KeyE') { setTool('.'); return; }
      if (k === 'KeyT' || k === 'Enter') { test(); return; }
      if (k === 'Space') { E.space = true; e.preventDefault(); return; }
      var pan = 4 * T;
      if (k === 'ArrowLeft') { E.cam.x -= pan; } else if (k === 'ArrowRight') { E.cam.x += pan; } else if (k === 'ArrowUp') { E.cam.y -= pan; } else if (k === 'ArrowDown') { E.cam.y += pan; } else return;
      e.preventDefault(); clampCam(); draw();
    }
    window.addEventListener('keyup', function (e) { if (e.code === 'Space') E.space = false; });

    function draw() {
      if (cur !== 'edit' || !E.W) return;
      if (!fit(cv)) return;
      drawIcons();
      var c = cv.getContext('2d'), v = view(), cw = cv.width, ch = cv.height;
      drawWorld(c, E.W, v, cw, ch, { editor: true, still: true }, null, 0);
      if (E.hover && inb(E.hover.x, E.hover.y) && !(E.drag && E.drag.pan) && E.tool !== 'pan') {
        var lw = Math.max(1, Math.round(1.5 * dpr())), X = v.ox + E.hover.x * v.tp, Y = v.oy + E.hover.y * v.tp, tp = v.tp;
        c.fillStyle = PAL.accent; c.globalAlpha = 0.16; RR(c, X, Y, tp, tp, tp * 0.18); c.fill(); c.globalAlpha = 1;
        c.strokeStyle = PAL.accent; c.lineWidth = Math.max(2, lw); RR(c, X + lw / 2, Y + lw / 2, tp - lw, tp - lw, tp * 0.18); c.stroke();
      }
      cv.style.cursor = E.space || E.tool === 'pan' || (E.drag && E.drag.pan) ? 'grab' : 'crosshair';
    }
    function resize() { draw(); }
    toolsUI();
    return { open: open, draw: draw, resize: resize, key: key, leave: leave, center: center };
  })();

  /* ================= loop ================= */
  var last = 0, running = false;
  function frame(ts) {
    running = false;
    var dt = last ? Math.min(0.1, (ts - last) / 1000) : 1 / 60; last = ts;
    clock += dt;
    if (cur === 'play') { updatePlay(dt); renderPlay(); }
    if (cur === 'play') kick();
    else last = 0;
  }
  function kick() { if (running) return; running = true; try { requestAnimationFrame(frame); } catch (e) { running = false; } }

  function redrawStatic() {
    if (!PAL.bg) return;
    if (cur === 'menu') drawPreview();
    else if (cur === 'levels') buildLevels();
    else if (cur === 'edit') Ed.draw();
    else if (cur === 'play') renderPlay();
  }
  var rzT = 0;
  function onResize() { clearTimeout(rzT); if (cur === 'play') renderPlay(); else if (cur === 'edit') Ed.draw(); rzT = setTimeout(function () { iconsDirty = true; if (cur !== 'play') redrawStatic(); }, 60); }
  window.addEventListener('resize', onResize);
  try { if (window.ResizeObserver) new ResizeObserver(onResize).observe(document.querySelector('main')); } catch (e) {}
  (function watchDpr() {
    try {
      var mq = matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
      var h = function () { iconsDirty = true; onResize(); watchDpr(); };
      if (mq.addEventListener) mq.addEventListener('change', h, { once: true }); else if (mq.addListener) mq.addListener(function f() { mq.removeListener(f); h(); });
    } catch (e) {}
  })();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (!SV.theme) setTheme(plannerTheme()); }); } catch (e) {}
  document.addEventListener('visibilitychange', function () { if (document.hidden && cur === 'play' && G.R && !G.R.done) pause(true); });

  if (TEST) {
    $('testTag').hidden = false;
    /* read-only probe for automated play tests */
    window.LM_TEST = { state: function () { var R = G.R; return { screen: cur, level: G.idx, frames: R ? R.frames : 0, done: R ? R.done : false, deaths: R ? R.deaths : 0, x: R ? R.p.x : 0, y: R ? R.p.y : 0, ground: R ? R.p.ground : false }; } };
  }
  show('menu');
  loadSave();
})();
</script>
</body>
