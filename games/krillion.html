function dateLabel(day) { var d = new Date(day * 864e5); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' }); }

/* ---------- saves ---------- */
var framed = false; try { framed = !!(window.parent && window.parent !== window); } catch (e) { framed = true; }
var LS = GAME + '.save';
function blank() { return { v: 1, daily: null, lastDone: -1, streak: 0, bestStreak: 0, bestDaily: 0, bestEndless: 0, dives: 0, hist: {} }; }
var S = blank();
function fix(d) {
  var b = blank(); if (!d || typeof d !== 'object') return b;
  Object.keys(b).forEach(function (k) { if (typeof d[k] === typeof b[k] || (k === 'daily' && d[k] && typeof d[k] === 'object')) b[k] = d[k]; });
  if (!b.hist || typeof b.hist !== 'object') b.hist = {};
  return b;
}
function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } }
function load(cb) {
  if (!framed || window.KR_NOBRIDGE) { cb(lsGet()); return; }
  var reqId = 'kr' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), done = false;
  function onMsg(e) {
    var m = e.data; if (!m || m.type !== 'game-load-res' || m.reqId !== reqId || done) return;
    done = true; window.removeEventListener('message', onMsg);
    var d = null; try { d = typeof m.data === 'string' && m.data ? JSON.parse(m.data) : null; } catch (err) { d = null; }
    cb(d || lsGet());
  }
  window.addEventListener('message', onMsg);
  try { parent.postMessage({ type: 'game-load', game: GAME, reqId: reqId }, '*'); } catch (e) {}
  setTimeout(function () { if (!done) { done = true; window.removeEventListener('message', onMsg); cb(lsGet()); } }, 3000);
}
function save() {
  var ks = Object.keys(S.hist).sort(function (a, b) { return a - b; });
  while (ks.length > 120) delete S.hist[ks.shift()];
  var s = JSON.stringify(S);
  try { localStorage.setItem(LS, s); } catch (e) {}
  if (framed && !window.KR_NOBRIDGE) { try { parent.postMessage({ type: 'game-save', game: GAME, data: s }, '*'); } catch (e) {} }
}
function streakNow() { return S.lastDone >= today() - 1 ? S.streak : 0; }

/* ---------- art (flat objects) ---------- */
function helmet() {
  return '<svg viewBox="0 0 64 64"><rect x="14" y="50" width="36" height="9" rx="3" fill="#cd7900"/><circle cx="32" cy="30" r="24" fill="#ffc800"/>' +
    '<path d="M32 6a24 24 0 0 1 0 48z" fill="#e5a400"/><circle cx="32" cy="30" r="13" fill="#e5a400"/><circle cx="32" cy="30" r="10" fill="#84d8ff"/>' +
    '<path d="M25 25a10 10 0 0 1 9-5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="12" cy="30" r="5" fill="#e5a400"/><circle cx="52" cy="30" r="5" fill="#cd7900"/>' +
    '<circle cx="20" cy="14" r="2" fill="#cd7900"/><circle cx="44" cy="14" r="2" fill="#cd7900"/><circle cx="20" cy="46" r="2" fill="#cd7900"/><circle cx="44" cy="46" r="2" fill="#cd7900"/></svg>';
}
function tank() {
  return '<svg viewBox="0 0 64 64"><rect x="26" y="3" width="12" height="8" rx="2" fill="#777"/><rect x="20" y="7" width="24" height="5" rx="2" fill="#afafaf"/>' +
    '<rect x="16" y="12" width="32" height="49" rx="14" fill="#ff4b4b"/><path d="M32 12h2a14 14 0 0 1 14 14v21a14 14 0 0 1-14 14h-2z" fill="#ea2b2b"/>' +
    '<rect x="16" y="30" width="32" height="10" fill="#fff"/><rect x="32" y="30" width="16" height="10" fill="#e5e5e5"/><rect x="22" y="17" width="5" height="11" rx="2.5" fill="#ff8a8a"/></svg>';
}
function bubble() { return '<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="currentColor" opacity=".35"/><circle cx="8" cy="8" r="3" fill="currentColor"/></svg>'; }
function heroArt() {
  var w = 760, h = 230, s = '<svg viewBox="0 0 760 230" preserveAspectRatio="xMidYMid slice">';
  var bh = [0, 46, 92, 138, 184];
  [BANDS[0], BANDS[1], BANDS[3], BANDS[5], BANDS[7]].forEach(function (c, i) { s += '<rect x="0" y="' + bh[i] + '" width="' + w + '" height="47" fill="' + c + '"/>'; });
  /* rope and helmet */
  s += '<rect x="186" y="0" width="4" height="96" fill="#e5a400"/><g transform="translate(156 86)">' + helmet().replace('<svg viewBox="0 0 64 64">', '<svg width="64" height="64" viewBox="0 0 64 64">') + '</g>';
  /* bubbles */
  [[232, 70, 7], [246, 46, 5], [238, 24, 4], [520, 120, 6], [532, 96, 4], [96, 150, 5], [108, 128, 3]].forEach(function (b) { s += '<circle cx="' + b[0] + '" cy="' + b[1] + '" r="' + b[2] + '" fill="#ddf4ff"/>'; });
  /* seabed rocks */
  s += '<path d="M0 230V206q40-18 90-8t80 2 70 6 0 24z" fill="#37464f"/><path d="M430 230v-18q50-26 120-14t110 2 100 8v22z" fill="#2a363d"/>';
  /* seaweed */
  s += '<path d="M60 206c-10-30 14-40 4-70 14 22-4 40 6 70z" fill="#58a700"/><path d="M76 206c-6-24 10-36 2-56 12 18 0 34 6 56z" fill="#58cc02"/>';
  s += '<path d="M690 214c-10-32 14-44 4-76 14 24-4 44 6 76z" fill="#58a700"/><path d="M706 214c-6-26 10-38 2-60 12 20 0 36 6 60z" fill="#58cc02"/>';
  /* treasure chest */
  s += '<g transform="translate(560 160)"><rect x="0" y="22" width="76" height="40" rx="4" fill="#cd7900"/><rect x="38" y="22" width="38" height="40" rx="4" fill="#a86300"/>' +
    '<path d="M0 26q0-24 38-24t38 24z" fill="#ff9600"/><path d="M38 2q38 0 38 24H38z" fill="#cd7900"/><rect x="0" y="22" width="76" height="6" fill="#ffc800"/>' +
    '<rect x="32" y="20" width="12" height="16" rx="3" fill="#ffc800"/><rect x="36" y="27" width="4" height="5" fill="#a86300"/></g>';
  /* anchor */
  s += '<g transform="translate(330 150)" fill="#52656d"><circle cx="20" cy="6" r="6" fill="none" stroke="#52656d" stroke-width="4"/><rect x="18" y="11" width="4" height="40"/><rect x="8" y="18" width="24" height="4" rx="2"/>' +
    '<path d="M2 36q2 18 18 18t18-18l-6 4q-2 8-12 8t-12-8z"/></g>';
  return s + '</svg>';
}

/* ---------- ui helpers ---------- */
var $app = document.getElementById('app');
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function zoneName(m) { return m < 200 ? 'Sunlight Zone' : m < 1000 ? 'Twilight Zone' : m < 4000 ? 'Midnight Zone' : m < 6000 ? 'Abyssal Zone' : 'Hadal Zone'; }
function bandOf(m) { return Math.max(0, Math.min(BANDS.length - 1, Math.floor(m / 1000))); }
function inkOf(i) { return i === 0 ? '#0b3f60' : '#fff'; }
function pill(t) { return '<span class="pill t' + t + '">' + esc(TIERS[t].n) + '</span>'; }
var timer = null;
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
var homeBtn = document.getElementById('bHome');

/* ---------- home ---------- */
function home() {
  stopTimer(); run = null; homeBtn.hidden = true;
  var day = today(), d = S.daily && S.daily.day === day ? S.daily : null, done = d && d.ans.length >= DAILY_N;
  var dm = done ? d.score * 10 : 0, nextIn = (day + 1) * 864e5 - Date.now(), hh = Math.floor(nextIn / 36e5), mm = Math.floor(nextIn % 36e5 / 6e4);
  var h = '<div class="wrap"><div class="hero">' + heroArt() + '</div>' +
    '<div class="hhead"><h1>the daily dive</h1><div class="lbl">Dive ' + (day - DAY0 + 1) + ', ' + esc(dateLabel(day)) + '</div></div>' +
    '<div class="modes">' +
    '<div class="card mode"><div class="mh"><div class="ic">' + helmet() + '</div><div><h2>Daily Dive</h2><div class="sub">7 prompts, 25 seconds each</div></div></div>' +
    (done ? '<div class="res"><b>' + fmt(dm) + ' m</b><span class="sub">' + esc(zoneName(dm)) + '</span></div><div class="sub">Next dive in ' + hh + 'h ' + mm + 'm</div>' +
      '<button class="btn wide" id="bDaily" type="button">Results</button>'
      : '<div class="res"><span class="sub">' + (d && d.ans.length ? 'Now' : 'Streak') + '</span><b>' + (d && d.ans.length ? fmt(d.score * 10) + ' m' : streakNow()) + '</b></div>' +
        '<button class="btn acc wide" id="bDaily" type="button">' + (d && d.ans.length ? 'Continue' : 'Dive') + '</button>') +
    '</div>' +
    '<div class="card mode"><div class="mh"><div class="ic">' + tank() + '</div><div><h2>Endless Dive</h2><div class="sub">45 seconds of air</div></div></div>' +
    '<div class="res"><span class="sub">Best</span><b>' + fmt(S.bestEndless) + ' m</b></div>' +
    '<button class="btn blu wide" id="bEndless" type="button">Dive</button></div></div>' +
    '<div class="stats">' +
    '<div class="card stat"><div class="lbl">Streak</div><div class="v g">' + streakNow() + '</div></div>' +
    '<div class="card stat"><div class="lbl">Best streak</div><div class="v">' + S.bestStreak + '</div></div>' +
    '<div class="card stat"><div class="lbl">Best daily</div><div class="v">' + fmt(S.bestDaily) + ' m</div></div>' +
    '<div class="card stat"><div class="lbl">Dives</div><div class="v">' + S.dives + '</div></div></div></div>';
  $app.innerHTML = h;
  document.getElementById('bDaily').onclick = function () { if (done) endScreen(dailyRun(true)); else startDaily(); };
  document.getElementById('bEndless').onclick = startEndless;
}

/* ---------- runs ---------- */
var run = null;
function dailyRun(fromSave) {
  var day = today();
  if (!S.daily || S.daily.day !== day) S.daily = { day: day, ans: [], score: 0 };
  return { mode: 'daily', day: day, set: dailySet(day), ans: S.daily.ans, score: S.daily.score, i: S.daily.ans.length };
}
function startDaily() {
  run = dailyRun();
  if (!run.ans.length) { S.dives++; save(); }
  playScreen(); nextPrompt();
}
function startEndless() {
  var r = rng((Date.now() ^ (Math.random() * 1e9)) >>> 0);
  run = { mode: 'endless', set: shuffle(DATA.map(function (_, i) { return i; }), r), ans: [], score: 0, i: 0, air: AIR };
  S.dives++; save();
  playScreen(); nextPrompt();
}
function depth() { return run.score * 10; }

function meterHTML() {
  var max = run.mode === 'daily' ? 7000 : Math.max(7000, Math.ceil((depth() + 1500) / 1000) * 1000), n = max / 1000, h = '';
  for (var i = 0; i < n; i++) h += '<div class="band" style="background:' + BANDS[Math.min(i, BANDS.length - 1)] + ';color:' + inkOf(Math.min(i, 7)) + '">' + (i ? '<span>' + i + 'k</span>' : '') + '</div>';
  var pct = 4 + Math.min(1, depth() / max) * 92;
  return h + '<div class="mk" style="top:' + pct + '%"><i></i>' + helmet() + '</div>';
}
function playScreen() {
  homeBtn.hidden = false;
  $app.innerHTML = '<div class="wrap"><div class="play"><div class="meter" id="meter"></div><div class="mcol">' +
    '<div class="phead"><div class="depth" id="dep"></div><div class="dots" id="dots"></div></div>' +
    '<div class="stage" id="stage"><div class="lbl" id="qn"></div><div class="q" id="q"></div>' +
    '<div class="tbar"><span id="tic"></span><div class="tr"><i id="tf"></i></div><b id="tt"></b></div></div>' +
    '<div id="below"></div></div></div></div>';
}
function paintHead() {
  document.getElementById('meter').innerHTML = meterHTML();
  document.getElementById('dep').innerHTML = fmt(depth()) + '<small>m</small>';
  var dots = '';
  if (run.mode === 'daily') {
    for (var i = 0; i < DAILY_N; i++) dots += '<i class="' + (i < run.ans.length ? 't' + run.ans[i].t : i === run.i ? 'cur' : '') + '"></i>';
  } else dots = '<span class="lbl">' + run.ans.length + ' answered</span>';
  document.getElementById('dots').innerHTML = dots;
  var b = bandOf(depth()), st = document.getElementById('stage');
  st.style.background = BANDS[b]; st.style.color = inkOf(b);
}
function curP() { return DATA[run.set[run.i % run.set.length]]; }
function nextPrompt() {
  stopTimer();
  if (run.mode === 'daily' && run.i >= DAILY_N) { finishDaily(); return; }
  var P = curP();
  paintHead();
  document.getElementById('qn').textContent = run.mode === 'daily' ? 'Prompt ' + (run.i + 1) + ' of ' + DAILY_N : 'Prompt ' + (run.i + 1);
  document.getElementById('q').textContent = P.q;
  document.getElementById('tic').innerHTML = run.mode === 'daily' ? '' : '<span style="display:block;width:22px;height:22px">' + tank() + '</span>';
  var below = document.getElementById('below');
  var lastHTML = run.mode === 'endless' && run.lastE ? '<div class="last">' + pill(run.lastE.t) + '<b>' + esc(run.lastE.name) + '</b><span>+' + TIERS[run.lastE.t].p + '</span></div>' : '';
  below.innerHTML = '<form class="ans" id="fa" autocomplete="off"><input class="field" id="inp" maxlength="60" placeholder="Your answer" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">' +
    '<button class="btn acc" type="submit">Dive</button></form><div class="msg" id="msg"></div>' +
    (run.mode === 'endless' ? '<div class="acts"><button class="btn sm ghost" id="bSkip" type="button">Skip -' + SKIP_COST + 's</button><button class="btn sm ghost" id="bSurf" type="button">Surface</button></div>' + lastHTML : '');
  var inp = document.getElementById('inp');
  document.getElementById('fa').onsubmit = function (e) { e.preventDefault(); submit(inp.value); };
  inp.oninput = function () { inp.classList.remove('bad'); document.getElementById('msg').textContent = ''; };
  if (run.mode === 'endless') {
    document.getElementById('bSkip').onclick = function () { run.ans.push({ i: run.set[run.i % run.set.length], a: '', t: 0, p: 0, skip: 1 }); run.air -= SKIP_COST; run.i++; run.lastE = null; if (run.air <= 0) endEndless(); else nextPrompt(); };
    document.getElementById('bSurf').onclick = function () { endEndless('surf'); };
  }
  setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 30);
  var t0 = performance.now(), lim = run.mode === 'daily' ? DAILY_T : run.air;
  if (run.mode === 'daily') run.t0 = t0;
  else { run.airAt = t0; run.airLeft = run.air; }
  function tick() {
    var left;
    if (run.mode === 'daily') left = DAILY_T - (performance.now() - t0) / 1000;
    else { left = run.airLeft - (performance.now() - run.airAt) / 1000; run.air = left; }
    var tot = run.mode === 'daily' ? DAILY_T : AIR, f = document.getElementById('tf'), tt = document.getElementById('tt');
    if (!f) return;
    f.style.width = Math.max(0, Math.min(100, left / tot * 100)) + '%';
    f.className = left <= 5 ? 'cr' : left <= 10 ? 'lo' : '';
    tt.textContent = Math.max(0, Math.ceil(left)) + 's';
    if (left <= 0) { stopTimer(); if (run.mode === 'daily') timeUp(); else endEndless(); }
  }
  tick(); timer = setInterval(tick, 100);
}
function submit(v) {
  if (!run || !timer) return;
  var P = curP(), inp = document.getElementById('inp'), msg = document.getElementById('msg');
  if (!norm(v)) return;
  var e = check(P, v);
  if (!e) {
    inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('bad', 'shake');
    msg.className = 'msg'; msg.textContent = 'Not on the list';
    if (run.mode === 'endless') run.bad = (run.bad || 0) + 1;
    return;
  }
  if (run.mode === 'daily') {
    stopTimer();
    record({ i: run.set[run.i], a: e.name, t: e.t, p: TIERS[e.t].p });
    showResult(P, e);
  } else {
    run.ans.push({ i: run.set[run.i % run.set.length], a: e.name, t: e.t, p: TIERS[e.t].p });
    run.score += TIERS[e.t].p; run.air = AIR; run.lastE = e; run.i++;
    nextPrompt();
  }
}
function record(a) {
  run.ans.push(a); run.score += a.p; run.i++;
  S.daily.ans = run.ans; S.daily.score = run.score; save();
}
function timeUp() {
  var P = curP();
  record({ i: run.set[run.i], a: '', t: 0, p: 0 });
  showResult(P, null);
}
function showResult(P, e) {
  paintHead();
  document.getElementById('tt').textContent = '';
  var t = e ? e.t : 0, last = run.i >= DAILY_N, rr = rarest(P, e);
  document.getElementById('below').innerHTML = '<div class="card result">' +
    '<div class="top2">' + pill(t) + '<span class="pts">+' + TIERS[t].p + '</span></div>' +
    '<div class="an' + (e ? '' : ' none') + '">' + (e ? esc(e.name) : 'Out of time') + '</div>' +
    (rr.length ? '<div class="rare"><span class="lbl">Rarest</span>' + rr.map(function (x) { return '<span><i class="dot t' + x.t + '"></i>' + esc(x.name) + '</span>'; }).join('') + '</div>' : '') +
    '<button class="btn acc wide" id="bNext" type="button">' + (last ? 'Surface' : 'Next') + '</button></div>';
  var b = document.getElementById('bNext');
  b.onclick = function () { nextPrompt(); };
  setTimeout(function () { try { b.focus({ preventScroll: true }); } catch (x) {} }, 30);
}
function finishDaily() {
  var day = run.day;
  if (!S.daily.counted) {
    S.daily.counted = 1;
    if (S.lastDone !== day) { S.streak = S.lastDone === day - 1 ? S.streak + 1 : 1; S.lastDone = day; }
    S.bestStreak = Math.max(S.bestStreak, S.streak);
    S.bestDaily = Math.max(S.bestDaily, run.score * 10);
    S.hist[day] = run.score;
    save();
  }
  endScreen(run);
}
function endEndless(why) {
  stopTimer();
  if (!run || run.ended) return; run.ended = 1;
  run.ans.push({ i: run.set[run.i % run.set.length], a: '', t: 0, p: 0, missed: why === 'surf' ? 2 : 1 });
  var m = run.score * 10;
  if (m > S.bestEndless) S.bestEndless = m;
  save();
  endScreen(run);
}

/* ---------- end ---------- */
function shareText(r) {
  var m = r.score * 10, head = r.mode === 'daily' ? 'Krillion Daily Dive ' + (r.day - DAY0 + 1) : 'Krillion Endless Dive';
  return head + '\n' + fmt(m) + ' m, ' + zoneName(m) + '\n' + r.ans.filter(function (a) { return !a.missed; }).map(function (a) { return a.p; }).join(' ');
}
function copy(text, btn) {
  function ok() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Share'; }, 1600); }
  function fb() { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {} ta.remove(); ok(); }
  try { navigator.clipboard.writeText(text).then(ok, fb); } catch (e) { fb(); }
}
function endScreen(r) {
  stopTimer(); run = null; homeBtn.hidden = false;
  var m = r.score * 10, b = bandOf(m), best = r.mode === 'daily' ? S.bestDaily : S.bestEndless;
  var valid = r.ans.filter(function (a) { return a.t > 0; }).length;
  var h = '<div class="wrap"><div class="sum" style="background:' + BANDS[b] + ';color:' + inkOf(b) + '">' +
    '<div class="lbl">' + (r.mode === 'daily' ? 'Daily Dive ' + (r.day - DAY0 + 1) : 'Endless Dive') + '</div>' +
    '<div class="huge">' + fmt(m) + ' m</div><div class="zn">' + esc(zoneName(m)) + '</div>' +
    '<div class="row3"><span>' + fmt(r.score) + ' points</span><span>' + valid + ' answered</span>' + (r.mode === 'daily' ? '<span>Streak ' + streakNow() + '</span>' : '') + '<span>Best ' + fmt(best) + ' m</span></div></div>' +
    '<div class="acts"><button class="btn acc" id="bShare" type="button">Share</button>' +
    (r.mode === 'endless' ? '<button class="btn blu" id="bAgain" type="button">Dive again</button>' : '') +
    '<button class="btn ghost" id="bBack" type="button">Home</button></div><div class="list">';
  r.ans.forEach(function (a) {
    var P = DATA[a.i]; if (!P) return;
    var mine = null; P.all.forEach(function (e) { if (e.name === a.a) mine = e; });
    var rr = rarest(P, mine);
    h += '<div class="card it"><div class="q">' + esc(P.q) + '</div><div class="me">' +
      (a.t ? pill(a.t) + '<span>' + esc(a.a) + '</span>' : '<span class="pill t0">' + (a.skip ? 'Skipped' : a.missed === 2 ? 'Surfaced' : a.missed ? 'Out of air' : 'Out of time') + '</span>') +
      '<span class="p">+' + a.p + '</span></div>' +
      (rr.length ? '<div class="rare"><span class="lbl">Rarest</span>' + rr.map(function (x) { return '<span><i class="dot t' + x.t + '"></i>' + esc(x.name) + '</span>'; }).join('') + '</div>' : '') + '</div>';
  });
  h += '</div></div>';
  $app.innerHTML = h;
  window.scrollTo(0, 0);
  document.getElementById('bShare').onclick = function () { copy(shareText(r), this); };
  document.getElementById('bBack').onclick = home;
  if (r.mode === 'endless') document.getElementById('bAgain').onclick = startEndless;
}

/* ---------- chrome ---------- */
var help = document.getElementById('help');
document.getElementById('tierList').innerHTML = TIERS.slice(1).map(function (t, i) { return '<div>' + pill(i + 1) + '<b>' + t.p + '</b></div>'; }).join('');
function openHelp() { help.hidden = false; }
function closeHelp() { help.hidden = true; var i = document.getElementById('inp'); if (i) try { i.focus({ preventScroll: true }); } catch (e) {} }
document.getElementById('bHelp').onclick = openHelp;
document.getElementById('bHelpX').onclick = closeHelp;
help.onclick = function (e) { if (e.target === help) closeHelp(); };
function goHome() { if (run && run.mode === 'endless' && !run.ended) { endEndless('surf'); return; } home(); }
document.getElementById('title').onclick = goHome;
homeBtn.onclick = goHome;
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !help.hidden) { closeHelp(); return; }
});

window.KR = { DATA: DATA, check: check, norm: norm, cur: function () { return run ? curP() : null; }, run: function () { return run; }, S: function () { return S; }, dailySet: dailySet, today: today };
load(function (d) { S = fix(d); home(); });
})();
</script>
</body>
