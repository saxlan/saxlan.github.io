<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>meditation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--fg:rgba(244,242,255,.92);--dim:rgba(244,242,255,.6);--glass:rgba(16,18,32,.46);--line:rgba(255,255,255,.09);--hi:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05060c;overscroll-behavior:none;color:var(--fg);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
#ui{position:fixed;inset:0;pointer-events:none;transition:opacity 1.1s ease}
#ui>*{pointer-events:auto}
body.idle #ui{opacity:0}
body.idle #ui>*{pointer-events:none}
body.idle,body.idle *{cursor:none!important}
#brand{position:fixed;top:14px;left:16px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font-weight:800;font-size:14px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .25s}
#brand:hover{background:rgba(40,42,62,.6)}
#brand i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#ffd2b0,#b9a4ff);box-shadow:0 0 10px rgba(200,180,255,.7)}
#clock{position:fixed;top:14px;right:16px;height:34px;padding:0 13px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;transition:opacity 1.1s ease,background 1.1s ease,border-color 1.1s ease;pointer-events:none}
#clock svg{width:16px;height:16px;transform:rotate(-90deg)}
#clock.hidden{opacity:0!important}
body.idle #clock{opacity:.42;background:transparent;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
#dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.btn{height:42px;min-width:42px;border-radius:999px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 13px;font-weight:700;font-size:14px;cursor:pointer;transition:background .25s,color .25s;white-space:nowrap}
.btn.ic{padding:0}
.btn:hover{background:rgba(255,255,255,.07)}
.btn.on{background:var(--hi)}
.btn svg{width:20px;height:20px;flex:none}
#sceneBtn{min-width:112px;font-weight:800}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.panel{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));width:min(440px,calc(100vw - 32px));transform:translate(-50%,10px);opacity:0;pointer-events:none!important;transition:opacity .3s ease,transform .35s cubic-bezier(.2,.8,.2,1);padding:16px;border-radius:24px;background:rgba(16,18,32,.62);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.panel.open{opacity:1;transform:translate(-50%,0);pointer-events:auto!important}
.ph{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;color:var(--dim);letter-spacing:.04em;margin:0 2px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s;display:flex;align-items:center;gap:6px}
.chip:hover{background:rgba(255,255,255,.09)}
.chip.on{background:rgba(255,255,255,.92);color:#151726;border-color:transparent}
.chip small{font-weight:700;opacity:.55;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:16px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-weight:700;font-size:12.5px;transition:background .2s,border-color .2s}
.tile:hover{background:rgba(255,255,255,.08)}
.tile.on{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.1)}
.tile b{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -6px 12px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.3)}
.sw{position:relative;width:40px;height:24px;border-radius:999px;background:rgba(255,255,255,.14);border:0;cursor:pointer;transition:background .25s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sw.on{background:#9d8cff}
.sw.on::after{transform:translateX(16px)}
.autorow{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;color:var(--fg)}
.vol{display:flex;align-items:center;gap:12px;margin-top:14px;color:var(--dim)}
.vol svg{width:18px;height:18px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.14);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;cursor:pointer}
#breath{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity 1.2s ease}
#breath.hidden{opacity:0}
#breath .scrim{position:absolute;width:min(110vmin,900px);height:min(110vmin,900px);border-radius:50%;background:radial-gradient(closest-side,rgba(4,5,12,.42),rgba(4,5,12,0))}
#orb{position:absolute;width:min(62vmin,320px);height:min(62vmin,320px);border-radius:50%;will-change:transform;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.2),rgba(196,186,255,.10) 55%,rgba(150,170,255,.05) 72%,rgba(150,170,255,0) 100%);box-shadow:0 0 60px rgba(180,170,255,.18),inset 0 0 40px rgba(255,255,255,.08)}
#orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.38)}
#orbGlow{position:absolute;width:min(62vmin,320px);height:min(62vmin,320px);border-radius:50%;border:1px solid rgba(255,255,255,.12);will-change:transform,opacity}
.bl{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 2px 16px rgba(0,0,0,.5)}
#bword{font-weight:800;font-size:20px;letter-spacing:.02em;transition:opacity .5s ease}
#bcount{font-weight:700;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
#endcard{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity 1.6s ease}
#endcard.hidden{opacity:0;pointer-events:none}
#endcard .t{font-weight:800;font-size:26px;letter-spacing:.01em}
#endcard .chip{height:44px;padding:0 24px;font-size:15px}
#endcard,body.idle #endcard *{cursor:auto!important}
#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-weight:700;color:var(--dim)}
@media (max-width:640px){
  .lbl{display:none}
  .btn{padding:0 10px}
  #sceneBtn{min-width:92px;padding:0 8px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .panel{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media (max-width:360px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="nogl">This browser cannot show these scenes.</div>

<div id="breath" class="hidden">
  <div class="scrim"></div>
  <div id="orbGlow"></div>
  <div id="orb"></div>
  <div class="bl"><span id="bword">Breathe in</span><span id="bcount">4</span></div>
</div>

<div id="endcard" class="hidden">
  <div class="t">Session complete</div>
  <button class="chip" id="again">Continue</button>
</div>

<div id="clock" class="hidden">
  <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2.4"/><circle id="clockArc" cx="10" cy="10" r="8" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="50.27" stroke-dashoffset="0"/></svg>
  <span id="clockText">5:00</span>
</div>

<div id="ui">
  <button id="brand" title="Back"><i></i>meditation</button>

  <div id="dock">
    <button class="btn ic" id="prev" aria-label="Previous scene" title="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="btn" id="sceneBtn" data-panel="p-scenes"><span id="sceneName">Waves</span></button>
    <button class="btn ic" id="next" aria-label="Next scene" title="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="sep"></span>
    <button class="btn" id="timerBtn" data-panel="p-timer" aria-label="Timer" title="Timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg><span class="lbl">Timer</span></button>
    <button class="btn" id="breathBtn" data-panel="p-breathe" aria-label="Breathe" title="Breathe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.5" stroke-dasharray="2.5 3.2"/></svg><span class="lbl">Breathe</span></button>
    <button class="btn" id="soundBtn" data-panel="p-sound" aria-label="Sound" title="Sound"><svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="lbl">Sound</span></button>
  </div>

  <div class="panel" id="p-scenes">
    <div class="ph"><span>Scenes</span><span class="autorow">Auto <button class="sw on" id="autoSw" aria-label="Auto"></button></span></div>
    <div class="grid" id="sceneGrid"></div>
  </div>
  <div class="panel" id="p-timer">
    <div class="ph"><span>Timer</span></div>
    <div class="chips" id="timerChips"></div>
  </div>
  <div class="panel" id="p-breathe">
    <div class="ph"><span>Breathing</span></div>
    <div class="chips" id="breathChips"></div>
  </div>
  <div class="panel" id="p-sound">
    <div class="ph"><span>Sound</span></div>
    <div class="chips" id="soundChips"></div>
    <div class="vol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="0.6" aria-label="Volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4zM15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></svg></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------------- shaders ---------------- */
const COMMON = `
precision highp float;
uniform vec2 uR; uniform float uT;
#define PI 3.14159265
#define TAU 6.28318531
float sat(float x){return clamp(x,0.,1.);}
float h11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float h21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*vn(p);p=p*2.03+vec2(17.1,9.3);a*=.5;}return v;}
float fbm3(vec2 p){float v=0.,a=.5;for(int i=0;i<3;i++){v+=a*vn(p);p=p*2.03+vec2(17.1,9.3);a*=.5;}return v/.875;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
mat3 rx(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,s,0.,-s,c);}
mat3 ry(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s,0.,1.,0.,s,0.,c);}
mat3 rz(float a){float c=cos(a),s=sin(a);return mat3(c,s,0.,-s,c,0.,0.,0.,1.);}
float eio(float x){x=sat(x);return x<.5?4.*x*x*x:1.-pow(-2.*x+2.,3.)/2.;}
float ess(float x){x=sat(x);return x*x*x*(x*(x*6.-15.)+10.);}
float eos(float x){x=sat(x);return 1.-pow(1.-x,4.);}
float sine(float x){x=sat(x);return .5-.5*cos(PI*x);}
float smin(float a,float b,float k){float h=sat(.5+.5*(b-a)/k);return mix(b,a,h)-k*h*(1.-h);}
vec3 toS(vec3 c){return pow(max(c,0.),vec3(.4545));}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
vec3 dith(vec3 c){return c+(h21(gl_FragCoord.xy+fract(uT*7.13)*91.7)-.5)/255.;}
`;

/* 1. Waves: layered paper-cut tide at dusk */
const FS_WAVES = `
void main(){
 vec2 uv=gl_FragCoord.xy/uR; float as=uR.x/uR.y;
 vec2 p=vec2((uv.x-.5)*as,uv.y);
 float t=uT;
 vec3 col=mix(vec3(.66,.42,.46),vec3(.055,.06,.15),pow(sat((uv.y-.32)/.68),.65));
 vec2 sun=vec2(.26*min(as,1.6),.69);
 float sd=length(p-sun);
 col+=vec3(1.,.70,.52)*(.32*exp(-sd*7.)+.16*exp(-sd*2.3));
 col=mix(col,vec3(1.,.9,.78),smoothstep(.05,.044,sd));
 float cl=fbm(vec2(p.x*1.4+t*.008,p.y*7.));
 col+=vec3(.95,.62,.62)*.07*smoothstep(.5,.85,cl)*smoothstep(.42,.75,uv.y);
 float px=1.3/uR.y;
 for(int i=0;i<7;i++){
  float fi=float(i)/6.;
  float base=.55-fi*.43;
  float amp=.010+.03*fi;
  float sp=(.10+.13*fi);
  float ph=float(i)*1.93;
  float x=p.x;
  float h=base+amp*(.62*sin(x*(3.2-fi*1.4)+t*sp+ph)+.28*sin(x*(6.1-fi*2.3)-t*sp*1.37+ph*2.3)+.10*sin(x*11.7+t*sp*.8+ph*.7));
  float d=p.y-h;
  col*=1.-.42*exp(-max(d,0.)*(20.+fi*12.));
  vec3 lc=mix(vec3(.58,.40,.54),vec3(.02,.07,.15),pow(fi,.7));
  lc=mix(lc,vec3(.12,.22,.36),.35*sin(fi*PI));
  lc=mix(lc,lc*vec3(.72,.78,.95),sat(-d*3.5));
  lc+=vec3(1.,.78,.66)*(.17-.11*fi)*exp(d*70.);
  float gl=exp(-abs(p.x-sun.x)*3.5)*(1.-fi*.5)*smoothstep(.72,.98,vn(vec2(p.x*90.+sin(p.y*40.+t*.6)*2.,p.y*520.+fi*10.+t*.5)));
  lc+=vec3(1.,.82,.66)*.35*gl*sat(-d*30.)*exp(d*4.);
  col=mix(col,lc,smoothstep(px,-px,d));
 }
 gl_FragColor=vec4(dith(col),1.);
}`;

/* 2. Fit: rounded cube easing into its slot */
const FS_FIT = `
float gY,gGlow; mat3 gRot;
float sdRB(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
float sdRR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
float hole(vec3 p){return sdRR(p.xz,vec2(.54),.15);}
float flo(vec3 p){float h=hole(p);return -smin(-p.y,h,.035);}
float cube(vec3 p){p.y-=gY;p=gRot*p;return sdRB(p,vec3(.5),.12);}
vec2 map(vec3 p){float a=flo(p),b=cube(p);return a<b?vec2(a,0.):vec2(b,1.);}
vec3 nor(vec3 p){vec2 e=vec2(.0007,-.0007);return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}
float soft(vec3 ro,vec3 rd){float r=1.,t=.02;for(int i=0;i<40;i++){float h=map(ro+rd*t).x;r=min(r,9.*h/t);t+=clamp(h,.02,.25);if(r<.002||t>7.)break;}return sat(r);}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=0;i<5;i++){float h=.02+.16*float(i)/4.;o+=(h-map(p+n*h).x)*s;s*=.85;}return sat(1.-2.2*o);}
vec3 bg(vec3 rd){return mix(vec3(.001,.0012,.003),vec3(.006,.007,.014),sat(rd.y*.6+.55));}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*uR)/min(uR.x,uR.y*1.25);
 float cyc=12.,ct=mod(uT,cyc);
 float y;
 if(ct<4.4) y=mix(4.6,.66,eos(ct/4.4));
 else if(ct<7.) y=mix(.66,-.5,ess((ct-4.4)/2.6));
 else if(ct<9.6) y=-.5;
 else y=mix(-.5,-2.6,eio((ct-9.6)/2.4));
 gY=y;
 float al=ct<9.6?eio(ct/4.9):1.;
 float k=1.-al;
 gRot=rx(k*.55)*rz(k*.3)*ry(k*1.7);
 gGlow=ct>6.6&&ct<9.6?smoothstep(6.65,6.95,ct)*exp(-max(ct-6.95,0.)*1.3):0.;
 float a=.62+.32*sin(uT*.045);
 vec3 ro=vec3(sin(a)*4.6,3.5,cos(a)*4.6),ta=vec3(0.,-.1,0.);
 vec3 ww=normalize(ta-ro),uu=normalize(cross(ww,vec3(0.,1.,0.))),vv=cross(uu,ww);
 vec3 rd=normalize(uv.x*uu+uv.y*vv+2.1*ww);
 float t=0.;vec2 h=vec2(1.);
 for(int i=0;i<110;i++){h=map(ro+rd*t);if(h.x<.0006*t)break;t+=h.x*.95;if(t>28.)break;}
 vec3 col=bg(rd);
 if(t<28.){
  vec3 p=ro+rd*t,n=nor(p);
  vec3 L=normalize(vec3(-.55,.9,.35));
  float sh=soft(p+n*.003,L),oc=ao(p,n);
  float m=h.y;
  vec3 mat=m<.5?vec3(.011,.012,.022):vec3(.85,.22,.13);
  if(m>.5)mat*=mix(.04,1.,smoothstep(-1.9,-.4,p.y));
  if(m<.5){mat*=mix(.05,1.,smoothstep(-1.5,0.,p.y));mat*=.45+.75*exp(-dot(p.xz,p.xz)*.07);}
  float dif=max(dot(n,L),0.)*sh;
  float hem=.5+.5*n.y;
  vec3 H=normalize(L-rd);
  float spe=pow(max(dot(n,H),0.),m>.5?70.:24.)*dif*(m>.5?.9:.18);
  float fre=pow(1.-max(dot(n,-rd),0.),5.);
  col=mat*(dif*vec3(1.9,1.7,1.5)+hem*vec3(.22,.27,.45)*oc+.04*oc);
  col+=mat*max(dot(n,normalize(vec3(.7,.25,-.7))),0.)*vec3(.2,.26,.5)*oc;
  col+=spe*vec3(1.,.95,.9)+fre*.25*bg(reflect(rd,n))*oc;
  if(m>.5){col+=vec3(1.,.5,.4)*.06*(1.-n.y)*oc;}
  else{float hd=hole(p);col+=vec3(1.,.55,.35)*gGlow*.9*exp(-abs(hd)*26.)*smoothstep(-.35,.0,p.y);}
  col=mix(col,bg(rd),1.-exp(-.0018*t*t));
 }
 col=aces(col*1.1);
 gl_FragColor=vec4(dith(toS(col)),1.);
}`;

/* 3. Drop: water drop forming, falling, rippling */
const FS_DROP = `
vec3 gC,gRd;float gNeck,gJR;vec3 gJC;float gA1,gA2;
const vec3 TIP=vec3(0.,1.3,0.);
float sdEll(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=sat(dot(pa,ba)/dot(ba,ba));return length(pa-ba*h)-r;}

float iCap(vec3 ro,vec3 rd,vec3 pa,vec3 pb,float r){
 vec3 ba=pb-pa,oa=ro-pa;float baba=dot(ba,ba),bard=dot(ba,rd),baoa=dot(ba,oa),rdoa=dot(rd,oa),oaoa=dot(oa,oa);
 float a=baba-bard*bard,b=baba*rdoa-baoa*bard,c=baba*oaoa-baoa*baoa-r*r*baba;float h=b*b-a*c;
 if(h>=0.){float t=(-b-sqrt(h))/a;float y=baoa+t*bard;if(y>0.&&y<baba)return t;vec3 oc=(y<=0.)?oa:ro-pb;b=dot(rd,oc);c=dot(oc,oc)-r*r;h=b*b-c;if(h>0.)return -b-sqrt(h);}

vec3 nCap(vec3 p,vec3 a,vec3 b,float r){vec3 ba=b-a,pa=p-a;float h=sat(dot(pa,ba)/dot(ba,ba));return (pa-h*ba)/r;}

void main(){
 vec2 uv=(gl_FragCoord.xy-.5*uR)/uR.y;

 if(rd.y<0.){tm=-ro.y/rd.y;kind=1.;}
 for(int i=0;i<15;i++){vec3 bp=ballP(float(i),t);float ts=isph(ro,rd,bp,.092);if(ts>0.&&ts<tm){tm=ts;kind=2.;nr=normalize(ro+rd*ts-bp);mat=pal(float(i)/14.);}}

 float tc=iCap(ro,rd,b0,b1,.035);if(tc>0.&&tc<tm){tm=tc;kind=3.;nr=nCap(ro+rd*tc,b0,b1,.035);}
 tc=iCap(ro,rd,f0,b0,.03);if(tc>0.&&tc<tm){tm=tc;kind=3.;nr=nCap(ro+rd*tc,f0,b0,.03);}
 tc=iCap(ro,rd,f1,b1,.03);if(tc>0.&&tc<tm){tm=tc;kind=3.;nr=nCap(ro+rd*tc,f1,b1,.03);}

  float sh=1.;

/* 10. Rings: a gimbal of metal rings that spin and settle flat */
const FS_RINGS = `
mat3 R0,R1,R2,R3,R4;mat3 gB;
float band(vec3 q,float R){vec2 d=vec2(length(q.xy)-R,q.z);vec2 b=vec2(.018,.055);vec2 w=abs(d)-b+.012;return length(max(w,0.))+min(max(w.x,w.y),0.)-.012;}
vec2 map(vec3 p){
 p=gB*p;
 vec2 res=vec2(length(p)-.12,5.);
 vec3 q=R0*p;float d=band(q,1.02);if(d<res.x)res=vec2(d,0.);
 q=R1*q;d=band(q,.84);if(d<res.x)res=vec2(d,1.);
 q=R2*q;d=band(q,.66);if(d<res.x)res=vec2(d,2.);
 q=R3*q;d=band(q,.48);if(d<res.x)res=vec2(d,3.);
 q=R4*q;d=band(q,.30);if(d<res.x)res=vec2(d,4.);
 return res;
}
vec3 nor(vec3 p){vec2 e=vec2(.0006,-.0006);return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}
vec3 env(vec3 d){
 vec3 c=mix(vec3(.01,.012,.02),vec3(.16,.17,.22),sat(d.y*.5+.5));
 c+=vec3(1.,.97,.92)*2.2*smoothstep(.8,.97,dot(d,normalize(vec3(-.6,.65,.45))));
 c+=vec3(.55,.68,1.)*1.1*smoothstep(.85,.99,dot(d,normalize(vec3(.85,.15,-.4))));
 c+=vec3(1.,.7,.5)*.6*smoothstep(.9,.99,dot(d,normalize(vec3(.3,-.5,.8))));
 return c;
}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*uR)/min(uR.x,uR.y);
 float cyc=17.,ct=mod(uT+14.,cyc);
 float ph=ess((ct-3.)/13.);
 float a=TAU*ph;
 R0=ry(a);R1=rx(-a);R2=ry(a);R3=rx(-2.*a);R4=ry(a);
 gB=ry(.28*sin(uT*.06))*rx(-1.05);
 vec3 ro=vec3(0.,0.,4.2);
 vec3 rd=normalize(vec3(uv,-1.75));
 vec3 col=mix(vec3(.035,.04,.07),vec3(.006,.007,.014),sat(length(uv)*1.1));
 float b=dot(ro,rd);float hb=b*b-dot(ro,ro)+1.2*1.2;
 if(hb>0.){
  float t=-b-sqrt(hb);float tmax=-b+sqrt(hb);vec2 h;
  for(int i=0;i<100;i++){h=map(ro+rd*t);if(h.x<.0004)break;t+=h.x;if(t>tmax)break;}
  if(t<tmax){
   vec3 p=ro+rd*t,n=nor(p);
   float id=h.y;
   vec3 base=id>4.5?vec3(.92,.9,.88):mod(id,2.)<.5?vec3(1.,.74,.42):vec3(.96,.62,.56);
   if(id>1.5&&id<2.5)base=vec3(.9,.84,.74);
   vec3 rf=reflect(rd,n);
   float fre=pow(1.-max(dot(-rd,n),0.),5.);
   vec3 sp=base+(1.-base)*fre;
   float oc=sat(.4+.6*map(p+n*.08).x/.08);
   col=sp*env(rf)*(.35+.65*oc)+base*.03;
   if(id>4.5)col=base*(.12+.5*max(dot(n,normalize(vec3(-.6,.65,.45))),0.))+env(rf)*(.05+.5*fre);

 gl_FragColor=vec4(dith(toS(col)),1.);
}`;

/* ---------------- GL setup ---------------- */
const cv=document.getElementById('gl');
const gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,premultipliedAlpha:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('nogl').style.display='flex';}
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)');
let reduced=!!(RM&&RM.matches);
if(RM&&RM.addEventListener)RM.addEventListener('change',e=>{reduced=e.matches;});

let VS,progs={},compProg,quad,slots=[];
function mkShader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error('shader',gl.getShaderInfoLog(s));return null;}return s;}
function mkProg(fsrc,unis){
 const fs=mkShader(gl.FRAGMENT_SHADER,fsrc);if(!fs)return null;
 const p=gl.createProgram();gl.attachShader(p,VS);gl.attachShader(p,fs);gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error('link',gl.getProgramInfoLog(p));return null;}
 const o={p};unis.forEach(u=>o[u]=gl.getUniformLocation(p,u));return o;
}
function getProg(i){
 if(progs[i]===undefined){progs[i]=mkProg(COMMON+SCENES[i].fs,['uR','uT']);}
 return progs[i];
}
function mkSlot(){return {tex:gl.createTexture(),fb:gl.createFramebuffer(),w:0,h:0};}
function sizeSlot(s,w,h){
 if(s.w===w&&s.h===h)return;
 s.w=w;s.h=h;
 gl.bindTexture(gl.TEXTURE_2D,s.tex);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.bindFramebuffer(gl.FRAMEBUFFER,s.fb);
 gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,s.tex,0);
}
if(gl){
 VS=mkShader(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');
 quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
 compProg=mkProg(`precision highp float;uniform sampler2D uA,uB;uniform float uF,uG,uTime;uniform vec2 uS;
 float h21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
 void main(){vec2 uv=gl_FragCoord.xy/uS;vec3 a=texture2D(uA,uv).rgb,b=texture2D(uB,uv).rgb;
 float f=uF*uF*(3.-2.*uF);vec3 c=mix(a,b,f);
 vec2 q=uv-.5;c*=1.-.22*smoothstep(.3,.95,length(q*vec2(1.,.85))*1.3);
 c*=uG;c+=(h21(gl_FragCoord.xy+fract(uTime*3.1)*73.)-.5)/255.;
 gl_FragColor=vec4(c,1.);}`,['uA','uB','uF','uG','uTime','uS']);
 slots=[mkSlot(),mkSlot()];
}

/* ---------------- state ---------------- */
const KEY='sx-med-prefs';
let prefs={};try{prefs=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){prefs={};}
function savePrefs(){try{localStorage.setItem(KEY,JSON.stringify(prefs));}catch(e){}}

const N=SCENES.length;
let cur=(typeof prefs.scene==='number'&&prefs.scene>=0&&prefs.scene<N)?prefs.scene:0;
let prev=-1,fadeT=1,fadeDur=3.2;
let slotOf={};slotOf[cur]=0;
const stime=new Array(N).fill(0);
let auto=prefs.auto!==false;
let autoT=0;
const AUTO_SEC=60;
let Q=1,G=0,Gt=1;
let frameAcc=0,frameCnt=0,goodT=0;
let qLocked=false;

function go(i,dir){
 i=((i%N)+N)%N;
 if(i===cur)return;
 if(prev>=0&&fadeT<1){ /* mid fade: drop the oldest */
   if(fadeT<.5){ delete slotOf[cur]; cur=i; slotOf[cur]=slotOf[prev]===0?1:0; stime[cur]=0; autoT=0; precompile(cur); updSceneUI(); savePrefs(); return; }
 }
 if(prev>=0)delete slotOf[prev];
 prev=cur;cur=i;
 slotOf[cur]=slotOf[prev]===0?1:0;
 stime[cur]=0;fadeT=0;autoT=0;
 fadeDur=reduced?5:3.2;
 precompile(cur);
 prefs.scene=cur;savePrefs();
 updSceneUI();
}
function precompile(i){if(gl)getProg(i);}
function bgCompile(){ /* compile neighbours ahead of time, spread over frames */
 const order=[(cur+1)%N,(cur+N-1)%N];for(let k=0;k<N;k++)order.push(k);
 let j=0;const step=()=>{while(j<order.length&&progs[order[j]]!==undefined)j++;if(j<order.length){getProg(order[j]);j++;setTimeout(step,250);}};
 setTimeout(step,600);
}

/* ---------------- render loop ---------------- */
let raf=0,last=0,wallT=0;
function resize(){
 const d=Math.min(window.devicePixelRatio||1,2);
 const w=Math.max(2,Math.round(innerWidth*d)),h=Math.max(2,Math.round(innerHeight*d));
 if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
}
const BUDGET=[1.6e6,1.0e6,.62e6];
function drawScene(i,slot){
 const P=getProg(i);
 const px=cv.width*cv.height;
 const sc=Math.min(1,Math.sqrt(BUDGET[SCENES[i].cost]*Q/px));
 const w=Math.max(2,Math.round(cv.width*sc)),h=Math.max(2,Math.round(cv.height*sc));
 sizeSlot(slot,w,h);
 gl.bindFramebuffer(gl.FRAMEBUFFER,slot.fb);
 gl.viewport(0,0,w,h);
 if(!P){gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);return;}
 gl.useProgram(P.p);gl.uniform2f(P.uR,w,h);gl.uniform1f(P.uT,stime[i]);
 gl.drawArrays(gl.TRIANGLES,0,3);
}
function render(){
 resize();
 const sa=slots[slotOf[cur]];
 drawScene(cur,sa);
 let sb=sa,f=1;
 if(prev>=0&&fadeT<1){sb=slots[slotOf[prev]];drawScene(prev,sb);f=fadeT;}
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 gl.viewport(0,0,cv.width,cv.height);
 gl.useProgram(compProg.p);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sb.tex);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,sa.tex);
 gl.uniform1i(compProg.uA,0);gl.uniform1i(compProg.uB,1);
 gl.uniform1f(compProg.uF,f);gl.uniform1f(compProg.uG,G);gl.uniform1f(compProg.uTime,wallT);
 gl.uniform2f(compProg.uS,cv.width,cv.height);
 gl.drawArrays(gl.TRIANGLES,0,3);
}
function frame(now){
 raf=requestAnimationFrame(frame);
 const rawDt=last?(now-last)/1000:0.016;last=now;
 const dt=Math.min(.1,rawDt);
 wallT+=dt;
 const sp=reduced?.5:1;
 stime[cur]+=dt*sp;
 if(prev>=0&&fadeT<1){stime[prev]+=dt*sp;fadeT=Math.min(1,fadeT+dt/fadeDur);if(fadeT>=1){delete slotOf[prev];prev=-1;}}
 if(auto&&!ended){autoT+=dt;if(autoT>=(reduced?90:AUTO_SEC))go(cur+1);}
 G+=(Gt-G)*Math.min(1,dt*(Gt<G?.55:1.2));
 if(Math.abs(Gt-G)<.002)G=Gt;
 // adaptive quality
 if(!qLocked&&rawDt>0&&rawDt<.5){
  frameAcc+=rawDt;frameCnt++;
  if(frameCnt>=40){const avg=frameAcc/frameCnt;frameAcc=0;frameCnt=0;
   if(avg>1/50&&Q>.3)Q=Math.max(.3,Q*.85);
   else if(avg<1/57){goodT++;if(goodT>=3&&Q<1){Q=Math.min(1,Q*1.1);goodT=0;}}else goodT=0;}
 }
 if(gl&&compProg)render();
 tickSession(dt);
 tickBreath(dt);
 tickIdle(now);
}
function start(){if(!raf){last=0;raf=requestAnimationFrame(frame);}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});

function markChips(el,v){[...el.children].forEach(b=>b.classList.toggle('on',b.dataset.v===String(v)));}

/* ---------------- audio ---------------- */
const A={ctx:null,master:null,rev:null,amb:null,ambBus:null,type:'off',vol:typeof prefs.vol==='number'?prefs.vol:.6};
$('vol').value=A.vol;
function ac(){
 if(!A.ctx){
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  try{A.ctx=new C();}catch(e){return null;}
  const c=A.ctx;
  A.master=c.createGain();A.master.gain.value=.9;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
  A.master.connect(comp);comp.connect(c.destination);
  const len=Math.floor(c.sampleRate*3.8),buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
  A.rev=c.createConvolver();A.rev.buffer=buf;const rg=c.createGain();rg.gain.value=.45;A.rev.connect(rg);rg.connect(A.master);
  A.ambBus=c.createGain();A.ambBus.gain.value=A.vol*A.vol;A.ambBus.connect(A.master);A.ambBus.connect(A.rev);
 }
 if(A.ctx.state==='suspended')A.ctx.resume();
 return A.ctx;
}
function startPad(){
 const c=A.ctx,now=c.currentTime;const out=c.createGain();out.gain.value=0;
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=850;lp.Q.value=.4;lp.connect(out);out.connect(A.ambBus);
 const nodes=[];
 const lfo=c.createOscillator();lfo.frequency.value=.045;const lg=c.createGain();lg.gain.value=320;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();nodes.push(lfo);
 const notes=[[130.81,.06,'triangle'],[196.0,.045,'triangle'],[246.94,.03,'sine'],[293.66,.03,'sine'],[329.63,.026,'sine'],[392.0,.018,'sine']];
 notes.forEach(([f,v,type])=>{[-6,6].forEach(det=>{
  const o=c.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det+(Math.random()*4-2);
  const g=c.createGain();g.gain.value=v;
  const l=c.createOscillator();l.frequency.value=.025+Math.random()*.06;const lgn=c.createGain();lgn.gain.value=v*.7;l.connect(lgn);lgn.connect(g.gain);
  o.connect(g);g.connect(lp);o.start();l.start();nodes.push(o,l);});});
 out.gain.setValueAtTime(0,now);out.gain.linearRampToValueAtTime(.9,now+5);
 return {out,nodes};
}
function startNoise(){
 const c=A.ctx,now=c.currentTime;const len=c.sampleRate*6,buf=c.createBuffer(2,len,c.sampleRate);
 for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let lo=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;lo=(lo+.02*w)/1.02;d[i]=lo*3.2;}
  const fl=Math.floor(c.sampleRate*.5);for(let i=0;i<fl;i++){const k=i/fl;d[len-fl+i]=d[len-fl+i]*(1-k)+d[i]*k;}}
 const src=c.createBufferSource();src.buffer=buf;src.loop=true;src.loopStart=0;
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
 const sw=c.createGain();sw.gain.value=.85;
 const lfo=c.createOscillator();lfo.frequency.value=.07;const lg=c.createGain();lg.gain.value=.22;lfo.connect(lg);lg.connect(sw.gain);
 const out=c.createGain();out.gain.value=0;
 src.connect(lp);lp.connect(sw);sw.connect(out);out.connect(A.ambBus);
 src.start();lfo.start();
 out.gain.setValueAtTime(0,now);out.gain.linearRampToValueAtTime(.8,now+4);
 return {out,nodes:[src,lfo]};
}
function stopAmb(){
 if(!A.amb||!A.ctx)return;const a=A.amb;A.amb=null;const now=A.ctx.currentTime;
 a.out.gain.cancelScheduledValues(now);a.out.gain.setValueAtTime(a.out.gain.value,now);a.out.gain.linearRampToValueAtTime(0,now+1.6);
 setTimeout(()=>{a.nodes.forEach(n=>{try{n.stop();}catch(e){}});try{a.out.disconnect();}catch(e){}},1900);
}
function setSound(type){
 A.type=type;
 stopAmb();
 if(type!=='off'&&ac()){A.amb=type==='pad'?startPad():startNoise();}
 markChips($('soundChips'),type);refreshDockState();
}
function chime(f,when,amp){
 const c=ac();if(!c)return;const t0=c.currentTime+(when||0);amp=amp||.16;
 [[1,1,5],[2.005,.32,3.2],[2.76,.2,2.4],[5.4,.07,1.3],[8.93,.025,.7]].forEach(([m,a,d])=>{
  const o=c.createOscillator();o.type='sine';o.frequency.value=f*m;
  const g=c.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(amp*a,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(A.master);g.connect(A.rev);o.start(t0);o.stop(t0+d+.1);});
}
chipRow($('soundChips'),[{v:'off',l:'Off'},{v:'pad',l:'Pad'},{v:'noise',l:'Noise'}],v=>setSound(v));
markChips($('soundChips'),'off');
$('vol').addEventListener('input',e=>{A.vol=+e.target.value;prefs.vol=A.vol;savePrefs();if(A.ambBus)A.ambBus.gain.setTargetAtTime(A.vol*A.vol,A.ctx.currentTime,.08);});
const ICON_ON='<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/>';
const ICON_OFF='<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>';

/* ---------------- session timer ---------------- */
const S={total:0,el:0,active:false,open:false};
let ended=false;
function fmt(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function setTimer(v){
 ac();
 if(v==='stop'){S.active=false;$('clock').classList.add('hidden');markChips($('timerChips'),'');buildTimerChips();refreshDockState();return;}
 S.active=true;S.el=0;S.open=v==='open';S.total=S.open?0:(+v)*60;
 ended=false;$('endcard').classList.add('hidden');Gt=1;
 $('clock').classList.remove('hidden');
 chime(523.25,0,.07);
 buildTimerChips();markChips($('timerChips'),v);updClock();refreshDockState();
 setTimeout(()=>setPanel(null),350);
}
function buildTimerChips(){
 const items=[{v:'1',l:'1 min'},{v:'3',l:'3 min'},{v:'5',l:'5 min'},{v:'10',l:'10 min'},{v:'20',l:'20 min'},{v:'open',l:'Open'}];
 if(S.active)items.push({v:'stop',l:'Stop'});
 chipRow($('timerChips'),items,setTimer);
}
buildTimerChips();
function updClock(){
 const arc=$('clockArc');
 if(S.open){$('clockText').textContent=fmt(S.el);arc.style.strokeDashoffset=String(50.27*(1-((S.el%60)/60)));}
 else{$('clockText').textContent=fmt(S.total-S.el);arc.style.strokeDashoffset=String(50.27*(S.el/S.total));}
}
let lastClockS=-1;
function tickSession(dt){
 if(!S.active)return;
 S.el+=dt;
 const s=Math.floor(S.el*4);if(s!==lastClockS){lastClockS=s;updClock();}
 if(!S.open&&S.el>=S.total){endSession();}
}
function endSession(){
 S.active=false;ended=true;
 chime(392,0,.16);chime(587.33,1.8,.1);
 stopAmb();markChips($('soundChips'),'off');A.type='off';
 Gt=.12;
 $('breath').classList.add('hidden');
 setTimeout(()=>{$('clock').classList.add('hidden');},1200);
 setTimeout(()=>{if(ended)$('endcard').classList.remove('hidden');},1600);
 buildTimerChips();refreshDockState();
}
$('again').onclick=()=>{ended=false;$('endcard').classList.add('hidden');$('breath').classList.toggle('hidden',!breath.p);Gt=1;wake();};

/* ---------------- breathing ---------------- */
const PAT={calm:[4,4,6,0],box:[4,4,4,4],sleep:[4,7,8,0]};
const WORDS=['Breathe in','Hold','Breathe out','Hold'];
const breath={p:prefs.breath&&PAT[prefs.breath]?prefs.breath:null,t:0,word:''};
chipRow($('breathChips'),[{v:'off',l:'Off'},{v:'calm',l:'Calm',s:'4 4 6'},{v:'box',l:'Box',s:'4 4 4 4'},{v:'sleep',l:'Sleep',s:'4 7 8'}],v=>{
 breath.p=v==='off'?null:v;breath.t=0;prefs.breath=breath.p;savePrefs();
 markChips($('breathChips'),v);$('breath').classList.toggle('hidden',!breath.p);refreshDockState();
 if(breath.p)setTimeout(()=>setPanel(null),350);
});
markChips($('breathChips'),breath.p||'off');
$('breath').classList.toggle('hidden',!breath.p);
const orb=$('orb'),orbGlow=$('orbGlow'),bword=$('bword'),bcount=$('bcount');
function tickBreath(dt){
 if(!breath.p)return;
 const seq=PAT[breath.p];const total=seq.reduce((a,b)=>a+b,0);
 breath.t=(breath.t+dt)%total;
 let t=breath.t,idx=0;while(idx<4&&t>=seq[idx]){t-=seq[idx];idx++;}
 if(idx>3)idx=3;
 const u=seq[idx]?t/seq[idx]:1;
 const lo=.5,hi=1;let s;
 const e=x=>.5-.5*Math.cos(Math.PI*x);
 if(idx===0)s=lo+(hi-lo)*e(u);else if(idx===1)s=hi;else if(idx===2)s=hi-(hi-lo)*e(u);else s=lo;
 orb.style.transform='scale('+s.toFixed(4)+')';
 const pulse=(idx===1||idx===3)?(.5+.5*Math.sin(breath.t*2.2)):0;
 orbGlow.style.transform='scale('+(s*(1.06+.03*pulse)).toFixed(4)+')';
 orbGlow.style.opacity=(.35+.4*(s-lo)/(hi-lo)).toFixed(3);
 const w=WORDS[idx];
 if(w!==breath.word||idx!==breath.idx){breath.word=w;breath.idx=idx;bword.style.opacity=0;setTimeout(()=>{bword.textContent=w;bword.style.opacity=1;},180);}
 const c=String(Math.max(1,Math.ceil(seq[idx]-t)));if(bcount.textContent!==c)bcount.textContent=c;
}

/* dock state */
function refreshDockState(){
 $('timerBtn').classList.toggle('on',openPanel==='p-timer'||S.active);
 $('breathBtn').classList.toggle('on',openPanel==='p-breathe'||!!breath.p);
 $('soundBtn').classList.toggle('on',openPanel==='p-sound'||A.type!=='off');
 $('sceneBtn').classList.toggle('on',openPanel==='p-scenes');
 $('soundIcon').innerHTML=A.type==='off'?ICON_OFF:ICON_ON;
}
refreshDockState();

/* ---------------- idle ---------------- */
let lastAct=performance.now(),idle=false,overUI=false;
document.querySelectorAll('#dock,.panel').forEach(el=>{el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')overUI=true;});el.addEventListener('pointerleave',()=>{overUI=false;});});
const IDLE_MS=3500;
function tellIdle(on){try{parent.postMessage({type:'sx-idle',on:on},'*');}catch(e){}}
function wake(){lastAct=performance.now();if(idle){idle=false;document.body.classList.remove('idle');tellIdle(false);}}
['pointermove','pointerdown','touchstart','keydown','wheel'].forEach(ev=>window.addEventListener(ev,wake,{passive:true}));
function tickIdle(now){
 if(!idle&&!overUI&&now-lastAct>IDLE_MS&&!ended){idle=true;document.body.classList.add('idle');tellIdle(true);if(openPanel)setPanel(null);}
}

/* brand / keys */
$('brand').addEventListener('click',()=>{try{parent.postMessage({type:'games-menu'},'*')}catch(e){}});
window.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')go(cur+1);
 else if(e.key==='ArrowLeft')go(cur-1);
 else if(e.key==='Escape')setPanel(null);
});
window.addEventListener('resize',()=>{if(gl)resize();});

/* test hook */
window.__med={go:i=>go(i),setFade:v=>{fadeT=v;},state:()=>({cur,prev,fadeT,Q,G,idle,S:{...S},breath:breath.p}),lockQ:v=>{Q=v;qLocked=true;},time:(t)=>{stime[cur]=t;if(prev>=0)stime[prev]=t;},endNow:()=>{if(S.active){S.el=S.total;}}};

if(gl){precompile(cur);bgCompile();start();}
})();
</script>
